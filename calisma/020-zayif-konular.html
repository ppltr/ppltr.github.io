<h1>020 · Zayıf konular çalışma bankası</h1>
<p class="sub">17 Kasım sınavında hatırladığın ve yanlış yapmış olabileceğin konular, bütün bankadan toplandı: <b>108 soru</b>. Doğru cevaplar karıştırılmış gelir. <span class="tag n">yeni</span> etiketli sorular bugün eklendi.</p>
<div id="v"></div>
</main><script>
const D=[{"k": "alt", "ad": "Altimetre ve hektopaskal", "tuzak": "Statik port kapsülün içine değil, <b>gösterge kutusuna</b> bağlıdır; kapsülün içi neredeyse vakumdur, alçalınca kapsül <b>büzülür</b>. Ayar artınca gösterge artar; ISA'da deniz seviyesinde 1 hPa ≈ <b>27 ft</b> (≈ 8 m).", "q": [{"id": 14382, "s": "010", "sec": "010-06", "en": "What altimeter sub-scale setting should be used when flying underneath a Terminal Control Area (TMA)?", "tr": "Bir Terminal Kontrol Sahası (TMA) altında uçarken hangi altimetre alt skala ayarı kullanılmalıdır?", "oe": ["The QNH of an aerodrome situated beneath the TMA or CTA", "The QFE of an aerodrome situated beneath the TMA or CTA.", "Either the Regional QNH or the QNH of an aerodrome situated beneath the TMA, whichever is the lower.", "The Regional QNH."], "ot": ["TMA veya CTA altında bulunan bir havaalanının QNH değeri", "TMA veya CTA altında bulunan bir havaalanının QFE değeri.", "Bölgesel QNH veya TMA altında bulunan bir havaalanının QNH değerinden hangisi düşükse o.", "Bölgesel QNH."], "xt": "", "xe": "", "yeni": false}, {"id": 14399, "s": "010", "sec": "010-06", "en": "What word is used to describe the vertical position of an aircraft measured above mean sea level, when QNH is set on the altimeter subscale?", "tr": "Altimetre alt skalasına QNH ayarlandığında, bir uçağın ortalama deniz seviyesinden ölçülen dikey konumunu tanımlamak için hangi kelime kullanılır?", "oe": ["Altitude", "Flight level", "Height", "Elevation"], "ot": ["İrtifa (Altitude)", "Uçuş seviyesi (Flight level)", "Yükseklik (Height)", "Rakım (Elevation)"], "xt": "", "xe": "", "yeni": false}, {"id": 14705, "s": "020", "sec": "020-15", "en": "In case of a blockage of the static ports, the following instruments become unusable: 1. Altimeter, 2. Vertical speed indicator, 3. Airspeed indicator, 4. Artificial horizon", "tr": "Statik portların tıkanması durumunda aşağıdaki cihazlar kullanılamaz hale gelir: 1. Altimetre, 2. Düşey hız göstergesi, 3. Hava hızı göstergesi, 4. Yapay ufuk", "oe": ["1, 2, 3", "1, 2, 4", "2, 3, 4", "1, 3, 4"], "ot": ["1, 2, 3", "1, 2, 4", "2, 3, 4", "1, 3, 4"], "xt": "", "xe": "", "yeni": false}, {"id": 14717, "s": "020", "sec": "020-16", "en": "An altimeter:", "tr": "Bir altimetre:", "oe": ["consists of a sealed instrument case connected to a static pressure source. The instrument case contains a sealed, partially-evacuated aneroid capsule which contracts during a descent.", "contains a partially evacuated capsule that expands during a descent.", "contains a barometric capsule that expands during a descent.", "contains a barometric capsule, connected to a total pressure source, that contracts during a descent."], "ot": ["statik basınç kaynağına bağlı, sızdırmaz bir cihaz kutusundan oluşur. Cihaz kutusu, alçalma sırasında büzülen, sızdırmaz ve kısmen boşaltılmış bir aneroit kapsül içerir.", "alçalma sırasında genişleyen, kısmen boşaltılmış bir kapsül içerir.", "alçalma sırasında genişleyen bir barometrik kapsül içerir.", "toplam basınç kaynağına bağlı, alçalma sırasında büzülen bir barometrik kapsül içerir."], "xt": "", "xe": "", "yeni": false}, {"id": 14719, "s": "020", "sec": "020-16", "en": "What height does the altimeter indicate if set to local QNH?", "tr": "Altimetre yerel QNH'ye ayarlandığında hangi yüksekliği gösterir?", "oe": ["Height above sea level.", "Flight level.", "Height above terrain.", "Height above airport."], "ot": ["Deniz seviyesi üzerindeki yükseklik.", "Uçuş seviyesi.", "Arazi üzerindeki yükseklik.", "Havaalanı üzerindeki yükseklik."], "xt": "", "xe": "", "yeni": false}, {"id": 14720, "s": "020", "sec": "020-16", "en": "When flying from a sector of warm air into one of colder air, the altimeter will:", "tr": "Sıcak bir hava bölgesinden daha soğuk bir hava bölgesine uçarken, altimetre:", "oe": ["Overread", "Show the actual height above ground.", "Be just as correct as before.", "Underread."], "ot": ["Olduğundan yüksek gösterir", "Yer üzerindeki gerçek yüksekliği gösterir.", "Öncekiyle aynı doğrulukta kalır.", "Olduğundan düşük gösterir."], "xt": "", "xe": "", "yeni": false}, {"id": 14722, "s": "020", "sec": "020-16", "en": "Which altitudes indicates an aircraft altimeter if set to standard atmospheric pressure?", "tr": "Standart atmosfer basıncına ayarlandığında, bir uçak altimetresi hangi irtifaları gösterir?", "oe": ["Flight levels.", "True altitudes above the ground surface.", "Relative altitudes.", "Absolute altitudes."], "ot": ["Uçuş seviyelerini.", "Yer yüzeyi üzerindeki gerçek irtifaları.", "Bağıl irtifaları.", "Mutlak irtifaları."], "xt": "", "xe": "", "yeni": false}, {"id": 14734, "s": "020", "sec": "020-18", "en": "If a static vent became blocked at cruise level, how would this affect the barometric instruments during a subsequent descent? I. Altimeter II. ASI", "tr": "Bir statik vent seyir irtifasında tıkanırsa, bu durum sonrasındaki bir alçalma sırasında barometrik cihazları nasıl etkiler? I. Altimetre II. ASI", "oe": ["I. remain static II. over-read", "I. under-read II. remain static", "I. under-read II. over-read", "I. remain static II. under-read"], "ot": ["I. sabit kalır II. olduğundan yüksek gösterir", "I. olduğundan düşük gösterir II. sabit kalır", "I. olduğundan düşük gösterir II. olduğundan yüksek gösterir", "I. sabit kalır II. olduğundan düşük gösterir"], "xt": "", "xe": "", "yeni": false}, {"id": 14736, "s": "020", "sec": "020-18", "en": "If, during descent, the static sources to the airspeed indicator and altimeter become blocked by ice:", "tr": "Alçalma sırasında hava hızı göstergesi ve altimetrenin statik kaynakları buzla tıkanırsa:", "oe": ["both instruments will over-read.", "both instruments will under-read.", "the airspeed indicator will under-read and the altimeter will over-read.", "the airspeed indicator will over-read and the altimeter will under-read."], "ot": ["her iki gösterge de yüksek okur.", "her iki gösterge de düşük okur.", "hava hızı göstergesi düşük okur, altimetre yüksek okur.", "hava hızı göstergesi yüksek okur, altimetre düşük okur."], "xt": "", "xe": "", "yeni": false}, {"id": 14738, "s": "020", "sec": "020-18", "en": "In icing conditions, if a static vent became blocked during level flight, during a subsequent climb, how would (i) the ALTIMETER, (ii) the VSI and (iii) the ASI be affected.", "tr": "Buzlanma şartlarında, seviye uçuş sırasında bir statik hava alığı tıkanırsa, sonrasında bir tırmanma sırasında (i) ALTİMETRE, (ii) VSI ve (iii) ASI nasıl etkilenir.", "oe": ["(i) remain static (ii) remain static (iii) under read", "(i) over read (ii) under read (iii) under read", "(i) under read (ii) remain static (iii) over read", "(i) remain static (ii) under read (iii) over read"], "ot": ["(i) sabit kalır (ii) sabit kalır (iii) düşük okur", "(i) yüksek okur (ii) düşük okur (iii) düşük okur", "(i) düşük okur (ii) sabit kalır (iii) yüksek okur", "(i) sabit kalır (ii) düşük okur (iii) yüksek okur"], "xt": "", "xe": "", "yeni": false}, {"id": 15039, "s": "050", "sec": "050-03", "en": "How many feet to be ascended to reach FL 75? (Departure elevation 1500ft, QNH=1023, temperature is standard, 1 hPa = 30 ft)", "tr": "FL 75'e ulaşmak için kaç fit tırmanmak gerekir? (Kalkış rakımı 1500 ft, QNH=1023, sıcaklık standart, 1 hPa = 30 ft)", "oe": ["6300 ft", "5800 ft", "7800 ft", "5100 ft"], "ot": ["6300 ft", "5800 ft", "7800 ft", "5100 ft"], "xt": "", "xe": "", "yeni": false}, {"id": 15383, "s": "050", "sec": "050-02", "en": "What is the atmospheric pressure at sea level in the International Standard Atmosphere?", "tr": "Uluslararası Standart Atmosfer'de deniz seviyesindeki atmosfer basıncı nedir?", "oe": ["1013.25hpa", "29.29 inch hg", "1012.35 hpa", "101.25 hpa"], "ot": ["1013.25hpa", "29.29 inch hg", "1012.35 hpa", "101.25 hpa"], "xt": "", "xe": "", "yeni": false}, {"id": 15384, "s": "050", "sec": "050-02", "en": "THE ICAO STANDARD ATMOSPHERE (ISA) assumes that, at mean sea-level,", "tr": "ICAO STANDART ATMOSFERİ (ISA), ortalama deniz seviyesinde şunu varsayar:", "oe": ["air temperature is 15°C, air pressure is 1013.25 hectopascals (millibars), and air density is 1.225 kg/m3.", "air temperature is 15°C and air pressure is 1000 hectopascals (millibars)", "temperature is 10°C, air pressure is 1225 hectopascals (millibars), and air density is 1000 gm/m3.", "air temperature is 0°C, air pressure is 1000 hectopascals (millibars), and air density is 1225 gm/m3."], "ot": ["hava sıcaklığı 15°C, hava basıncı 1013.25 hektopaskal (milibar) ve hava yoğunluğu 1.225 kg/m3'tür.", "hava sıcaklığı 15°C ve hava basıncı 1000 hektopaskaldır (milibar)", "sıcaklık 10°C, hava basıncı 1225 hektopaskal (milibar) ve hava yoğunluğu 1000 gm/m3'tür.", "hava sıcaklığı 0°C, hava basıncı 1000 hektopaskal (milibar) ve hava yoğunluğu 1225 gm/m3'tür."], "xt": "", "xe": "", "yeni": false}, {"id": 15385, "s": "050", "sec": "050-02", "en": "All aneroid altimeters are calibrated with the;", "tr": "Tüm aneroid altimetreler şuna göre kalibre edilir;", "oe": ["International Standard Atmospheric (ISA) Conditions", "Company flight regulations.", "Regional flight regulation rules.", "National flight regulation rules."], "ot": ["Uluslararası Standart Atmosfer (ISA) Koşulları", "Şirket uçuş kuralları.", "Bölgesel uçuş kuralları.", "Ulusal uçuş kuralları."], "xt": "", "xe": "", "yeni": false}, {"id": 15386, "s": "050", "sec": "050-03", "en": "The altimeter will always read:", "tr": "Altimetre her zaman şunu gösterir:", "oe": ["The vertical distance above the pressure level reffer to set in sub scale.", "The temperature corrected flight level with regional QFE set", "The altitude above airfield with QNH set to sub scale.", "The altitude above MSL with 1013 set to sub scale."], "ot": ["Alt skalada ayarlanmış olan basınç seviyesine göre dikey mesafeyi.", "Bölgesel QFE ayarlanmış, sıcaklık düzeltmeli uçuş seviyesini.", "Alt skalaya QNH ayarlanmış haldeki, havaalanı üzerindeki irtifayı.", "Alt skalaya 1013 ayarlanmış haldeki, MSL üzerindeki irtifayı."], "xt": "", "xe": "", "yeni": false}, {"id": 15387, "s": "050", "sec": "050-03", "en": "An active low pressure system is approaching. What difference would you notice in the altimeter reading of an aircraft parked in the ground, over a 30 minute period?", "tr": "Aktif bir alçak basınç sistemi yaklaşıyor. Yerde park edilmiş bir uçağın altimetre göstergesinde 30 dakikalık bir süre içinde ne fark edersiniz?", "oe": ["The reading would show an increase in height.", "It is impossible to determine how the altimeter would react.", "The reading would fluctuate rapidly.", "The reading would remain the same."], "ot": ["Gösterge yükseklikte bir artış gösterir.", "Altimetrenin nasıl tepki vereceğini belirlemek imkânsızdır.", "Gösterge hızla dalgalanır.", "Gösterge aynı kalır."], "xt": "", "xe": "", "yeni": false}, {"id": 15388, "s": "050", "sec": "050-03", "en": "Which one of them is being actually measured in the periodically by the meteorological stations?", "tr": "Bunlardan hangisi meteoroloji istasyonları tarafından periyodik olarak fiilen ölçülür?", "oe": ["QFE", "QNE", "QFF", "QNH"], "ot": ["QFE", "QNE", "QFF", "QNH"], "xt": "", "xe": "", "yeni": false}, {"id": 15389, "s": "050", "sec": "050-03", "en": "Which one is the elevation?", "tr": "Rakım (elevation) hangisidir?", "oe": ["The vertical distance between the airfield and the Mean Sea Level.", "The vertical distance between the aircraft and the ISA MSL (1013,25 hPa).", "The vertical distance between the aircraft and the Mean Sea Level.", "The vertical distance between the aircraft and the airfield."], "ot": ["Havaalanı ile Ortalama Deniz Seviyesi arasındaki dikey mesafe.", "Uçak ile ISA Ortalama Deniz Seviyesi (1013,25 hPa) arasındaki dikey mesafe.", "Uçak ile Ortalama Deniz Seviyesi arasındaki dikey mesafe.", "Uçak ile havaalanı arasındaki dikey mesafe."], "xt": "", "xe": "", "yeni": false}, {"id": 15390, "s": "050", "sec": "050-03", "en": "State the definition for QNH:", "tr": "QNH'nin tanımını belirtin:", "oe": ["QFE reduced to MSL, using standard temperature gradient", "QNE reduced to MSL, using standard temperature gradient", "QFE reduced to MSL, using actual temperature gradient", "QFF reduced to MSL, using standard temperature gradient"], "ot": ["Standart sıcaklık gradyanı kullanılarak MSL'ye indirgenmiş QFE", "Standart sıcaklık gradyanı kullanılarak MSL'ye indirgenmiş QNE", "Gerçek sıcaklık gradyanı kullanılarak MSL'ye indirgenmiş QFE", "Standart sıcaklık gradyanı kullanılarak MSL'ye indirgenmiş QFF"], "xt": "", "xe": "", "yeni": false}, {"id": 15392, "s": "050", "sec": "050-03", "en": "In order to calculate QFE from QNH, which of the following must be known ?", "tr": "QNH'den QFE hesaplamak için aşağıdakilerden hangisinin bilinmesi gerekir?", "oe": ["Elevation of the airfield.", "Elevation of the airfield and the temperature at MSL.", "Temperature at the airfield.", "Elevation and the temperature at the airfield."], "ot": ["Havaalanının rakımı.", "Havaalanının rakımı ve MSL'deki sıcaklık.", "Havaalanındaki sıcaklık.", "Havaalanının rakımı ve sıcaklığı."], "xt": "", "xe": "", "yeni": false}, {"id": 15393, "s": "050", "sec": "050-03", "en": "Which of the following statements is true ?", "tr": "Aşağıdaki ifadelerden hangisi doğrudur?", "oe": ["QNH can be equal to QFE", "QNH is always equal to QFE", "QNH is always lower than QFE", "QNH is always higher than QFE"], "ot": ["QNH, QFE'ye eşit olabilir", "QNH her zaman QFE'ye eşittir", "QNH her zaman QFE'den düşüktür", "QNH her zaman QFE'den yüksektir"], "xt": "", "xe": "", "yeni": false}, {"id": 15394, "s": "050", "sec": "050-03", "en": "With which setting on the altimeter subscale will the altimeter read zero at aerodrome level?", "tr": "Altimetre alt skalasında hangi ayarla, altimetre havaalanı seviyesinde sıfır gösterir?", "oe": ["QFE", "QNE", "QNH", "QFF"], "ot": ["QFE", "QNE", "QNH", "QFF"], "xt": "", "xe": "", "yeni": false}, {"id": 15395, "s": "050", "sec": "050-03", "en": "You are landing to an airfield. The altimeter reads the elevation of the aerodrome when … is set.", "tr": "Bir havaalanına iniş yapıyorsunuz. Altimetre, ... ayarlandığında havaalanının rakımını gösterir.", "oe": ["QNH", "QFE", "QNE", "QFF"], "ot": ["QNH", "QFE", "QNE", "QFF"], "xt": "", "xe": "", "yeni": false}, {"id": 15396, "s": "050", "sec": "050-03", "en": "What does the altimeter read when QNH set?", "tr": "Altimetre QNH ayarlıyken neyi gösterir?", "oe": ["vertical distance from mean sea level", "transition altitude", "flight level", "height above ground"], "ot": ["ortalama deniz seviyesinden dikey mesafe", "geçiş irtifası", "uçuş seviyesi", "yerden yükseklik"], "xt": "", "xe": "", "yeni": false}, {"id": 15397, "s": "050", "sec": "050-03", "en": "QNH is used at low altitudes in most countries because:", "tr": "Çoğu ülkede alçak irtifalarda QNH kullanılır çünkü:", "oe": ["mean sea level is the most suitable reference to provide clearance from obstacles and other aircraft", "QNH gives the height above ground level (AGL)", "all aircraft must fly at a flight level according to QNH", "QNH is a constant value all the time and it prevents confusion"], "ot": ["ortalama deniz seviyesi, engellerden ve diğer uçaklardan ayrılma sağlamak için en uygun referanstır", "QNH yer seviyesinden yüksekliği (AGL) verir", "tüm uçaklar QNH'ye göre bir uçuş seviyesinde uçmak zorundadır", "QNH her zaman sabit bir değerdir ve karışıklığı önler"], "xt": "", "xe": "", "yeni": false}, {"id": 15398, "s": "050", "sec": "050-03", "en": "Why do all aircraft must set 1013 hPa above a certain altitude (Transition Altitude) ?", "tr": "Bütün uçaklar neden belirli bir irtifanın (Geçiş İrtifası) üzerinde 1013 hPa ayarlamak zorundadır?", "oe": ["Because all aircraft are needed to fly at a flight level according to the same reference.", "There is no such obligation.", "Because Turkish DGCA has determined the standard pressure setting as 1013 hPa.", "Because IATA has determined the standard pressure setting as 1013 hPa."], "ot": ["Çünkü bütün uçakların aynı referansa göre bir uçuş seviyesinde uçması gerekir.", "Böyle bir zorunluluk yoktur.", "Çünkü Türk DGCA standart basınç ayarını 1013 hPa olarak belirlemiştir.", "Çünkü IATA standart basınç ayarını 1013 hPa olarak belirlemiştir."], "xt": "", "xe": "", "yeni": false}, {"id": 15399, "s": "050", "sec": "050-03", "en": "Please match the altimeter setting values with the related altimeter readings: 1. QFE 2. QNH 3. 1013 hPA A. Height B. Altitude C. Flight Level", "tr": "Lütfen altimetre ayar değerlerini ilgili altimetre göstergeleriyle eşleştirin: 1. QFE 2. QNH 3. 1013 hPa A. Yükseklik (Height) B. İrtifa (Altitude) C. Uçuş Seviyesi (Flight Level)", "oe": ["1-A, 2-B, 3-C", "1-C, 2-B, 3-A", "1-A, 2-C, 3-B", "1-B, 2-A, 3-C"], "ot": ["1-A, 2-B, 3-C", "1-C, 2-B, 3-A", "1-A, 2-C, 3-B", "1-B, 2-A, 3-C"], "xt": "", "xe": "", "yeni": false}, {"id": 15401, "s": "050", "sec": "050-03", "en": "If the QFE at ÇORLU (660 feet above sea level) is 980 hPa, what is the approximate QNH ? (1 mb= 30 feet)", "tr": "ÇORLU'da (deniz seviyesinden 660 feet yükseklikte) QFE 980 hPa ise, yaklaşık QNH nedir? (1 mb = 30 feet)", "oe": ["1002 hPa", "1010 hPa", "998 hPa", "1015 hPa"], "ot": ["1002 hPa", "1010 hPa", "998 hPa", "1015 hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 15402, "s": "050", "sec": "050-03", "en": "If the QFE at an airport (200 metres above sea level) is 1000 hPa, what is the approximate QNH? (1 mb = 27 feet)", "tr": "Bir havaalanının (deniz seviyesinden 200 metre yükseklikte) QFE'si 1000 hPa ise, yaklaşık QNH nedir? (1 mb = 27 ft)", "oe": ["1025 hPa", "1035 hPa", "990 hPa", "985 hPa"], "ot": ["1025 hPa", "1035 hPa", "990 hPa", "985 hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 15403, "s": "050", "sec": "050-03", "en": "QNH 1025 hPa at an altitude of 660 feet AMSL: What will the approximate QFE be? (Assume 1 mb=30 ft)", "tr": "660 fit AMSL irtifada QNH 1025 hPa: Yaklaşık QFE ne olur? (1 mb=30 ft kabul edin)", "oe": ["1003 hPa", "1050 hPa", "1010 hPa", "990 hPa"], "ot": ["1003 hPa", "1050 hPa", "1010 hPa", "990 hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 15404, "s": "050", "sec": "050-03", "en": "If an airfield is 240ft above mean sea level (AMSL) and the airfield QNH is 1024hPa calculate the airfield QFE given that 1 hPa =30ft.", "tr": "Bir havaalanı ortalama deniz seviyesinden (AMSL) 240 ft yüksekteyse ve havaalanı QNH'si 1024 hPa ise, 1 hPa = 30 ft olduğuna göre havaalanı QFE'sini hesaplayın.", "oe": ["1016hPa", "1032hPa", "1011hPa", "1021hPa"], "ot": ["1016hPa", "1032hPa", "1011hPa", "1021hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 15405, "s": "050", "sec": "050-03", "en": "You are setting your altimeter at an aerodrome, where the elevation is 54 ft. above MSL. The QNH you have been given is 1031 hPa. What would you expect the aerodrome QFE to be?", "tr": "Rakımı MSL üzerinden 54 ft olan bir havaalanında altimetrenizi ayarlıyorsunuz. Size verilen QNH 1031 hPa. Havaalanı QFE'sinin ne olmasını beklersiniz?", "oe": ["1029 hPa", "1009 hPa", "1032 hPa", "1001 hPa"], "ot": ["1029 hPa", "1009 hPa", "1032 hPa", "1001 hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 15406, "s": "050", "sec": "050-03", "en": "What is the relationship between QFE and QNH at an airport 54 ft. below MSL?", "tr": "MSL'nin 54 ft altında olan bir havaalanında QFE ile QNH arasındaki ilişki nedir?", "oe": ["QFE is greater than QNH", "There is no clear relationship.", "QFE is less than QNH", "QFE is equal to QNH"], "ot": ["QFE, QNH'den büyüktür", "Net bir ilişki yoktur.", "QFE, QNH'den küçüktür", "QFE, QNH'ye eşittir"], "xt": "", "xe": "", "yeni": false}, {"id": 15407, "s": "050", "sec": "050-03", "en": "Your aircraft's altimeter is set to 975 mbar at an aerodrome with an elevation of 650 ft. What does your altimeter read if the QNH = 985 mbar?", "tr": "Uçağınızın altimetresi, rakımı 650 ft olan bir havaalanında 975 mbar'a ayarlı. QNH = 985 mbar ise altimetreniz ne okur?", "oe": ["380 ft", "390 ft", "360 ft", "400 ft"], "ot": ["380 ft", "390 ft", "360 ft", "400 ft"], "xt": "", "xe": "", "yeni": false}, {"id": 15408, "s": "050", "sec": "050-03", "en": "A pilot sets the altimeter during flight to 1023 hPa instead of 1003 hPa QNH by mistake. What happens?", "tr": "Bir pilot, uçuş sırasında altimetreyi QNH 1003 hPa yerine yanlışlıkla 1023 hPa'ya ayarlıyor. Ne olur?", "oe": ["He/She actually flies 540 ft below the altitude displayed on the altimeter.", "Nothing happens.", "He/She flies at the altitude displayed on the altimeter.", "He/She actually flies 540 ft above the altitude displayed on the altimeter."], "ot": ["Aslında altimetrede görünen irtifanın 540 ft altında uçar.", "Hiçbir şey olmaz.", "Altimetrede görünen irtifada uçar.", "Aslında altimetrede görünen irtifanın 540 ft üstünde uçar."], "xt": "", "xe": "", "yeni": false}, {"id": 15409, "s": "050", "sec": "050-03", "en": "A pilot sets the altimeter to 1003 hPa instead of 1023 hPa QNH by mistake. What happens?", "tr": "Bir pilot yanlışlıkla altimetreyi 1023 hPa QNH yerine 1003 hPa'ya ayarlıyor. Ne olur?", "oe": ["He/She actually flies above the altitude displayed in the altimeter.", "Nothing happens.", "He/She actually flies at the altitude displayed in the altimeter.", "He/She actually flies below the altitude displayed in the altimeter."], "ot": ["Aslında altimetrede görünen irtifanın üzerinde uçar.", "Hiçbir şey olmaz.", "Aslında altimetrede görünen irtifada uçar.", "Aslında altimetrede görünen irtifanın altında uçar."], "xt": "", "xe": "", "yeni": false}, {"id": 15410, "s": "050", "sec": "050-03", "en": "Altimeter reads 10000ft when set to 1003 hPa QNH. What does it read when you reset the altimeter to standard pressure setting? (1hPa : 27 ft)", "tr": "Altimetre 1003 hPa QNH'ye ayarlıyken 10000 ft gösteriyor. Altimetreyi standart basınç ayarına getirdiğinizde ne gösterir? (1 hPa : 27 ft)", "oe": ["10270 ft", "9670 ft", "10330 ft", "9730 ft"], "ot": ["10270 ft", "9670 ft", "10330 ft", "9730 ft"], "xt": "", "xe": "", "yeni": false}, {"id": 15411, "s": "050", "sec": "050-03", "en": "An aircraft flies from aerodrome \"A\", (QNH= 1020 hPA) , to aerodrome \"B\", (QNH= 999 hPA) . Aerodrome \"A\" is 800 ft. above mean sea level and aerodrome \"B\" is 540 ft. above mean sea level. If the altimeter sub scale is not changed from 1020, what is the altimeter indication on landing.", "tr": "Bir uçak \"A\" havaalanından (QNH = 1020 hPa), \"B\" havaalanına (QNH = 999 hPa) uçuyor. \"A\" havaalanı ortalama deniz seviyesinin 800 ft üzerinde, \"B\" havaalanı ise ortalama deniz seviyesinin 540 ft üzerindedir. Altimetre alt skalası 1020'den değiştirilmezse, inişte altimetre göstergesi nedir?", "oe": ["1170 ft.", "-170 ft.", "170 ft.", "1470 ft."], "ot": ["1170 ft.", "-170 ft.", "170 ft.", "1470 ft."], "xt": "", "xe": "", "yeni": false}, {"id": 15412, "s": "050", "sec": "050-03", "en": "An aircraft with 1020hPa set on the altimeter sub-scale departs aerodrome 'A' which is 800ft above mean sea level (AMSL). The flight is made to the planned destination aerodrome 'B' which is in an area of low pressure, but the altimeter sub-scale is not updated en route. If the QNH at aerodrome 'B' is 999hPa, and the highest point on the landing area is 500ft AMSL, what should the altimeter read? Assume 1hPa = 30ft.", "tr": "Altimetre alt skalasında 1020hPa ayarlı bir uçak, ortalama deniz seviyesinin (AMSL) 800 ft üzerindeki 'A' havaalanından kalkıyor. Uçuş, alçak basınç bölgesinde bulunan planlanan varış havaalanı 'B'ye yapılıyor, ancak altimetre alt skalası yol boyunca güncellenmiyor. 'B' havaalanındaki QNH 999hPa ise ve iniş alanındaki en yüksek nokta 500 ft AMSL ise, altimetre ne göstermelidir? 1 hPa = 30 ft olduğunu varsayın.", "oe": ["1130ft", "-180ft", "-130ft", "830ft"], "ot": ["1130ft", "-180ft", "-130ft", "830ft"], "xt": "", "xe": "", "yeni": false}, {"id": 15414, "s": "050", "sec": "050-03", "en": "An aircraft flies at a constant indicated altitude from airfield A (QNH= 1009 hPA) to airfield B (QNH= 1019 hPA) . If the subscale is not reset from 1009, what would be expected when over airfield B?", "tr": "Bir uçak, sabit gösterge irtifasında A havaalanından (QNH= 1009 hPa) B havaalanına (QNH= 1019 hPa) uçuyor. Alt skala 1009'dan sıfırlanmazsa, B havaalanı üzerindeyken ne beklenir?", "oe": ["The indicated altitude would be less than actual altitude.", "The indicated altitude may be greater or less depending on the airfield elevation.", "The indicated altitude would be more than actual altitude.", "The indicated altitude would be the same as actual altitude."], "ot": ["Gösterge irtifası gerçek irtifadan daha az olacaktır.", "Gösterge irtifası, havaalanı rakımına bağlı olarak daha fazla ya da daha az olabilir.", "Gösterge irtifası gerçek irtifadan daha fazla olacaktır.", "Gösterge irtifası gerçek irtifayla aynı olacaktır."], "xt": "", "xe": "", "yeni": false}, {"id": 15415, "s": "050", "sec": "050-03", "en": "You are flying at a constant indicated altitude with the QNH of 1015 set within the subscale and you notice the outside air temperature has been falling constantly. What can you expect to have happened to your true altitude?", "tr": "Alt skalaya QNH 1015 ayarlanmış şekilde sabit gösterge irtifasında uçuyorsunuz ve dış hava sıcaklığının sürekli düştüğünü fark ediyorsunuz. Gerçek irtifanızda ne olmasını beklersiniz?", "oe": ["The true altitude will have decreased.", "The true altitude will have increased then decreased.", "The true altitude will have remained the same.", "The true altitude will have increased."], "ot": ["Gerçek irtifa azalmış olacaktır.", "Gerçek irtifa önce artmış sonra azalmış olacaktır.", "Gerçek irtifa aynı kalmış olacaktır.", "Gerçek irtifa artmış olacaktır."], "xt": "", "xe": "", "yeni": false}, {"id": 15416, "s": "050", "sec": "050-03", "en": "While mountain flying on a cold winter day, under fair weather conditions (QNH1013 hPa), you circle a mountain of known height at peak elevation. Comparing to the elevation of the mountain, the aneroid altimeter of your aircraft will therefore indicate... .", "tr": "Soğuk bir kış gününde dağlık arazide, iyi hava koşullarında (QNH 1013 hPa) uçarken, bilinen yüksekliğe sahip bir dağın zirve rakımı etrafında tur atıyorsunuz. Dağın rakımıyla karşılaştırıldığında, uçağınızın aneroid altimetresi... gösterecektir.", "oe": ["a higher altitude", "cannot be determined", "peak elevation", "a lower altitude"], "ot": ["daha yüksek bir irtifa", "belirlenemez", "zirve rakımı", "daha düşük bir irtifa"], "xt": "", "xe": "", "yeni": false}, {"id": 15417, "s": "050", "sec": "050-03", "en": "A pilot is flying at FL120 while the other pilot is flying at 12000 ft altitude. Which statement is most likely correct?", "tr": "Bir pilot FL120'de uçarken diğer pilot 12000 ft irtifada uçmaktadır. Hangi ifade en olası doğrudur?", "oe": ["They are flying at different heights with different altimeter settings.", "They are flying at the same height with the same altimeter setting.", "They are flying at different heights with the same altimeter setting.", "They are flying at the same height with different altimeter settings."], "ot": ["Farklı altimetre ayarlarıyla farklı yüksekliklerde uçuyorlar.", "Aynı altimetre ayarıyla aynı yükseklikte uçuyorlar.", "Aynı altimetre ayarıyla farklı yüksekliklerde uçuyorlar.", "Farklı altimetre ayarlarıyla aynı yükseklikte uçuyorlar."], "xt": "", "xe": "", "yeni": false}, {"id": 15418, "s": "050", "sec": "050-03", "en": "You are flying FL100 in an airmass which is 15°C colder than ISA, local QNH 983. What would the true altitude be?", "tr": "ISA'dan 15°C daha soğuk bir hava kütlesinde FL100'de uçuyorsunuz, yerel QNH 983. Gerçek irtifa (true altitude) ne olur?", "oe": ["8.590 ft", "11.410 ft", "10.000 ft", "10.210 ft"], "ot": ["8.590 ft", "11.410 ft", "10.000 ft", "10.210 ft"], "xt": "", "xe": "", "yeni": false}, {"id": 15841, "s": "050", "sec": "050-03", "en": "If a pilot changes the altimeter setting from 1000hPa to 1023hPa, the altitude indication will:", "tr": "Bir pilot altimetre ayarını 1000hPa'dan 1023hPa'ya değiştirirse, irtifa göstergesi:", "oe": ["Increase for 690 ft", "Increase for 1,000 ft.", "Decrease for 1,000 ft.", "Decrease for 690 ft"], "ot": ["690 ft artar", "1.000 ft artar.", "1.000 ft azalır.", "690 ft azalır"], "xt": "", "xe": "", "yeni": false}, {"id": 52008, "s": "020", "sec": "020-B2", "en": "Which of the following instruments is affected by hysteresis (lag) error?", "tr": "Aşağıdakilerden hangi alet, gecikme (hysteresis) hatasından etkilenir?", "oe": ["Altimeter", "Vertical speed indicator (VSI)", "Barometer", "Direct reading compass", "Tachometer"], "ot": ["Altimetre", "Dikey sürat göstergesi (VSI)", "Barometre", "Direk okumalı pusula", "Takometre"], "xt": "", "xe": "", "yeni": false}, {"id": 52011, "s": "020", "sec": "020-B2", "en": "Which of the following is not an altimeter error?", "tr": "Hangisi altimetre hatalarından değildir?", "oe": ["Orographic errors", "Temperature error", "Manoeuvre-induced error", "Friction errors", "Position (pressure) errors"], "ot": ["Orografik Hatalar", "Sıcaklık Hatası", "Manevra Sebepli Hata", "Sürtünme Hataları", "Pozisyon (Basınç) Hataları"], "xt": "", "xe": "", "yeni": false}, {"id": 52015, "s": "020", "sec": "020-B3", "en": "Altimeters contain aneroid (liquid-free barometer) capsules. The capsule ………….... .", "tr": "Altimetrelerde sıvısız barometre (aneroid) kapsülleri bulunur. Kapsülün ………….... .", "oe": ["has a very small amount of calibrated pressure inside and static pressure outside the capsule.", "has no static pressure inside and has residual pressure outside.", "has low pressure inside and is exposed to static pressure on the outside.", "has dynamic pressure inside and static pressure outside.", "has total pressure inside and static pressure outside."], "ot": ["içinde çok düşük miktarda kalibre edilmiş basınç, kapsülün dışında statik basınç mevcuttur.", "içinde statik basınç bulunmaz, dışında kalıntı basınç mevcuttur.", "Kapsül içi düşük basınçlıdır ve dışı statik basınca maruzdur.", "içinde dinamik basınç, dış kısmında statik basınç mevcuttur.", "içinde toplam basınç, dışında statik basınç mevcuttur."], "xt": "", "xe": "", "yeni": false}, {"id": 52204, "s": "020", "sec": "020-EC", "en": "In the ISA near mean sea level, a change of 1 hPa in the altimeter subscale setting changes the indicated altitude by approximately:", "tr": "ISA'da ortalama deniz seviyesi yakınında, altimetre basınç penceresindeki 1 hPa'lık değişiklik gösterilen irtifayı yaklaşık ne kadar değiştirir?", "oe": ["27 ft", "3 ft", "100 ft", "270 ft"], "ot": ["27 ft", "3 ft", "100 ft", "270 ft"], "xt": "ISA'da deniz seviyesi yakınında 1 hPa ≈ 27 ft (≈ 8 m): 96 × T/P = 96 × 288 / 1013,25. Meteoroloji hesaplarında kolaylık için 30 ft de kullanılır, ama sorulan bu ise 27 ft. Kaynak: Traficom PPL020, soru 150.", "xe": "Near sea level in the ISA, 1 hPa ≈ 27 ft (≈ 8 m): 96 × T/P = 96 × 288 / 1013.25. Meteorology problems often round this to 30 ft, but the answer to this question is 27 ft. Source: Traficom PPL020 Q150.", "yeni": true}, {"id": 52211, "s": "020", "sec": "020-EC", "en": "What is the purpose of the altimeter subscale (pressure setting window)?", "tr": "Altimetredeki basınç ayar penceresinin (subscale) amacı nedir?", "oe": ["To refer the altimeter reading to a selected pressure level such as QNH, QFE or 1013.25 hPa", "To correct the altimeter reading for non-standard temperature", "To correct the instrument and hysteresis errors of the altimeter", "To set the reference altitude of the transponder's altitude encoder"], "ot": ["Altimetre okumasını QNH, QFE ya da 1013,25 hPa gibi seçilen bir basınç seviyesine göre referanslamak", "Altimetre okumasını standart dışı sıcaklık için düzeltmek", "Altimetrenin alet ve histerezis hatalarını düzeltmek", "Transponderin irtifa kodlayıcısının referans irtifasını ayarlamak"], "xt": "Basınç penceresi altimetrenin sıfır noktasını seçilen basınç seviyesine bağlar: QNH → irtifa, QFE → yükseklik, 1013,25 → uçuş seviyesi. Sıcaklık ve alet hatasını düzeltmez. Kaynak: ECQB-PPL(A) AGK 101.", "xe": "The subscale sets the pressure level the altimeter measures from: QNH → altitude, QFE → height, 1013.25 → flight level. It does not correct temperature or instrument errors. Source: ECQB-PPL(A) AGK Q101.", "yeni": true}, {"id": 52245, "s": "020", "sec": "020-EC", "en": "The altimeter subscale is changed from 1000 hPa to 1010 hPa. How does the indication change?", "tr": "Altimetre basınç ayarı 1000 hPa'dan 1010 hPa'ya değiştiriliyor. Gösterge nasıl değişir?", "oe": ["It reads about 80 m (270 ft) more than before", "It reads about 80 m less than before", "It depends on the QNH", "It does not change"], "ot": ["Öncekinden yaklaşık 80 m (270 ft) fazla gösterir", "Öncekinden yaklaşık 80 m az gösterir", "QNH'ye bağlıdır", "Değişmez"], "xt": "Ayar artınca gösterge artar: 10 hPa × ~8 m (27 ft) ≈ 80 m (270 ft). 'Ayar yukarı → irtifa yukarı' (bkz. 52204). Kaynak: ECQB-PPL(A) AGK 155.", "xe": "Raising the setting raises the reading: 10 hPa × ~8 m (27 ft) ≈ 80 m (270 ft). Setting up → reading up (see 52204). Source: ECQB-PPL(A) AGK Q155.", "yeni": true}, {"id": 55005, "s": "050", "sec": "050-B2", "en": "Assuming the atmospheric pressure at sea level is 1013 hPa, approximately what is the pressure at an altitude of 350 feet?", "tr": "Deniz seviyesinde atmosferik basıncın 1013 hPa olduğunu varsayarsak, 350 feet irtifada basınç yaklaşık olarak kaçtır?", "oe": ["1000 hPa", "1002 hPa", "1040 hPa", "1026 hPa", "990 hPa"], "ot": ["1000 hPa", "1002 hPa", "1040 hPa", "1026 hPa", "990 hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 55009, "s": "050", "sec": "050-B3", "en": "If an aerodrome is 270 feet above sea level and the QNH is 1024, what will the QFE be?", "tr": "Eğer bir meydan deniz seviyesinden 270 feet yüksekte ve QNH 1024 ise QFE ne olacaktır?", "oe": ["1014 hPa", "1034 hPa", "1013 hPa", "1006 hPa", "1021 hPa"], "ot": ["1014 hPa", "1034 hPa", "1013 hPa", "1006 hPa", "1021 hPa"], "xt": "", "xe": "", "yeni": false}, {"id": 55010, "s": "050", "sec": "050-B3", "en": "What does an altimeter set to QFE show?", "tr": "QFE bağlamış olan bir altimetre neyi gösterir?", "oe": ["It shows the height above the aerodrome.", "It shows the direction of the wind relative to sea level.", "It shows the height above sea level.", "It shows the height above 1013 mb (hPa).", "It shows the difference between the aerodrome and sea level."], "ot": ["Hava meydanından olan yüksekliği gösterir.", "Rüzgarın deniz seviyesine göre yönünü gösterir.", "Deniz seviyesinden olan yüksekliği gösterir.", "1013 mb (hPa) üzerindeki yüksekliği gösterir.", "Hava meydanı ile deniz seviyesi arasındaki farkı gösterir."], "xt": "", "xe": "", "yeni": false}]}, {"k": "mag", "ad": "Manyeto ve ateşleme", "tuzak": "Kontak OFF = manyetonun primer devresi <b>toprağa bağlanır</b> (topraklanır), açılmaz. P-lead koparsa kontak kapalıyken bile pervane çevrilince motor çalışabilir. Aşırı devir düşüşü → manyeto; sert çalışma → buji.", "q": [{"id": 14593, "s": "020", "sec": "020-11", "en": "A magneto that inadvertently becomes disconnected from its ignition switch will:", "tr": "İstemeden ateşleme anahtarından bağlantısı kesilen bir manyeto:", "oe": ["cause the engine to continue running when both magneto switches are turned off.", "cause the engine to misfire when the other magneto is switched off.", "cause the failure of one plug in each cylinder.", "cause a dead cut when the other magneto is switched off."], "ot": ["her iki manyeto anahtarı da kapatıldığında motorun çalışmaya devam etmesine neden olur.", "diğer manyeto kapatıldığında motorun düzensiz ateşlemesine (misfire) neden olur.", "her silindirde bir bujinin arızalanmasına neden olur.", "diğer manyeto kapatıldığında motorun tamamen durmasına (dead cut) neden olur."], "xt": "", "xe": "", "yeni": false}, {"id": 14594, "s": "020", "sec": "020-11", "en": "Aircraft engine ignition systems incorporate a means of spark augmentation:", "tr": "Uçak motoru ateşleme sistemleri, bir kıvılcım güçlendirme (spark augmentation) düzeni içerir:", "oe": ["Because the speed of rotation of the engine, during starting, is too low for the magneto to produce sufficient energy to ignite the air-fuel mixture", "All of them.", "In order to overcome the problem of spark-retard during starting", "Because, at high engine speeds, a fat spark is needed to extract maximum power from the air-fuel mixture"], "ot": ["Çünkü çalıştırma sırasında motorun dönüş hızı, manyetonun hava-yakıt karışımını ateşlemeye yetecek enerjiyi üretmesi için çok düşüktür", "Hepsi.", "Çalıştırma sırasındaki kıvılcım gecikmesi (spark-retard) sorununun üstesinden gelmek için", "Çünkü yüksek motor devirlerinde, hava-yakıt karışımından azami gücü elde etmek için güçlü (fat) bir kıvılcım gereklidir"], "xt": "", "xe": "", "yeni": false}, {"id": 14595, "s": "020", "sec": "020-11", "en": "Aircraft piston engines are fitted with two independent ignition systems;", "tr": "Pistonlu uçak motorlarına iki bağımsız ateşleme sistemi takılır;", "oe": ["For more efficient combustion and reliability.", "One of the magnetos must start ignition before the other one joins it.", "One is used and the other remains a back-up.", "The statement above is incorrect."], "ot": ["Daha verimli yanma ve güvenilirlik için.", "Manyetolardan biri, diğeri devreye girmeden önce ateşlemeyi başlatmalıdır.", "Biri kullanılır, diğeri yedek olarak kalır.", "Yukarıdaki ifade yanlıştır."], "xt": "", "xe": "", "yeni": false}, {"id": 14596, "s": "020", "sec": "020-11", "en": "An impulse coupling is prevented from operating at higher speeds by ;", "tr": "Bir impuls kaplini (impulse coupling), yüksek devirlerde çalışmaktan şununla önlenir;", "oe": ["centrifugal force.", "electro-magnetic action of operating magneto.", "a coil spring.", "engine oil pressure."], "ot": ["merkezkaç kuvveti.", "çalışan manyetonun elektromanyetik etkisi.", "bir sarmal (coil) yay.", "motor yağ basıncı."], "xt": "", "xe": "", "yeni": false}, {"id": 14599, "s": "020", "sec": "020-11", "en": "Ignition occurs in each cylinder of a four stroke engine (TDC = Top Dead Centre):", "tr": "Dört zamanlı bir motorun her silindirinde ateşleme şöyle gerçekleşir (TDC = Üst Ölü Nokta):", "oe": ["before TDC at each second crankshaft revolution.", "before TDC at each crankshaft revolution.", "behind TDC at each second crankshaft revolution.", "behind TDC at each crankshaft revolution."], "ot": ["her ikinci krank mili turunda ÜÖN'den önce.", "her krank mili turunda ÜÖN'den önce.", "her ikinci krank mili turunda ÜÖN'den sonra.", "her krank mili turunda ÜÖN'den sonra."], "xt": "", "xe": "", "yeni": false}, {"id": 14601, "s": "020", "sec": "020-11", "en": "Magnetos are:", "tr": "Manyetolar:", "oe": ["Self-contained, engine-driven, electrical generators which produce high voltage sparks", "Fitted within the distributor, and fire in the same sequence as the spark plugs", "Used to generate low voltage sparks for the spark plugs", "Generators, driven by the cam-shaft, used to supply electrical equipment"], "ot": ["Yüksek gerilimli kıvılcım üreten, kendi kendine yeten, motor tarafından tahrik edilen elektrik jeneratörleridir", "Distribütörün içine takılıdır ve bujilerle aynı sırada ateşleme yapar", "Bujiler için düşük gerilimli kıvılcım üretmek amacıyla kullanılır", "Elektrik ekipmanını beslemek için kam milinden tahrik edilen jeneratörlerdir"], "xt": "", "xe": "", "yeni": false}, {"id": 14605, "s": "020", "sec": "020-11", "en": "The impulse coupling:", "tr": "İmpuls kaplini (impulse coupling):", "oe": ["provides high voltage at low engine rpm during engine start.", "accelerates capacitor discharge to the secondary winding that in turn generates a shower of sparks sufficient to ignite a cold fuel air mixture.", "retards ignition to ensure pre-ignition of an enriched starting mixture does not occur.", "advances ignition to compensate for slow combustion in a cold engine."], "ot": ["motor çalıştırma sırasında düşük motor devrinde yüksek gerilim sağlar.", "kondansatörün sekonder sargıya deşarjını hızlandırır, bu da soğuk bir yakıt-hava karışımını ateşlemeye yetecek bir kıvılcım yağmuru üretir.", "zenginleştirilmiş bir çalıştırma karışımının ön ateşlemesinin oluşmamasını sağlamak için ateşlemeyi geciktirir.", "soğuk bir motordaki yavaş yanmayı telafi etmek için ateşlemeyi avans yaptırır."], "xt": "", "xe": "", "yeni": false}, {"id": 14607, "s": "020", "sec": "020-11", "en": "What does show that if there is too much decrease in RPM during dead cut check?", "tr": "Dead cut kontrolü sırasında devirde (rpm) aşırı düşüş olması neyi gösterir?", "oe": ["Magneto failure", "Priming pump failure", "Battery failure", "Alternator failure"], "ot": ["Manyeto arızası", "Priming pompası arızası", "Batarya arızası", "Alternatör arızası"], "xt": "", "xe": "", "yeni": false}, {"id": 14608, "s": "020", "sec": "020-11", "en": "What happens in a magneto ignition system when the ignition switch is placed in the \"Off\" position?", "tr": "Ateşleme anahtarı \"Off\" konumuna getirildiğinde bir manyeto ateşleme sisteminde ne olur?", "oe": ["The primary circuit is connected to ground.", "The secondary circuit is fed by the condenser.", "The contact breaker breaks the low tension circuit.", "The fuel supply is shut off."], "ot": ["Primer devre toprağa bağlanır.", "Sekonder devre kondansatör tarafından beslenir.", "Kontak kesici (contact breaker) düşük gerilim devresini keser.", "Yakıt beslemesi kesilir."], "xt": "", "xe": "", "yeni": false}, {"id": 14609, "s": "020", "sec": "020-11", "en": "What is the main advantage of a magneto ignition system over a battery ignition system for an aircraft reciprocating engine?", "tr": "Bir uçak pistonlu (reciprocating) motoru için manyeto ateşleme sisteminin batarya ateşleme sistemine göre başlıca avantajı nedir?", "oe": ["A magneto has its own source of electrical energy and it is not dependent upon a battery.", "Since the magneto always receives its energy from the aircrafts electrical system, it is more reliable.", "Operation safety.", "Easy to manufacture."], "ot": ["Manyetonun kendi elektrik enerjisi kaynağı vardır ve bataryaya bağımlı değildir.", "Manyeto enerjisini her zaman uçağın elektrik sisteminden aldığından, daha güvenilirdir.", "İşletim güvenliği.", "Üretim kolaylığı."], "xt": "", "xe": "", "yeni": false}, {"id": 14611, "s": "020", "sec": "020-11", "en": "Which of the following statements are correct?\nI. Magneto dead-cut check is made with low RPM.\nII. Each magneto is feeding all spark plugs in a cylinder.\nIII. The battery is not fed by the magneto.\nIV. Magnetos deliver 13.2 V DC output to spark plugs.", "tr": "Aşağıdaki ifadelerden hangileri doğrudur?\nI. Manyeto dead-cut kontrolü düşük devirde (rpm) yapılır.\nII. Her manyeto, bir silindirdeki tüm bujileri besler.\nIII. Batarya manyeto tarafından beslenmez.\nIV. Manyetolar bujilere 13,2 V DC çıkış verir.", "oe": ["I & III", "II & IV", "I & IV", "I & II"], "ot": ["I & III", "II & IV", "I & IV", "I & II"], "xt": "", "xe": "", "yeni": false}, {"id": 14613, "s": "020", "sec": "020-11", "en": "Which of the following statements is correct about auxiliary spark augmentation methods?", "tr": "Aşağıdaki ifadelerden hangisi yardımcı kıvılcım güçlendirme yöntemleri hakkında doğrudur?", "oe": ["High tension booster coil induces a large current in secondary winding.", "High tension booster coil induces a large current in primary winding.", "Low tension booster coil induces a large current in secondary winding.", "Impulse coupling is used when the engine is turning very fast."], "ot": ["Yüksek gerilim güçlendirici (booster) bobin, sekonder sargıda büyük bir akım indükler.", "Yüksek gerilim güçlendirici (booster) bobin, primer sargıda büyük bir akım indükler.", "Düşük gerilim güçlendirici (booster) bobin, sekonder sargıda büyük bir akım indükler.", "İmpuls kaplini, motor çok hızlı dönerken kullanılır."], "xt": "", "xe": "", "yeni": false}, {"id": 14619, "s": "020", "sec": "020-12", "en": "a. Retarding the throttle.\nb. Switching off the magneto switch.\nc. Cutting off the mixture.\nPut the procedures mentioned above in a correct order so that the engine can be safely shut down.", "tr": "a. Gaz kelebeğini kısmak.\nb. Manyeto anahtarını kapatmak.\nc. Karışımı kesmek.\nYukarıda belirtilen işlemleri, motorun güvenli bir şekilde kapatılabilmesi için doğru sıraya koyun.", "oe": ["a c b.", "b a c.", "c b a.", "a b c."], "ot": ["a c b.", "b a c.", "c b a.", "a b c."], "xt": "", "xe": "", "yeni": false}, {"id": 14628, "s": "020", "sec": "020-12", "en": "Carbon deposits on spark plugs otherwise known as fouling may be prevented by:", "tr": "Kirlenme (fouling) olarak da bilinen, bujiler üzerindeki karbon birikintileri şu şekilde önlenebilir:", "oe": ["avoiding prolonged running of the engine at low RPM.", "not running the engine continuously at high RPM with a lean mixture.", "running the engine at high RPM with a lean mixture for about 5 minutes.", "cleaning them daily."], "ot": ["motorun düşük devirde (rpm) uzun süre çalıştırılmasından kaçınarak.", "motoru fakir bir karışımla sürekli olarak yüksek devirde (rpm) çalıştırmayarak.", "motoru fakir bir karışımla yaklaşık 5 dakika yüksek devirde (rpm) çalıştırarak.", "onları günlük olarak temizleyerek."], "xt": "", "xe": "", "yeni": false}, {"id": 14671, "s": "020", "sec": "020-12", "en": "Rotating the propeller by hand can be dangerous and lethal, as", "tr": "Pervaneyi elle çevirmek tehlikeli ve öldürücü olabilir, çünkü", "oe": ["the engine can start up, if the ignition switch is on", "It is not harmful", "the engine can start up, if the battery switch is on", "the engine can start up, if the master switch is on"], "ot": ["ateşleme anahtarı açıksa motor çalışmaya başlayabilir", "Zararlı değildir", "akü anahtarı açıksa motor çalışmaya başlayabilir", "ana (master) anahtar açıksa motor çalışmaya başlayabilir"], "xt": "", "xe": "", "yeni": false}, {"id": 14699, "s": "020", "sec": "020-14", "en": "When the engine is stopped, the main source of electrical power is the:", "tr": "Motor durduğunda, ana elektrik güç kaynağı:", "oe": ["Battery.", "Circuit breaker.", "Generator or alternator.", "Magneto."], "ot": ["Akü.", "Devre kesici.", "Jeneratör veya alternatör.", "Manyeto."], "xt": "", "xe": "", "yeni": false}, {"id": 52003, "s": "020", "sec": "020-B1", "en": "Where does the high voltage required by the spark plugs come from?", "tr": "Bujiler için ihtiyaç duyulan yüksek voltaj nereden sağlanır?", "oe": ["Magneto", "Ignition coil", "Dynamo", "Generator", "Alternator"], "ot": ["Manyeto", "Ateşleme bobini", "Dinamo", "Jeneratör", "Alternatör"], "xt": "", "xe": "", "yeni": false}, {"id": 52004, "s": "020", "sec": "020-B1", "en": "What is the main function of the impulse coupling in an aircraft engine ignition system?", "tr": "Uçak motoru ateşleme sisteminde impuls coupling’in temel işlevi aşağıdakilerden hangisidir?", "oe": ["To increase the magneto rotation speed during initial engine start so that the magneto can generate the electricity the spark plugs need.", "It speeds up the capacitor discharge of the secondary winding, so that multiple sparks are sent to the cold fuel-air mixture.", "It mechanically retards the ignition timing to make the initial start easier.", "To advance the ignition in order to compensate for the slow burning in a cold engine.", "It prevents premature ignition of the rich mixture during initial engine start by delaying the ignition."], "ot": ["Motorun ilk çalıştırılması esnasında manyetonun bujilerin ihtiyaç duyduğu elektriği üretebilmek amacı ile manyeto dönüsünü arttırmak.", "İkincil sarmalın kapasitör deşarjını hızlandırarak, soğuk haldeki yakıt hava karışımına çoklu kıvılcımlar gönderilmesini sağlar.", "Ateşleme zamanlamasını mekanik olarak geciktirip ilk çalıştırmayı kolaylaştırır.", "Soğuk motordaki yavaş yanma işini telafi edici şekilde ateşlemeyi artırmak.", "Motor ilk çalıştırma sırasında zengin karışımın erken ateşlemesini geciktirerek önlemeye yarar."], "xt": "", "xe": "", "yeni": false}, {"id": 52221, "s": "020", "sec": "020-EC", "en": "During the ignition grounding check the ignition switch is moved briefly to OFF and then back to BOTH. If the ignition system is correctly grounded, what happens to the RPM?", "tr": "Ateşleme topraklama kontrolünde kontak anahtarı kısa bir an OFF'a alınıp yeniden BOTH'a getirilir. Ateşleme sistemi doğru topraklanmışsa devir (RPM) ne olur?", "oe": ["It drops when OFF is selected and returns to the previous value when BOTH is selected again", "It rises when OFF is selected and returns to the previous value when BOTH is selected again", "It does not change, because the magnetos keep firing until the engine stops", "It drops when OFF is selected and stays below the previous value when BOTH is selected again"], "ot": ["OFF'ta düşer, yeniden BOTH'a alınınca önceki değerine döner", "OFF'ta artar, yeniden BOTH'a alınınca önceki değerine döner", "Değişmez, çünkü manyetolar motor durana kadar ateşlemeye devam eder", "OFF'ta düşer, yeniden BOTH'a alınınca önceki değerinin altında kalır"], "xt": "Kontak kısa bir an OFF'a alınınca her iki manyetonun primer devresi toprağa bağlanır, ateşleme kesilir ve devir düşer; BOTH'a dönünce devir eski değerine gelir. Devir düşmüyorsa manyeto toprak bağlantısı (P-lead) kopuktur: kontak kapalıyken bile pervane çevrilirse motor çalışabilir (bkz. 14593, 14608). Kaynak: ECQB-PPL(A) AGK 89.", "xe": "Switching briefly to OFF earths both magneto primary circuits, ignition stops and RPM drops; back on BOTH the RPM recovers. If it does not drop, a P-lead is broken and the engine may fire with the switch off if the propeller is turned (see 14593, 14608). Source: ECQB-PPL(A) AGK Q89.", "yeni": true}, {"id": 52222, "s": "020", "sec": "020-EC", "en": "During the magneto check the engine runs unusually rough on one magneto. What is the most likely cause?", "tr": "Manyeto kontrolünde motor tek manyetoda alışılmadık biçimde sert (düzensiz) çalışıyor. En olası neden nedir?", "oe": ["A defective (e.g. fouled) spark plug", "The starter is still engaged", "The fuel tank vent is blocked", "The alternator has failed"], "ot": ["Arızalı (ör. kirlenmiş) buji", "Marş motoru hâlâ devrede", "Yakıt tankı havalandırması tıkalı", "Alternatör arızalanmış"], "xt": "Tek manyetoda sert ve düzensiz çalışma genellikle o manyetonun beslediği bujilerden birinin arızalı ya da kirlenmiş olduğunu gösterir. Aşırı devir düşüşü ise manyeto arızasına işarettir (14607); ikisi farklı cevaplı tuzak çiftidir. Kaynak: ECQB-PPL(A) AGK 62.", "xe": "Rough running on one magneto usually points to a defective or fouled spark plug fed by that magneto. An excessive RPM drop points to a magneto fault (14607); the two are a trap pair with different answers. Source: ECQB-PPL(A) AGK Q62.", "yeni": true}, {"id": 62001, "s": "020", "sec": "020-EK", "en": "An engine with dual ignition suffers the failure of one magneto in cruising flight. What is the most likely result?", "tr": "Çift ateşlemeli bir motorda seyir uçuşunda manyetolardan biri arızalanırsa en olası sonuç nedir?", "oe": ["A slight drop in RPM and power; the engine keeps running on the other magneto", "The engine stops, because half of the cylinders no longer fire", "No change at all, because each cylinder needs only one spark plug", "Heavy backfiring and black smoke from the exhaust"], "ot": ["Devir ve güçte hafif düşüş; motor diğer manyetoyla çalışmaya devam eder", "Motor durur; çünkü silindirlerin yarısı ateşlenmez", "Hiçbir değişiklik olmaz; çünkü her silindir için tek buji yeterlidir", "Şiddetli geri tepme ve egzozdan siyah duman"], "xt": "Her silindirde iki buji ve ayrı iki manyeto vardır; biri arızalanınca motor çalışmayı sürdürür, yalnız yanma yavaşladığı için devir ve güç hafifçe düşer. Run-up'ta manyeto kontrolü bu yüzden yapılır.", "xe": "Each cylinder has two plugs fed by two independent magnetos; if one fails the engine keeps running, with only a slight loss of RPM and power because combustion is slower. That is why the magneto check is done at run-up.", "yeni": false}]}, {"k": "elec", "ad": "Elektrik sistemi ve voltaj", "tuzak": "Sistem (alternatör) gerilimi <b>14 V / 28 V</b>, akü <b>12 V / 24 V</b>. Alternatör arızasında akü boşalana kadar besler; manyetolar elektrik sisteminden bağımsızdır.", "q": [{"id": 14638, "s": "020", "sec": "020-12", "en": "If the starter warning light remains on after the starter button (starter switch) has been released:", "tr": "Starter düğmesi (starter anahtarı) bırakıldıktan sonra starter uyarı ışığı yanık kalırsa:", "oe": ["the engine should be immediately stopped.", "manually disengage the starter.", "the engine RPM should be increased as it is too low for starter auto disconnect.", "the alternator output level should be checked."], "ot": ["motor derhal durdurulmalıdır.", "starteri elle devre dışı bırakın.", "starterin otomatik ayrılması için çok düşük olduğundan motor devri (rpm) artırılmalıdır.", "alternatör çıkış seviyesi kontrol edilmelidir."], "xt": "", "xe": "", "yeni": false}, {"id": 14677, "s": "020", "sec": "020-14", "en": "A 100 amp/ hour battery will, in theory, supply 20 amps for up to:", "tr": "100 amper/saatlik bir akü, teoride 20 amperi en fazla ne kadar süre sağlayabilir:", "oe": ["5 hours", "6 hours", "4 hours", "2 hours."], "ot": ["5 saat", "6 saat", "4 saat", "2 saat."], "xt": "", "xe": "", "yeni": false}, {"id": 14679, "s": "020", "sec": "020-14", "en": "A double-pole electrical system:", "tr": "Çift kutuplu (double-pole) bir elektrik sistemi:", "oe": ["Requires on cable taking the current from the generator or alternator to the component and another to complete the circuit back to the generator or alternator", "Is fail-safe, and so does not require a battery", "Has the return current flowing back through the metal of the airframe to complete the circuit", "Is not required in aircraft which are made of non-conductive materials"], "ot": ["Akımı jeneratör veya alternatörden bileşene taşıyan bir kablo ve devreyi jeneratör veya alternatöre geri tamamlayan başka bir kablo gerektirir", "Fail-safe'dir ve bu nedenle akü gerektirmez", "Devreyi tamamlamak için dönüş akımının uçak gövdesinin metali üzerinden geri aktığı bir sistemdir", "İletken olmayan malzemelerden yapılmış uçaklarda gerekli değildir"], "xt": "", "xe": "", "yeni": false}, {"id": 14682, "s": "020", "sec": "020-14", "en": "Assume that a 24 V 60 AH Lead Acid battery is connected to a central busbar. The consumption from the battery is 6A. What is the endurance of battery?", "tr": "24 V 60 AH'lik bir kurşun asit akünün merkezi baraya bağlı olduğunu varsayın. Aküden çekilen tüketim 6A'dir. Akünün dayanma süresi nedir?", "oe": ["10 hours", "4 minutes", "4 hours", "10 minutes"], "ot": ["10 saat", "4 dakika", "4 saat", "10 dakika"], "xt": "", "xe": "", "yeni": false}, {"id": 14683, "s": "020", "sec": "020-14", "en": "Assuming the initiating cause is removed , which of these statements about resetting are correct or incorrect ?\nI. A fuse is not resettable.\nII. A circuit breaker is resettable.", "tr": "Başlatıcı nedenin ortadan kaldırıldığı varsayılırsa, sıfırlama (resetting) ile ilgili aşağıdaki ifadelerden hangileri doğru ya da yanlıştır?\nI. Sigorta (fuse) sıfırlanabilir değildir.\nII. Devre kesici (circuit breaker) sıfırlanabilir.", "oe": ["I is correct , II is correct.", "I is incorrect , II is correct.", "I is correct , II is incorrect.", "I is incorrect , II is incorrect."], "ot": ["I doğru, II doğru.", "I yanlış, II doğru.", "I doğru, II yanlış.", "I yanlış, II yanlış."], "xt": "", "xe": "", "yeni": false}, {"id": 14684, "s": "020", "sec": "020-14", "en": "Below is a schematic diagram of a light aircraft DC electrical system using a centre-zero reading ammeter. The most probable cause of the needle of the ammeter being in the centre-zero position would be that:", "tr": "Aşağıda, orta-sıfır okumalı bir ampermetre kullanan hafif bir uçağın DC elektrik sistemine ait şema bulunmaktadır. Ampermetre ibresinin orta-sıfır konumunda olmasının en olası nedeni şudur:", "oe": ["The battery is fully charged", "The battery is flat", "The alternator has failed", "All electrical loads have been switched off"], "ot": ["Akü tam doludur", "Akü boşalmıştır", "Alternatör arızalanmıştır", "Tüm elektrik yükleri kapatılmıştır"], "xt": "", "xe": "", "yeni": false}, {"id": 14685, "s": "020", "sec": "020-14", "en": "Below is a schematic diagram of a light aircraft DC electrical system. The most probable cause of the needle of the loadmeter being in the position shown would be that:", "tr": "Aşağıda hafif bir uçağın DC elektrik sistemine ait şema bulunmaktadır. Yük göstergesinin (loadmeter) ibresinin gösterilen konumda olmasının en olası nedeni şudur:", "oe": ["The alternator has failed", "All electrical loads have been switched off", "The battery is flat", "The battery is fully charged"], "ot": ["Alternatör arızalanmıştır", "Tüm elektrik yükleri kapatılmıştır", "Akü boşalmıştır", "Akü tam doludur"], "xt": "", "xe": "", "yeni": false}, {"id": 14687, "s": "020", "sec": "020-14", "en": "Fuses are rated to a value by:", "tr": "Sigortalar (fuse) şuna göre bir değerle derecelendirilir:", "oe": ["The number of amperes they will carry.", "Their resistance measured in ohms.", "Their wattage.", "The number of volts they will pass."], "ot": ["Taşıyacakları amper sayısına.", "Ohm cinsinden ölçülen dirençlerine.", "Watt değerlerine.", "Geçirecekleri volt sayısına."], "xt": "", "xe": "", "yeni": false}, {"id": 14688, "s": "020", "sec": "020-14", "en": "In flight, when a circuit breaker interrupted the circuit;", "tr": "Uçuşta bir devre kesici (circuit breaker) devreyi kestiğinde;", "oe": ["it must be resetted once", "it must not be resetted", "it must be resetted 5 times at the very most", "it should be resetted for every interruption"], "ot": ["bir kez sıfırlanmalıdır", "sıfırlanmamalıdır", "en fazla 5 kez sıfırlanmalıdır", "her kesintide sıfırlanmalıdır"], "xt": "", "xe": "", "yeni": false}, {"id": 14693, "s": "020", "sec": "020-14", "en": "Theoretically, a 100 Ah battery will supply 25 amps for", "tr": "Teorik olarak, 100 Ah'lik bir akü 25 amperi ne kadar süre sağlar", "oe": ["4 hours", "25 minutes", "100 minutes", "25 hours"], "ot": ["4 saat", "25 dakika", "100 dakika", "25 saat"], "xt": "", "xe": "", "yeni": false}, {"id": 14695, "s": "020", "sec": "020-14", "en": "Two 12 volt 40 ampere hour capacity batteries connected in parallel would result in a total voltage and capacity of:", "tr": "Paralel bağlanmış iki adet 12 volt 40 amper-saat kapasiteli akü, toplamda şu voltaj ve kapasiteyi verir:", "oe": ["12 volts and 80 ampere-hours.", "12 volts and 40 ampere-hours.", "24 volts and 20 ampere-hours.", "24 volts and 40 ampere-hours."], "ot": ["12 volt ve 80 amper-saat.", "12 volt ve 40 amper-saat.", "24 volt ve 20 amper-saat.", "24 volt ve 40 amper-saat."], "xt": "", "xe": "", "yeni": false}, {"id": 14696, "s": "020", "sec": "020-14", "en": "Two 12 volt 40 ampere-hour capacity batteries connected in series would result in a total capacity of:", "tr": "Seri bağlanmış iki adet 12 volt 40 amper-saat kapasiteli akü, toplamda şu kapasiteyi verir:", "oe": ["40 ampere-hours at 24 volts.", "40 ampere-hours at 12 volts.", "20 ampere-hours at 24 volts.", "80 ampere-hours at 12 volts."], "ot": ["24 voltta 40 amper-saat.", "12 voltta 40 amper-saat.", "24 voltta 20 amper-saat.", "12 voltta 80 amper-saat."], "xt": "", "xe": "", "yeni": false}, {"id": 14697, "s": "020", "sec": "020-14", "en": "What is the risk in flight, if the needle of the zero ammeter is at excessive positive side of the indicator?", "tr": "Sıfır merkezli ampermetrenin ibresi göstergenin aşırı pozitif tarafındaysa uçuşta risk nedir?", "oe": ["Battery overcharging", "There is no risk", "Alternator failure", "Battery discharging"], "ot": ["Akünün aşırı şarj olması", "Risk yoktur", "Alternatör arızası", "Akünün boşalması"], "xt": "", "xe": "", "yeni": false}, {"id": 14698, "s": "020", "sec": "020-14", "en": "When an \"open circuit\" occurs in an electrical supply system, the :", "tr": "\"Açık devre\" (open circuit) bir elektrik besleme sisteminde oluştuğunda:", "oe": ["loss of continuity will prevent its working components from functioning.", "fuse or CB should isolate the circuit due to excess current drawn.", "load as indicated by the ammeter will increase.", "component will operate normally, but will not switch off."], "ot": ["süreklilik kaybı, çalışan bileşenlerin işlev görmesini engeller.", "sigorta veya devre kesici (CB), çekilen aşırı akım nedeniyle devreyi izole eder.", "ampermetrenin gösterdiği yük artar.", "bileşen normal çalışır, ancak kapanmaz."], "xt": "", "xe": "", "yeni": false}, {"id": 52203, "s": "020", "sec": "020-SH", "en": "Light piston-engine aircraft usually have a DC electrical system whose nominal (alternator) voltage is:", "tr": "Pistonlu hafif uçaklarda DC elektrik sisteminin nominal (alternatör) gerilimi genellikle kaçtır?", "oe": ["14 V or 28 V, charging a 12 V or 24 V battery", "115 V or 200 V AC, supplied at 400 Hz", "6 V or 12 V, charging a 6 V battery", "48 V, charging two 24 V batteries in series"], "ot": ["14 V ya da 28 V; 12 V ya da 24 V'luk aküyü şarj eder", "115 V ya da 200 V AC; 400 Hz'de beslenir", "6 V ya da 12 V; 6 V'luk aküyü şarj eder", "48 V; seri bağlı iki 24 V aküyü şarj eder"], "xt": "Hafif uçakların çoğunda 14 V ya da 28 V DC sistem vardır; alternatör gerilimi aküden yüksek olmalı ki 12 V ya da 24 V'luk aküyü şarj etsin. 115/200 V 400 Hz AC büyük uçaklarındır. Kullanıcının 2026-11-17 sınavında hatırladığı konudan bağımsız yazıldı; resmî soru metni değildir.", "xe": "Most light aircraft have a 14 V or 28 V DC system; the alternator voltage must be above the 12 V or 24 V battery voltage to charge it. 115/200 V 400 Hz AC is used on large aircraft. Written independently from a topic the user recalled from the 2026-11-17 exam; not an official exam transcript.", "yeni": true}, {"id": 52212, "s": "020", "sec": "020-EC", "en": "The alternator of a light aircraft fails in flight. What is the immediate effect?", "tr": "Hafif bir uçağın alternatörü uçuşta arızalanıyor. İlk etkisi ne olur?", "oe": ["Little change at first: the battery supplies the electrical system until it is discharged", "The engine stops, because the magnetos are powered by the alternator", "The altimeter and airspeed indicator stop working at once", "The battery is immediately disconnected and all electrical equipment fails"], "ot": ["Başta pek bir şey değişmez: akü boşalana kadar elektrik sistemini besler", "Manyetolar alternatörden beslendiği için motor durur", "Altimetre ve sürat saati hemen çalışmaz olur", "Akü hemen devreden çıkar ve bütün elektrikli cihazlar susar"], "xt": "Alternatör arızalanınca akü devreyi besler; elektrik yükü azaltılır, iniş planlanır. Manyetolar elektrik sisteminden bağımsızdır, motor çalışmaya devam eder. Kaynak: ECQB-PPL(A) AGK 54.", "xe": "When the alternator fails the battery carries the electrical load; shed load and plan to land. The magnetos are independent of the electrical system, so the engine keeps running. Source: ECQB-PPL(A) AGK Q54.", "yeni": true}, {"id": 52231, "s": "020", "sec": "020-EC", "en": "Which equipment may be affected by a failure of the aircraft's electrical system?", "tr": "Uçağın elektrik sistemi arızalanırsa hangi cihazlar etkilenebilir?", "oe": ["Radios, radio navigation equipment and electrically driven gyro instruments", "Radios, radio navigation equipment and the magnetic compass", "Fuel quantity indication, radios and the altimeter", "Airspeed indicator, altimeter and vacuum-driven attitude indicator"], "ot": ["Telsizler, radyo seyrüsefer cihazları ve elektrikli jiroskoplu göstergeler", "Telsizler, radyo seyrüsefer cihazları ve manyetik pusula", "Yakıt miktar göstergesi, telsizler ve altimetre", "Sürat saati, altimetre ve vakumlu yapay ufuk"], "xt": "Pitot-statik göstergeler (sürat, altimetre, variometre), manyetik pusula ve vakumlu jiroskoplar elektriğe bağlı değildir; telsiz, navigasyon ve elektrikli jiroskoplar etkilenir. Motor manyetolarla çalışmaya devam eder. Kaynak: ECQB-PPL(A) AGK 57.", "xe": "Pitot-static instruments, the magnetic compass and vacuum gyros do not need electrical power; radios, navigation equipment and electric gyros do. The engine keeps running on its magnetos. Source: ECQB-PPL(A) AGK Q57.", "yeni": true}]}, {"k": "fuel", "ad": "Yakıt türleri ve 100LL", "tuzak": "100LL = 100 oktan, <b>low lead</b> (düşük kurşun, kurşunsuz değil), rengi <b>mavi</b>. AVGAS 100 yeşil. Oktan = vuruntuya (detonasyona) direnç.", "q": [{"id": 14566, "s": "020", "sec": "020-09", "en": "When refuelling, to ensure that the correct type of fuel is used, both the fuel itself and tank labels are colour coded. The primary colour for all labels relating to 100 LL is …(i)… and the colour of the fuel itself should be …(ii)… .", "tr": "Yakıt ikmali sırasında doğru yakıt türünün kullanıldığından emin olmak için hem yakıtın kendisi hem de tank etiketleri renk koduyla belirtilir. 100 LL ile ilgili tüm etiketlerin ana rengi …(i)… ve yakıtın kendi rengi …(ii)… olmalıdır.", "oe": ["(i)red (ii)blue", "(i)red (ii)straw", "(i)blue (ii)straw", "(i)black (ii)red"], "ot": ["(i) kırmızı (ii) mavi", "(i) kırmızı (ii) saman rengi", "(i) mavi (ii) saman rengi", "(i) siyah (ii) kırmızı"], "xt": "", "xe": "", "yeni": false}, {"id": 14567, "s": "020", "sec": "020-09", "en": "Which colour does Avgas 100 LL have?", "tr": "Avgas 100 LL hangi renktedir?", "oe": ["Blue", "Green", "Yellow", "Red"], "ot": ["Mavi", "Yeşil", "Sarı", "Kırmızı"], "xt": "", "xe": "", "yeni": false}, {"id": 14598, "s": "020", "sec": "020-11", "en": "If the engine gets too hot, the mixture may ignite before the spark plug fires.", "tr": "Motor aşırı ısınırsa, karışım buji ateşlemeden önce kendiliğinden tutuşabilir.", "oe": ["This is called pre-ignition.", "The throttle should be opened to assist in cooling the engine.", "The mixture should be weakened to assist in cooling the engine.", "This is called detonation."], "ot": ["Buna ön ateşleme (pre-ignition) denir.", "Motorun soğumasına yardımcı olmak için gaz kelebeği açılmalıdır.", "Motorun soğumasına yardımcı olmak için karışım fakirleştirilmelidir.", "Buna detonasyon denir."], "xt": "", "xe": "", "yeni": false}, {"id": 14603, "s": "020", "sec": "020-11", "en": "Pre-ignition:", "tr": "Ön ateşleme (pre-ignition):", "oe": ["Is usually caused by a hot spot in the combustion chamber.", "Happens because of a giant spark produced at the plugs.", "Is the same thing as detonation.", "Is also known as pinking."], "ot": ["Genellikle yanma odasındaki sıcak bir noktadan kaynaklanır.", "Bujilerde üretilen dev bir kıvılcım nedeniyle meydana gelir.", "Detonasyon ile aynı şeydir.", "Pinking olarak da bilinir."], "xt": "", "xe": "", "yeni": false}, {"id": 14633, "s": "020", "sec": "020-12", "en": "Detonation:", "tr": "Detonasyon:", "oe": ["Is harmful to the pistons", "Cannot be identified externally", "Is part of normal engine running", "Is also known as 'piston slap'"], "ot": ["Pistonlara zarar verir", "Dışarıdan tespit edilemez", "Normal motor çalışmasının bir parçasıdır", "'Piston slap' olarak da bilinir"], "xt": "", "xe": "", "yeni": false}, {"id": 52007, "s": "020", "sec": "020-B1", "en": "In piston engines, detonation related to the air-fuel mixture is caused by which of the following?", "tr": "Pistonlu motorlarda hava yakıt karışımı kaynaklı detonasyon aşağıdakilerden hangisi sebebiyle oluşur?", "oe": ["It is caused by a lean mixture and high cylinder head temperature.", "It is caused by a rich mixture and low cylinder head temperature.", "It occurs when the engine kicks back during engine starting.", "As altitude increases, air density decreases and the mixture becomes richer.", "It results from carbon build-up on the spark plugs after the engine has been run for a long time on an excessively rich mixture."], "ot": ["Fakir karışım ve yüksek silindir başı hararetinden kaynaklanır.", "Zengin karışım ve düşük silindir başı hararetinden kaynaklanır.", "Motor çalıştırma sırasında motor geri tepmesi durumunda oluşur.", "İrtifa arttıkça hava yoğunluğu azalır ve karışım zenginleşir.", "Motorun aşırı zengin karışımda uzun süre çalıştırılması sonrasında bujilerde karbon birikmesi sonucu oluşur."], "xt": "", "xe": "", "yeni": false}, {"id": 52202, "s": "020", "sec": "020-SH", "en": "In the fuel grade designation AVGAS 100LL, what does \"LL\" stand for?", "tr": "AVGAS 100LL yakıt adındaki \"LL\" ne anlama gelir?", "oe": ["Low lead: it contains less tetraethyl lead than the older AVGAS 100", "Lead-free: it contains no tetraethyl lead at all", "Light load: it is intended for aircraft below 2 000 kg", "Long life: it can be stored longer without forming gum deposits"], "ot": ["Low lead (düşük kurşun): eski AVGAS 100'den daha az tetraetil kurşun içerir", "Lead-free (kurşunsuz): hiç tetraetil kurşun içermez", "Light load (hafif yük): 2.000 kg altındaki uçaklar içindir", "Long life (uzun ömür): reçine oluşturmadan daha uzun depolanabilir"], "xt": "100LL = 100 oktan, low lead (düşük kurşunlu). Rengi mavi (bkz. 14567). AVGAS 100 yeşildir ve daha çok kurşun içerir; 100LL kurşunsuz değildir. Kullanıcının 2026-11-17 sınavında hatırladığı konudan bağımsız yazıldı; resmî soru metni değildir.", "xe": "100LL = 100 octane, low lead. It is dyed blue (see 14567). AVGAS 100 is green and contains more lead; 100LL is not lead-free. Written independently from a topic the user recalled from the 2026-11-17 exam; not an official exam transcript.", "yeni": true}, {"id": 62003, "s": "020", "sec": "020-EK", "en": "Why does a high-compression piston engine require fuel of a higher grade (higher octane number)?", "tr": "Yüksek sıkıştırma oranlı bir pistonlu motor neden daha yüksek dereceli (oktan sayılı) yakıt ister?", "oe": ["Higher-grade fuel resists detonation under the higher pressures and temperatures in the cylinders", "Higher-grade fuel contains more energy per kilogram, so the engine develops more power", "Higher-grade fuel prevents carburettor icing at high power settings", "Higher-grade fuel burns more slowly, which lowers the exhaust gas temperature"], "ot": ["Yüksek dereceli yakıt, silindirdeki yüksek basınç ve sıcaklıkta vuruntuya (detonation) dayanır", "Yüksek dereceli yakıt kilogram başına daha çok enerji içerir; motor daha fazla güç üretir", "Yüksek dereceli yakıt, yüksek güç ayarlarında karbüratör buzlanmasını önler", "Yüksek dereceli yakıt daha yavaş yanar; bu da egzoz gazı sıcaklığını düşürür"], "xt": "Oktan/performans sayısı yakıtın vuruntuya dayanıklılığını gösterir. Yüksek sıkıştırmalı motorda düşük oktanlı yakıt kontrolsüz yanar (vuruntu) ve motora zarar verir; bu yüzden uygun dereceli yakıt kullanılır.", "xe": "The octane or performance number expresses resistance to knock. In a high-compression engine low-octane fuel burns uncontrollably (detonation) and damages the engine, so the specified grade must be used.", "yeni": false}]}, {"k": "static", "ad": "Statik elektrik", "tuzak": "Static wick uçuşta biriken statik yükü havaya boşaltır, <b>telsiz parazitini</b> azaltır; yıldırımdan korumaz. Yakıt ikmalinde topraklama/bonding kablosu kullanılır.", "q": [{"id": 14552, "s": "020", "sec": "020-09", "en": "Before beginning the refueling operation, which precaution should be taken to protect against an electrical potential difference between the aircraft and fuel truck?", "tr": "Yakıt ikmali işlemine başlamadan önce, uçak ile yakıt tankeri arasındaki elektriksel potansiyel farkına karşı korunmak için hangi önlem alınmalıdır?", "oe": ["Connect a static bonding wire between the fuelling truck and the aircraft,", "Shut down all electrical equipment in the aircraft,", "Connect a static bonding wire between the aircraft and the ground,", "Connect a static bonding wire between the fuelling truck and the ground,"], "ot": ["Yakıt tankeri ile uçak arasına bir statik bağlama teli bağlamak,", "Uçaktaki tüm elektrikli ekipmanı kapatmak,", "Uçak ile yer arasına bir statik bağlama teli bağlamak,", "Yakıt tankeri ile yer arasına bir statik bağlama teli bağlamak,"], "xt": "", "xe": "", "yeni": false}, {"id": 52201, "s": "020", "sec": "020-SH", "en": "What is the function of the static dischargers (static wicks) fitted to the trailing edges of the wings and tail?", "tr": "Kanatların ve kuyruğun firar kenarlarına takılan statik boşaltıcıların (static wick) görevi nedir?", "oe": ["To bleed off the static charge that builds up on the airframe in flight, reducing interference with radio and avionics", "To protect the aircraft from lightning strikes by conducting the strike current to earth", "To earth the aircraft during refuelling so that no spark can occur", "To prevent ice from forming on the trailing edges of the control surfaces"], "ot": ["Uçuşta gövdede biriken statik yükü havaya boşaltarak telsiz ve aviyonikteki paraziti azaltmak", "Yıldırım akımını toprağa ileterek uçağı yıldırım çarpmasından korumak", "Yakıt ikmali sırasında uçağı topraklayıp kıvılcım oluşmasını önlemek", "Kumanda yüzeylerinin firar kenarlarında buz oluşmasını önlemek"], "xt": "Statik boşaltıcılar (static wick) firar kenarlarındadır; uçuşta sürtünmeyle biriken statik yükü kontrollü biçimde havaya boşaltır, telsiz/aviyonik parazitini azaltır. Yıldırımdan korumaz; ikmalde topraklama kablo ile yapılır. ECQB-PPL(A) AGK 53 aynı konuyu soruyor. Kullanıcının 2026-11-17 sınavında hatırladığı konudan bağımsız yazıldı; resmî soru metni değildir.", "xe": "Static wicks on the trailing edges bleed off the charge built up by friction in flight, reducing radio/avionics interference. They are not lightning protection; earthing for refuelling is done with a bonding cable. ECQB-PPL(A) AGK Q53 asks the same topic. Written independently from a topic the user recalled from the 2026-11-17 exam; not an official exam transcript.", "yeni": true}]}, {"k": "unit", "ad": "Birimler", "tuzak": "hPa = <b>basınç</b>; Kelvin, °C, °F = sıcaklık. Volt = gerilim, amper = akım, ohm = direnç, watt = güç.", "q": [{"id": 14860, "s": "030", "sec": "030-02", "en": "Which one below is not a u let st={};try{st=JSON.parse(localStorage.getItem('zk020')||'{}')}catch(e){}st.lang=st.lang||'en';st.yanlis=st.yanlis||{};st.sec=st.sec||D.map(g=>g.k);
const kaydet=()=>{try{localStorage.setItem('zk020',JSON.stringify(st))}catch(e){}};
const v=document.getElementById('v');let R=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const T=q=>st.lang==='tr'?q.tr:q.en, O=q=>st.lang==='tr'?q.ot:q.oe, X=q=>(st.lang==='tr'?q.xt:q.xe)||(st.lang==='tr'?q.xe:q.xt);
const dil=()=>`<button id="dil">${st.lang==='en'?'Türkçe göster':'Show English'}</button>`;
function bagDil(f){const b=document.getElementById('dil');if(b)b.onclick=()=>{st.lang=st.lang==='en'?'tr':'en';kaydet();f()}}
function ana(){
  const ny=Object.keys(st.yanlis).length;
  v.innerHTML=`<div class="card">${D.map(g=>`<label class="t"><input type="checkbox" data-k="${g.k}" ${st.sec.includes(g.k)?'checked':''}><span><b>${g.ad}</b> · ${g.q.length} soru<div class="tz">${g.tuzak}</div></span></label>`).join('')}</div>
  <div class="top"><button class="p" id="bas">Başla</button>${ny?`<button id="yan">Yanlışlarım (${ny})</button>`:''}<button id="lis">Cevaplı liste</button>${dil()}</div>`;
  v.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{st.sec=[...v.querySelectorAll('[data-k]:checked')].map(x=>x.dataset.k);kaydet()});
  document.getElementById('bas').onclick=()=>tur(D.filter(g=>st.sec.includes(g.k)).flatMap(g=>g.q));
  const y=document.getElementById('yan');if(y)y.onclick=()=>tur(D.flatMap(g=>g.q).filter(q=>st.yanlis[q.id]));
  document.getElementById('lis').onclick=liste;bagDil(ana);
}
function tur(qs){if(!qs.length)return;R={qs:kar(qs),i:0,d:0,y:0,sec:null,ord:null};soru()}
function soru(){
  const q=R.qs[R.i];if(!R.ord)R.ord=kar(O(q).map((_,i)=>i));
  const op=O(q),L='ABCDE';
  v.innerHTML=`<div class="meta"><span>${R.i+1} / ${R.qs.length} · ✓ ${R.d} · ✗ ${R.y}</span><span>${q.s} · ${q.sec} · #${q.id} ${q.yeni?'<span class="tag n">yeni</span>':''}</span></div>
  <div class="bar"><i style="width:${R.i/R.qs.length*100}%"></i></div>
  <div class="card"><div class="q">${esc(T(q))}</div>${R.ord.map((oi,k)=>`<button class="o ${R.sec===null?'':oi===0?'ok':oi===R.sec?'bad':''}" data-o="${oi}"><b>${L[k]}</b>${esc(op[oi])}</button>`).join('')}
  ${R.sec!==null&&X(q)?`<div class="x">${esc(X(q))}</div>`:''}</div>
  <div class="row">${dil()}<button id="cik">Bitir</button>${R.sec!==null?`<button class="p" id="ileri">${R.i+1<R.qs.length?'Sonraki':'Sonucu gör'}</button>`:''}</div>`;
  v.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(R.sec!==null)return;R.sec=+b.dataset.o;
    if(R.sec===0){R.d++;delete st.yanlis[q.id]}else{R.y++;st.yanlis[q.id]=1}kaydet();soru()});
  const n=document.getElementById('ileri');if(n)n.onclick=ileri;
  document.getElementById('cik').onclick=sonuc;bagDil(soru);window.scrollTo(0,0);
}
function ileri(){R.i++;R.sec=null;R.ord=null;R.i<R.qs.length?soru():sonuc()}
function sonuc(){const n=R.d+R.y;v.innerHTML=`<div class="card"><h1>${R.d} / ${n} doğru</h1><p class="sub">${n?Math.round(R.d/n*100):0}% · yanlışlar "Yanlışlarım" listesinde duruyor; bir kez doğru yapınca listeden düşer.</p></div><div class="top"><button class="p" id="g">Ana ekran</button></div>`;document.getElementById('g').onclick=ana}
function liste(){
  v.innerHTML=`<div class="top"><button id="g">‹ Geri</button>${dil()}</div>`+D.map(g=>`<div class="card list"><h1>${g.ad}</h1><div class="tz">${g.tuzak}</div>${g.q.map(q=>`<div class="it"><div class="meta"><span>#${q.id} · ${q.s}</span>${q.yeni?'<span class="tag n">yeni</span>':''}</div>${esc(T(q))}<div class="a">→ ${esc(O(q)[0])}</div></div>`).join('')}</div>`).join('');
  document.getElementById('g').onclick=ana;bagDil(liste);
}
document.addEventListener('keydown',e=>{if(!R||!v.querySelector('[data-o]'))return;const k='abcde'.indexOf(e.key.toLowerCase());const bs=v.querySelectorAll('[data-o]');if(k>=0&&bs[k])bs[k].click();if(e.key==='Enter'){const n=document.getElementById('ileri');if(n)n.click()}});
ana();
</script></body></html>

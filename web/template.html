<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PPL Çalışma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E9EEF3;
  --ink:#10151C; --ink-2:#4A5563; --ink-3:#7B8794;
  --rule:#D6DDE5; --rule-2:#B4BFCB;
  --accent:#C21A6B; --accent-soft:#FBE7F0; --accent-ink:#8E0F4C; --on-accent:#FFFFFF;
  --cyan:#0B6E7F; --cyan-soft:#E1F1F4;
  --due:#A8620A; --due-soft:#FBF0DE;
  --ok:#15764F; --ok-soft:#E2F3EB; --bad:#B32318; --bad-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(16,21,28,.05), 0 12px 32px -18px rgba(16,21,28,.30);
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-read:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-num:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
    --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
    --rule:#232E3B; --rule-2:#374553;
    --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
    --cyan:#4FBACE; --cyan-soft:#0D2930;
    --due:#E9AE5A; --due-soft:#2A2013;
    --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
  --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
  --rule:#232E3B; --rule-2:#374553;
  --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
  --cyan:#4FBACE; --cyan-soft:#0D2930;
  --due:#E9AE5A; --due-soft:#2A2013;
  --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

.lbl{font-family:var(--f-num); font-size:10px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ── Üst şerit ── */
.bar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:7px;
  padding:9px 12px; background:var(--surface); border-bottom:1px solid var(--rule);
  padding-top:calc(9px + env(safe-area-inset-top))}
.bar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px;
  letter-spacing:-.01em; white-space:nowrap}
.bar .logo svg{width:18px; height:18px; flex:none}
.bar .logo .long{display:inline}
@media (max-width:430px){ .bar .logo .long{display:none} }
.bar .sp{flex:1}
.tbtn{border:1px solid var(--rule); border-radius:var(--r); padding:6px 9px;
  font-family:var(--f-num); font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.tbtn:hover{border-color:var(--rule-2); color:var(--ink)}
.tbtn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.ava{flex:none; width:21px; height:21px; border-radius:50%; display:inline-grid;
  place-items:center; background:hsl(var(--h) 46% 38%); color:#fff;
  font-family:var(--f-ui); font-size:9px; font-weight:700; letter-spacing:.02em;
  line-height:1; text-transform:uppercase}
#bWho{display:inline-flex; align-items:center; gap:7px; padding:4px 9px 4px 5px;
  font-family:var(--f-ui); font-size:12.5px; font-weight:600; letter-spacing:0;
  text-transform:none; color:var(--ink-2)}
#bWho .nm{display:none}
#bWho{padding:4px 5px}

.page{max-width:760px; margin:0 auto; padding:18px 14px 80px}
@media (min-width:720px){ .page{padding:26px 20px 90px} }
h1{margin:0 0 4px; font-size:23px; font-weight:700; letter-spacing:-.022em; text-wrap:balance}
.sub{margin:0 0 18px; color:var(--ink-2); font-size:14px}

/* ── Desteler ── */
/* ── Kimlik satırı ── */
.idline{display:flex; width:100%; align-items:center; gap:9px; padding:9px 12px;
  background:var(--surface); border:1px solid var(--rule); border-radius:99px;
  margin-bottom:14px; transition:border-color .12s}
.idline:hover{border-color:var(--rule-2)}
.idline .nm{font-size:13.5px; font-weight:600; letter-spacing:-.01em; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.idline .sep{flex:1}
.idline .mini{font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.idline .mini b{color:var(--ink-2); font-weight:500}
.idline .chev{flex:none; color:var(--ink-3); font-family:var(--f-num); font-size:13px}
.idline:hover .chev{color:var(--accent)}
.idline .stats{display:flex; align-items:center; gap:10px; min-width:0}
@media (max-width:430px){
  .idline{display:grid; grid-template-columns:auto minmax(0,1fr) auto;
    column-gap:10px; row-gap:1px; border-radius:16px; padding:9px 13px}
  .idline .ava{grid-row:1 / span 2}
  .idline .nm{grid-column:2; grid-row:1}
  .idline .stats{grid-column:2; grid-row:2; gap:9px}
  .idline .chev{grid-column:3; grid-row:1 / span 2}
  .idline .sep{display:none}
}

/* ── Kahraman kart ── */
.hero{background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow); padding:16px; margin-bottom:12px}
.hero .modpick{display:flex; width:100%; align-items:center; gap:13px; text-align:left;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
  padding:11px 12px; margin-bottom:12px; cursor:pointer; transition:border-color .12s}
.hero .modpick:hover{border-color:var(--rule-2)}
.hero .modpick .chev{flex:none; color:var(--ink-3); font-family:var(--f-num);
  font-size:15px; transition:transform .16s, color .12s}
.hero .modpick:hover .chev{color:var(--accent)}
.hero .modpick.open{border-color:var(--rule-2); border-bottom-left-radius:0;
  border-bottom-right-radius:0; margin-bottom:0}
.hero .modpick.open .chev{transform:rotate(90deg); color:var(--accent)}
.hero .picker{border:1px solid var(--rule-2); border-top:0; border-radius:0 0 var(--r) var(--r);
  background:var(--surface-2); padding:11px; margin-bottom:12px}
.hero .picker .tools{align-items:center; margin-bottom:9px}
.hero .picker .tools .note{flex:1 1 11rem; margin-top:0; font-size:11.5px; color:var(--ink-3)}
.hero .picker .tree{background:var(--surface); max-height:min(44vh, 340px);
  overflow:auto; overscroll-behavior:contain}
.hero .hinfo{display:block; min-width:0; flex:1}
.hero .hinfo .lbl{display:block}
.hero .hname{display:block; font-size:17px; font-weight:600; letter-spacing:-.015em;
  line-height:1.3; margin-top:3px; text-wrap:balance}
.hero .hname b{font-family:var(--f-num); font-weight:500; color:var(--accent)}
.hero .hname .frag{font-family:var(--f-num); font-size:11px; font-weight:500;
  color:var(--ink-3); vertical-align:middle; white-space:nowrap}
.hero .hsub{display:block; font-size:12.5px; color:var(--ink-3); margin-top:5px}
.hero .hsub i{font-style:normal; opacity:.75}
.hero .hsub .num{color:var(--ink-2); font-weight:500}
.hero .hsub .ok{color:var(--ok); font-weight:600}
.hero .hact{display:flex; justify-content:center; gap:8px; flex-wrap:wrap}
.hero .hact .go{flex:0 1 20rem; min-width:11rem}
.hero .hact .go2{flex:0 1 9rem}
.hero .hnext{display:block; width:100%; text-align:center; margin-top:9px; padding:9px;
  font-size:12.5px; color:var(--cyan); border-radius:var(--r)}
.hero .hnext:hover{background:var(--surface-2)}
.hero.welcome{text-align:left}
.hero .wtitle{font-size:20px; font-weight:700; letter-spacing:-.02em; margin-bottom:6px}
.hero .wtext{margin:0 0 15px; font-size:13.5px; color:var(--ink-2); line-height:1.55}
.hero .wtext b{color:var(--ink)}


/* ── İlerleme halkası ── */
.ring{flex:none}
.ring .rbg{fill:none; stroke:var(--surface-3); stroke-width:5}
.ring .rfg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round;
  transform:rotate(-90deg); transform-origin:30px 30px; transition:stroke-dashoffset .45s ease}
.ring.done .rfg{stroke:var(--ok)}
.ring .rtx{fill:var(--ink); font-family:var(--f-num); font-size:14px; font-weight:500;
  text-anchor:middle; dominant-baseline:central}

/* ── Yarım kalan tur ── */
.resume{display:flex; width:100%; align-items:center; gap:10px; text-align:left;
  padding:10px 13px; margin-bottom:12px; border-radius:var(--r);
  background:var(--accent-soft); border:1px solid var(--accent);
  color:var(--accent-ink); transition:filter .12s}
.resume:hover{filter:brightness(1.06)}
.resume .rl{display:block; min-width:0; flex:1}
.resume .rl b{display:block; font-size:10.5px; font-family:var(--f-num); font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; opacity:.75}
.resume .rl span{display:block; font-size:13.5px; font-weight:600; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.resume .rn{flex:none; font-size:11.5px; font-family:var(--f-num)}
.resume .chev{flex:none; font-family:var(--f-num); font-size:14px}

/* ── Tur geçmişi ── */
.hislist{display:flex; flex-direction:column; gap:6px}
.hisrow{display:flex; width:100%; align-items:center; gap:10px; text-align:left;
  padding:9px 11px; border-radius:var(--r); background:var(--surface-2);
  border:1px solid var(--rule); transition:border-color .12s}
.hisrow:hover{border-color:var(--rule-2)}
.hisrow .hdot{flex:none; width:7px; height:7px; border-radius:50%; background:var(--ink-3)}
.hisrow .hdot.ok{background:var(--ok)} .hisrow .hdot.mid{background:var(--accent)}
.hisrow .hdot.bad{background:var(--bad)}
.hisrow .hdot.live{background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.hisrow .hi{display:block; flex:1; min-width:0}
.hisrow .hi b{display:block; font-size:13px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hisrow .hi i{display:block; font-style:normal; font-size:11px; color:var(--ink-3);
  font-family:var(--f-num); margin-top:2px}
.hisrow .hpct{flex:none; font-family:var(--f-num); font-size:12.5px; color:var(--ink-2)}
.hisrow .hpct.go2x{color:var(--accent); font-weight:500}

/* ── Deste çipleri ── */
.chiprow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.dchip{display:inline-flex; align-items:center; gap:6px; padding:7px 13px;
  border:1px solid var(--rule); border-radius:99px; background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
  transition:border-color .12s, background .12s}
.dchip:hover{border-color:var(--rule-2); color:var(--ink)}
.dchip b{font-weight:600; color:var(--ink)}
.dchip.due b{color:var(--due)} .dchip.wrong b{color:var(--bad)}
.dchip.new b{color:var(--cyan)} .dchip.star b{color:var(--accent)}
.dchip.leech b{color:var(--bad)}
.dchip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.dchip.on b{color:var(--on-accent)}

.nextmod{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--rule); border-left:2px solid var(--cyan); border-radius:var(--r);
  padding:11px 13px; font-size:12.5px; color:var(--ink-2); margin-bottom:12px}
.nextmod:hover{border-color:var(--rule-2); color:var(--ink)}
.nextmod b{font-family:var(--f-num); color:var(--cyan)}

.go{flex:1; background:var(--accent); color:var(--on-accent); border-radius:var(--r);
  padding:15px 20px; font-size:16px; font-weight:600; text-align:center}
.go:hover{filter:brightness(1.07)}
.go:disabled{opacity:.4; cursor:not-allowed; filter:none}
.go2{flex:none; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:15px 16px; font-size:14px; font-weight:500; color:var(--ink-2)}
.go2:hover{border-color:var(--rule-2); color:var(--ink)}

/* ── Akordeon kutular ── */
.box{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  margin-bottom:10px; overflow:hidden}
.box > summary{list-style:none; cursor:pointer; padding:12px 14px; display:flex;
  align-items:center; gap:9px; background:var(--surface-2);
  border-bottom:1px solid transparent; font-size:13.5px; font-weight:600}
.box > summary::-webkit-details-marker{display:none}
.box[open] > summary{border-bottom-color:var(--rule)}
.box > summary .chev{margin-left:auto; color:var(--ink-3); font-family:var(--f-num);
  font-size:12px; transition:transform .15s}
.box[open] > summary .chev{transform:rotate(90deg)}
.box .in{padding:13px}
.pill{font-family:var(--f-num); font-size:10px; font-weight:500; letter-spacing:.04em;
  color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent);
  border-radius:99px; padding:2px 8px}
.pill.off{color:var(--ink-3); background:var(--surface-3); border-color:var(--rule)}

/* ── Konu ağacı ── */
.tools{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
.tree{border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.node + .node{border-top:1px solid var(--rule)}
.row{display:flex; align-items:center; gap:0; background:var(--surface)}
.row:hover{background:var(--surface-2)}
.tick{flex:none; width:38px; height:42px; display:grid; place-items:center;
  font-family:var(--f-num); font-size:13px; color:var(--ink-3)}
.tick.all{color:var(--accent)} .tick.some{color:var(--accent); opacity:.75}
.nm{flex:1; text-align:left; padding:11px 6px 11px 0; font-size:13.5px; font-weight:500;
  min-width:0; line-height:1.35}
.nm b{font-family:var(--f-num); font-size:10.5px; font-weight:500; color:var(--ink-3);
  margin-left:7px}
.exp{flex:none; width:36px; height:42px; display:grid; place-items:center;
  color:var(--ink-3); font-family:var(--f-num); font-size:12px; transition:transform .15s}
.exp.open{transform:rotate(90deg); color:var(--ink-2)}
.kids{background:var(--surface-2); border-top:1px solid var(--rule)}
.kids .row{background:transparent; padding-left:14px}
.kids .row:hover{background:var(--surface-3)}
.kids .nm{font-size:12.5px; font-weight:400; color:var(--ink-2)}
.kids .tick{height:36px} .kids .nm{padding:8px 4px 8px 0}
.node.sel > .row{background:var(--accent-soft)}
.node.sel > .row .nm{color:var(--accent-ink)}

/* Geçilen ders satırı */
.tbl tr.passed td{opacity:.55}
.pflag{display:inline-block; font-family:var(--f-num); font-size:9.5px; font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; padding:1px 5px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent-ink); vertical-align:middle}

/* Geçilen sınav çipleri */
.pchips{display:flex; flex-direction:column; gap:6px}
.pchip{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:9px 11px; background:var(--surface-2); border:1px solid var(--rule);
  border-radius:var(--r); font-size:13.5px; transition:border-color .12s, background .12s}
.pchip:hover{border-color:var(--rule-2)}
.pchip .tk{flex:none; width:19px; height:19px; border-radius:5px;
  border:1.5px solid var(--rule-2); display:grid; place-items:center;
  font-size:11px; line-height:1; color:transparent}
.pchip .tk::after{content:'✓'}
.pchip b{flex:none; font-family:var(--f-num); font-weight:500; color:var(--ink-2)}
.pchip .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pchip .num{flex:none; font-style:normal; font-size:11.5px; color:var(--ink-3)}
.pchip.on{background:var(--accent-soft); border-color:var(--accent)}
.pchip.on b, .pchip.on .nm{color:var(--accent-ink)}
.pchip.on .num{color:var(--accent-ink); opacity:.7}
.pchip.on .tk{background:var(--accent); border-color:var(--accent); color:var(--surface)}

.switch{display:flex; align-items:center; gap:10px; padding:9px 11px; width:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
  text-align:left; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px}
.switch:hover{border-color:var(--rule-2)}
.switch .knob{flex:none; width:32px; height:18px; border-radius:99px;
  background:var(--rule-2); position:relative; transition:background .15s}
.switch .knob::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
  border-radius:50%; background:var(--surface); transition:transform .15s}
.switch.on{color:var(--ink); border-color:var(--accent)}
.switch.on .knob{background:var(--accent)}
.switch.on .knob::after{transform:translateX(14px)}
.switch .n{margin-left:auto; font-family:var(--f-num); font-size:10.5px; color:var(--ink-3)}

.grp{margin-bottom:15px} .grp:last-child{margin-bottom:0}
.grp > .lbl{display:block; margin-bottom:7px}
input[type=search], select, textarea{width:100%; padding:10px 12px; font-size:14.5px;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--rule);
  border-radius:var(--r)}
textarea#bak{height:60px; resize:vertical; font-family:var(--f-num); font-size:11px;
  line-height:1.45; color:var(--ink-2)}
input:focus, select:focus, textarea:focus{border-color:var(--accent); outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; background:var(--surface-2); padding:9px 6px; font-size:12.5px;
  font-weight:500; color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--accent); color:var(--on-accent)}
.note{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.note b{font-family:var(--f-num); color:var(--ink); font-weight:500}

/* ── Soru ── */
.prog{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-bottom:8px}
.prog i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
.prog i.retry{background:var(--bad)}
.meta{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.meta .lbl:first-of-type{margin-right:auto}
/* Gezinme düğmesi ve paneli — kapalıyken hiç yer kaplamaz */
.navb{display:inline-flex; align-items:center; gap:5px; padding:3px 8px; margin:-3px 0;
  border-radius:99px; font-family:var(--f-num); font-size:11.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); border:1px solid transparent;
  transition:border-color .12s, color .12s}
.navb:hover{border-color:var(--rule-2); color:var(--ink-2)}
.navb.on{border-color:var(--accent); color:var(--accent)}
.navb b{color:var(--ink-2); font-weight:500}
.navb.on b{color:var(--accent)}
.navb .cv{display:inline-block; transition:transform .15s}
.navb.on .cv{transform:rotate(90deg)}
.navpop{background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r);
  padding:10px 11px; margin:-4px 0 12px; box-shadow:var(--shadow)}
.navpop.hidden{display:none}

<script>
(function(){
"use strict";

const DB = JSON.parse(document.getElementById('qdata').textContent);
const SUBJ = DB.s, QS = DB.q, NOTES = DB.n || [], FIGS = DB.fg || {};
/** Sorunun çizimi (varsa) — q[9] çizim adı, FIGS adı SVG'ye çevirir. */
const figOf = q => (q[9] && FIGS[q[9]]) || '';
// soru: [0]id [1]dersIdx [2]bölümIdx [3]metin [4]şıklar [5]tartışmalı [6]tekrar [7]üretilmiş [8]şekil
const BY_ID = new Map(QS.map(q => [q[0], q]));
const KEYS = ['A','B','C','D','E'];
const DAY = 864e5;
const BOX_MS = [10*6e4, DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];
const LEECH = 4, MASTER = 2;

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => n.toLocaleString('tr-TR');
/** Profil simgesi: addan türeyen baş harfler + sabit renk. */
function initials(name){
  const w = String(name).trim().split(/\s+/).filter(Boolean);
  const a = (w[0] || '?')[0];
  const b = w.length > 1 ? w[w.length - 1][0] : '';
  return (a + b).toLocaleUpperCase('tr');
}
function hueOf(name){
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
const avatar = name => '<span class="ava" style="--h:' + hueOf(name) + '" aria-hidden="true">' +
  esc(initials(name)) + '</span>';
const today = () => new Date().toISOString().slice(0,10);
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
             del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

// ── Profiller: giriş yok. İlk ziyarette rastgele bir ad verilir, sonra değiştirilebilir ──
const AD1 = ['Sakin','Hızlı','Gümüş','Kuzey','Berrak','Serin','Altın','Mavi','Keskin',
             'Sessiz','Yüksek','Uzak','Parlak','Çevik'];
const AD2 = ['Kanat','Rüzgâr','Pervane','Rota','Ufuk','Bulut','Yıldız','Pist','Şahin',
             'Turna','Kartal','İrtifa','Kule','Yaklaşma'];
function randomName(taken){
  for (let i = 0; i < 60; i++){
    const n = AD1[Math.floor(Math.random()*AD1.length)] + ' ' +
              AD2[Math.floor(Math.random()*AD2.length)];
    if (!taken.includes(n)) return n;
  }
  return 'Pilot ' + Math.floor(Math.random()*9000 + 1000);
}

let PROFILES = [];
try{ PROFILES = JSON.parse(ls.get('atpl.profiles') || '[]'); }catch(e){ PROFILES = []; }
if (!Array.isArray(PROFILES)) PROFILES = [];
if (ls.get('atpl.v2') && !PROFILES.length) PROFILES = ['Ben'];   // eski tek profilli kayıt
if (!PROFILES.length){                    // siteye ilk kez giriliyor
  PROFILES = [randomName([])];
  ls.set('atpl.profiles', JSON.stringify(PROFILES));
  ls.set('atpl.profile', PROFILES[0]);
}
let ME = ls.get('atpl.profile') || PROFILES[0];
if (!PROFILES.includes(ME)) ME = PROFILES[0];
const keyOf = p => 'atpl.v2:' + p;

const blank = () => ({ v:2, c:{}, star:[], day:{}, pref:{}, runs:[], passed:[] });
let S = blank();
function loadProfile(){
  S = blank();
  let raw = ls.get(keyOf(ME));
  if (!raw && ME === PROFILES[0]) raw = ls.get('atpl.v2');   // eski tek profilli kayıt
  try{ const p = JSON.parse(raw || 'null'); if (p && p.v === 2) S = Object.assign(blank(), p); }catch(e){}
  if (!Array.isArray(S.runs)) S.runs = [];
  if (!Array.isArray(S.passed)) S.passed = [];
  Object.assign(F, DEFAULTS, S.pref || {});
  delete F.hideFig;                       // süzgeç kaldırıldı, eski kayıt taşımasın
  if (S.pref) delete S.pref.hideFig;
  if (!F.pick || typeof F.pick !== 'object') F.pick = {};
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(flush, 250);
}
/** Bekleyen kaydı hemen yaz — sekme kapanırken son cevap kaybolmasın. */
function flush(){
  clearTimeout(saveT);
  ls.set(keyOf(ME), JSON.stringify(S));
}
addEventListener('pagehide', flush);
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
function renameProfile(oldN, newN){
  const data = ls.get(keyOf(oldN));
  ls.set(keyOf(newN), data || JSON.stringify(S));
  ls.del(keyOf(oldN));
  PROFILES = PROFILES.map(x => x === oldN ? newN : x);
  ls.set('atpl.profiles', JSON.stringify(PROFILES));
  ME = newN; ls.set('atpl.profile', ME);
  paintWho();
}

function switchProfile(name){
  ls.set(keyOf(ME), JSON.stringify(S));
  ME = name; ls.set('atpl.profile', ME);
  if (!PROFILES.includes(name)){ PROFILES.push(name); ls.set('atpl.profiles', JSON.stringify(PROFILES)); }
  loadProfile(); paintWho(); R = null; closeSheet(); home();
}

// ── Filtreler ──
// count:0 = sınır yok, kapsamdaki tüm sorular
// deck:'new' = varsayılan olarak henüz çözülmemişlerden başla, tüm konular
// hideFig kaldırıldı: şekil gerektiren soruların hepsi çizildi, hiçbiri gizlenmiyor
const DEFAULTS = { deck:'new', pick:{}, q:'', hideDup:true, gen:true,
                   hideFlag:false, count:0, mode:'study', order:'smart',
                   sound:true };
const F = Object.assign({}, DEFAULTS);
function savePref(){ S.pref = F; save(); }

const card = id => S.c[id];
const stars = () => new Set(S.star);

function grade(id, ok){
  const k = S.c[id] || [0,0,0,0,0];
  k[2]++;
  if (ok){ k[4]++; k[0] = Math.min(k[0] + 1, BOX_MS.length - 1); }
  else { k[3]++; k[4] = 0; k[0] = 0; }
  k[1] = Date.now() + BOX_MS[k[0]];
  S.c[id] = k;
  const d = S.day[today()] || [0,0];
  d[0]++; if (ok) d[1]++;
  S.day[today()] = d;
  save();
}

// Konu seçimi:  F.pick = { "050": [] }  boş dizi = dersin tamamı
function pickedAny(){ return Object.keys(F.pick).length > 0; }
// ── Geçilen sınavlar ────────────────────────────────────────────────
// Geçtiğin dersin soruları kapsamdan tümüyle çıkar: toplam sayıda, konu
// seçicide, destelerde ve turlarda görünmez. Kayıt profile bağlıdır.
function isPassed(code){ return (S.passed || []).indexOf(code) >= 0; }
const notPassed = q => !isPassed(SUBJ[q[1]].c);
let passDirty = false;

function togglePassed(code){
  S.passed = S.passed || [];
  const i = S.passed.indexOf(code);
  if (i < 0) S.passed.push(code); else S.passed.splice(i, 1);
  // Geçilen ders seçili kapsamdaysa düşür; kapsam boş kalırsa yeni modül seç
  if (i < 0 && F.pick[code]) delete F.pick[code];
  if (!Object.keys(F.pick).length) autoPickModule();
  savePref();
  passDirty = true;
  save();
}
/** Tur kaydının ait olduğu modül kodu (eski kayıtlarda başlıktan okunur). */
function runCode(r){
  if (r.code !== undefined) return r.code;
  const m = /^(\S+) · /.exec(r.title || '');
  return m ? m[1] : '';
}

function matchPick(q){
  if (!pickedAny()) return true;
  const s = SUBJ[q[1]];
  const sel = F.pick[s.c];
  if (!sel) return false;
  return sel.length === 0 || sel.includes(s.sec[q[2]][0]);
}
function inScope(q){
  if (!notPassed(q)) return false;
  if (F.hideDup && q[6]) return false;
  if (!F.gen && q[7]) return false;
  if (F.hideFlag && q[5]) return false;
  if (!matchPick(q)) return false;
  if (F.q){
    const n = F.q.toLocaleLowerCase('tr');
    if (!(q[0] + ' ' + q[3] + ' ' + q[4].join(' ')).toLocaleLowerCase('tr').includes(n)) return false;
  }
  return true;
}
// Konu ağacındaki sayılar seçimden bağımsız, diğer anahtarlara bağlıdır
function inToggles(q, withPassed){
  if (!withPassed && !notPassed(q)) return false;
  return !(F.hideDup && q[6]) && (F.gen || !q[7]) && !(F.hideFlag && q[5]);
}

const DECKS = [
  { k:'due',   cls:'due',   t:'Tekrar zamanı', d:'Vadesi gelenler' },
  { k:'wrong', cls:'wrong', t:'Yanlışlarım',   d:'Henüz oturmayanlar' },
  { k:'new',   cls:'new',   t:'Hiç görmedim',  d:'İlk kez çıkacak' },
  { k:'star',  cls:'star',  t:'Yıldızlılar',   d:'Sonra bakılacaklar' },
];
function inDeck(q, deck){
  const k = card(q[0]), now = Date.now();
  switch (deck){
    case 'due':   return !!k && k[1] <= now;
    case 'wrong': return !!k && k[3] > 0 && k[4] < MASTER;
    case 'new':   return !k;
    case 'star':  return stars().has(q[0]);
    case 'leech': return !!k && k[3] >= LEECH;
    default:      return true;
  }
}
const scoped = () => QS.filter(inScope);
const deckCount = d => scoped().filter(q => inDeck(q, d)).length;

/** Profilin tümüne ait durum — modül seçiminden bağımsız. */
function globalStat(){
  const all = QS.filter(q => inToggles(q));
  let seen = 0, ans = 0, ok = 0;
  all.forEach(q => {
    const k = S.c[q[0]];
    if (k){ seen++; ans += k[2]; ok += k[2] - k[3]; }
  });
  const now = Date.now();
  let due = 0, wrong = 0;
  all.forEach(q => {
    const k = S.c[q[0]];
    if (!k) return;
    if (k[1] <= now) due++;
    if (k[3] > 0 && k[4] < MASTER) wrong++;
  });
  // gün serisi
  let streak = 0;
  for (let i = 0; i < 400; i++){
    const d = new Date(now - i*DAY).toISOString().slice(0,10);
    if ((S.day[d] || [0,0])[0]) streak++;
    else if (i > 0) break;
  }
  return { total: all.length, seen, ans, ok, due, wrong, streak,
           pct: ans ? Math.round(ok / ans * 100) : null };
}

/** Bir modülün (dersin) durumu: toplam, görülen, kalan. */
function moduleStat(code, raw){
  const si = SUBJ.findIndex(x => x.c === code);
  const all = QS.filter(q => q[1] === si && inToggles(q, raw));
  const seen = all.filter(q => card(q[0])).length;
  return { code, name: SUBJ[si].n, total: all.length, seen, left: all.length - seen };
}
/** Seçim tek bir modülün tamamıysa o modülün kodunu, değilse null döner. */
function soloModule(){
  const ks = Object.keys(F.pick);
  return (ks.length === 1 && F.pick[ks[0]].length === 0) ? ks[0] : null;
}
/** Henüz bitmemiş modüller — sırayla ya da rastgele seçmek için. */
function openModules(){
  return SUBJ.map(s => moduleStat(s.c)).filter(m => m.total && m.left > 0);
}
/** İlk ziyarette ya da modül bitince yeni bir modül seçer. */
function autoPickModule(){
  const open = openModules();
  if (!open.length) return false;
  const m = open[Math.floor(Math.random() * open.length)];
  F.pick = {}; F.pick[m.code] = [];
  savePref();
  return true;
}

function buildQueue(){
  let pool = scoped().filter(q => inDeck(q, F.deck));
  if (F.order === 'smart'){
    pool = pool.map(q => {
      const k = card(q[0]);
      return { q, key: k ? -(Date.now() - k[1]) : 1e15 + Math.random() };
    }).sort((a,b) => a.key - b.key).map(x => x.q);
  } else shuffle(pool);
  return F.count ? pool.slice(0, F.count) : pool;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const optOrder = q => shuffle(q[4].map((_, i) => i));

// ── Geri bildirim: kısa ses + kartta tek atımlık renk ──
// Ses dosyası yok; iki-üç osilatör notası WebAudio ile üretilir. Bağlam ilk
// dokunuşta açılır, tarayıcı otomatik oynatma kuralına takılmaz.
let actx = null;
const REDUCED = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function beep(kind){
  if (!F.sound) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const notes = kind === 'ok'  ? [[660, 0, .10], [988, .085, .13]]
                : kind === 'bad' ? [[190, 0, .16], [142, .10, .18]]
                :                  [[520, 0, .07]];
    notes.forEach(([f, d, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'square' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(kind === 'bad' ? .05 : .10, t0 + d + .012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + len);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + len + .02);
    });
  }catch(e){}
}
/** Sınav modunda doğru/yanlış sızmasın diye ses ve renk nötr kalır. */
function feedback(ok){
  const notr = F.mode === 'exam';
  const card = el('view').querySelector('.card');
  if (card && !REDUCED){
    const c = notr ? 'fnew' : ok ? 'fok' : 'fbad';
    card.classList.add(c);
    setTimeout(() => { if (card) card.classList.remove(c); }, 620);
  }
  beep(notr ? 'tap' : ok ? 'ok' : 'bad');
}

let R = null, advT = null;
let navOpen = false;                      // gezinme paneli açık mı

const RUN_MAX = 24;                       // geçmişte tutulan tur sayısı

/** Ana ekrandaki kapsam adı — geçmiş satırında ne çalışıldığı yazsın. */
function scopeTitle(){
  const solo = soloModule();
  if (solo){
    const s = SUBJ.find(x => x.c === solo);
    return solo + ' · ' + (s ? s.n : '');
  }
  const ks = Object.keys(F.pick);
  if (!ks.length) return 'Tüm modüller';
  if (ks.length === 1){
    const s = SUBJ.find(x => x.c === ks[0]);
    return ks[0] + ' · ' + (s ? s.n : '');
  }
  return ks.length + ' modül';
}
function openRun(){
  return S.runs.find(r => !r.done && !isPassed(runCode(r))) || null;
}
function runRec(){ return R ? S.runs.find(r => r.id === R.id) : null; }

/** Tur durumunu kayda geçir — sayfa kapansa da kaldığı yerden açılsın. */
function saveRun(){
  const rec = runRec();
  if (!rec) return;
  rec.ids = R.list.map(q => q[0]);
  rec.i = R.i; rec.round = R.round;
  rec.missed = R.missed.slice();
  rec.log = R.log.slice();
  rec.tN = Date.now();
  save();
}
function start(){
  const list = buildQueue();
  if (!list.length) return;
  S.runs = S.runs.filter(r => r.done || (r.log || []).length);   // boş bırakılanları at
  const id = 'r' + Date.now();
  R = { id, list, i:0, order:null, picked:null, orders:[], picks:[],
        log:[], t0:Date.now(), round:1, missed:[] };
  S.runs.unshift({ id, t0:R.t0, tN:R.t0, title:scopeTitle(), code:soloModule() || '',
                   deck:deckName(),
                   n0:list.length, ids:list.map(q => q[0]), i:0, round:1,
                   missed:[], log:[], done:false });
  if (S.runs.length > RUN_MAX) S.runs.length = RUN_MAX;
  save();
  step0();
}
/** Yarım kalan turu geri yükler; sorular silinmişse turu kapatır. */
function resumeRun(id){
  const rec = S.runs.find(r => r.id === id);
  if (!rec || rec.done) return home();
  const list = (rec.ids || []).map(x => BY_ID.get(x)).filter(Boolean);
  if (!list.length){ rec.done = true; save(); return home(); }
  R = { id:rec.id, list, i:Math.min(rec.i || 0, list.length), order:null, picked:null,
        orders:[], picks:[], log:(rec.log || []).slice(), t0:rec.t0,
        round:rec.round || 1, missed:(rec.missed || []).slice() };
  // Bu turda verilmiş cevapları geri kur: kayıtta kaynak şık indeksi var,
  // yeni karıştırmada karşılığı bulunur. Böylece geri gidince cevap görünür
  // ve yeniden puanlanmaz.
  const gecmis = R.log.filter(x => x.round === R.round);
  R.list.forEach((q, i) => {
    const e = gecmis.find(x => x.id === q[0]);
    if (e) R.picks[i] = orderFor(i).indexOf(e.pick);
  });
  step0();
}
/** Sorunun şık sırası — bir kez üretilir, geri gidip gelince değişmez. */
function orderFor(i){
  if (!R.orders[i]) R.orders[i] = optOrder(R.list[i]);
  return R.orders[i];
}
function step0(){
  clearTimeout(advT);
  if (!R) return;
  if (R.i >= R.list.length){
    // Tur bitti — bu turda yanlış yapılanlar varsa onlarla devam et
    if (R.missed.length){
      // missed soru id'si tutar, list soru nesnesi bekler
      R.list = shuffle(R.missed.map(id => BY_ID.get(id)).filter(Boolean));
      R.missed = []; R.i = 0; R.round++;
      R.orders = []; R.picks = [];        // yeni tur: sıra ve cevaplar sıfırlanır
      if (!R.list.length) return done();
    } else return done();
  }
  if (R.i < 0) R.i = 0;
  R.order = orderFor(R.i);
  R.picked = R.picks[R.i] === undefined ? null : R.picks[R.i];
  saveRun();
  draw();
  window.scrollTo({ top:0, behavior:'smooth' });
}
/** Tur içinde belirli bir soruya git (0 tabanlı, sınırlara kırpılır). */
function goTo(i){
  if (!R) return;
  clearTimeout(advT);
  R.i = Math.max(0, Math.min(i, R.list.length - 1));
  step0();
}
function prevQ(){ if (R && R.i > 0) goTo(R.i - 1); }
/** Sağ ok: son soruda turu kazara bitirmesin, cevap verilmişse bitirir. */
function nextQ(){
  if (!R) return;
  if (R.i < R.list.length - 1) goTo(R.i + 1);
  else if (R.picked !== null) next();
}
function pick(pos){
  if (!R || R.picked !== null) return;
  const q = R.list[R.i], ok = R.order[pos] === 0;
  R.picked = pos; R.picks[R.i] = pos;
  grade(q[0], ok);
  R.log.push({ id:q[0], ok, pick:R.order[pos], round:R.round });
  if (!ok && !R.missed.includes(q[0])) R.missed.push(q[0]);
  saveRun();
  draw();
  feedback(ok);
  clearTimeout(advT);
  if (F.mode === 'exam') advT = setTimeout(next, 150);
  else if (ok) advT = setTimeout(next, 580);
}
function next(){ clearTimeout(advT); if (R){ R.i++; step0(); } }

  ].map(([k,x,n]) => '<button class="switch' + (F[k] ? ' on' : '') + '" data-k="' + k +
    '" type="button"><span class="knob"></span><span>' + x + '</span>' +

  paintPicker();

  const ma = el('mAll');
  if (ma) ma.onclick = () => {

  el('mode').querySelectorAll('button').forEach(b =>

/**
 * Modül kutusu: tıklanınca altındaki konu seçici açılır.
 * Ayrı bir "Konular" bölümü yok — kapsam hep bu kutudan seçilir.
 */
function modPick(label, name, sub, ring){
  return '<button class="modpick' + (pickOpen ? ' open' : '') + '" id="mPick" ' +
      'type="button" aria-expanded="' + (pickOpen ? 'true' : 'false') + '">' +
      (ring || '') +
      '<span class="hinfo"><span class="lbl">' + label + '</span>' +
        '<span class="hname">' + name + '</span>' +
        '<span class="hsub">' + sub + '</span></span>' +
      '<span class="chev">›</span></button>' +
    '<div class="picker" id="picker"' + (pickOpen ? '' : ' hidden') + '>' +
      '<div class="tools"><button class="tbtn" id="tAll" type="button">Tüm modüller</button>' +
        '<button class="tbtn" id="tPass" type="button">' +
          ((S.passed || []).length ? (S.passed.length + ' ders geçildi') : 'Geçtiğim sınavlar') +
        '</button>' +
      '</div><div class="tree" id="tree"></div></div>';
}
function paintPicker(){
  const b = el('mPick'), pk = el('picker');
  if (!b || !pk) return;
  b.classList.toggle('open', pickOpen);
  b.setAttribute('aria-expanded', pickOpen ? 'true' : 'false');
  pk.hidden = !pickOpen;
}

const AYLAR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function stamp(ms){
  const d = new Date(ms), p2 = x => String(x).padStart(2, '0');
  return d.getDate() + ' ' + AYLAR[d.getMonth()] + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
/** Turda kaç ayrı soru görüldü — ilerleme bunun üzerinden yazılır. */
function runSeen(r){ return new Set((r.log || []).map(x => x.id)).size; }
/** Turun ilk denemedeki isabeti. */
function runPct(r){
  const first = (r.log || []).filter(x => x.round === 1);
  if (!first.length) return null;
  return Math.round(first.filter(x => x.ok).length / first.length * 100);
}
/** Geçmiş listesinde bir tur satırı. */
function hisRow(r){
  const pct = runPct(r);
  const dot = !r.done ? 'live' : pct === null ? '' : pct >= 75 ? 'ok' : pct >= 50 ? 'mid' : 'bad';
  const alt = r.done
    ? stamp(r.t0) + ' · ' + runSeen(r) + ' soru'
    : stamp(r.t0) + ' · ' + runSeen(r) + ' / ' + (r.n0 || 0) + ' soru';
  return '<button class="hisrow" data-run="' + r.id + '" type="button">' +
    '<span class="hdot ' + dot + '"></span>' +
    '<span class="hi"><b>' + esc(r.title || 'Tur') + '</b><i>' + alt + '</i></span>' +
    '<span class="hpct' + (r.done ? '' : ' go2x') + '">' +
      (r.done ? (pct === null ? '—' : '%' + pct) : 'Devam et') + '</span></button>';
}

/** İlerleme halkası — modül ne kadar tamamlandı. */
function ringSvg(pct, done){
  const r = 25, c = 2 * Math.PI * r;
  return '<svg class="ring' + (done ? ' done' : '') + '" viewBox="0 0 60 60" ' +
    'width="60" height="60" aria-hidden="true">' +
    '<circle class="rbg" cx="30" cy="30" r="' + r + '"/>' +
    '<circle class="rfg" cx="30" cy="30" r="' + r + '" style="stroke-dasharray:' + c +
      ';stroke-dashoffset:' + (c * (1 - pct / 100)) + '"/>' +
    '<text class="rtx" x="30" y="30">%' + pct + '</text></svg>';
}

function openBox(id){ const b = el(id); if (b) b.open = true; }

// ── Konu ağacı (modül kutusunun içinde, varsayılan kapalı) ──
let expanded = {}, pickOpen = false;
function buildTree(){
  const t = el('tree');
  if (!t) return;                 // hepsi geçildiyse seçici çizilmez
  t.innerHTML = SUBJ.map((s, si) => {
    const qs = QS.filter(q => q[1] === si && inToggles(q));
    if (!qs.length) return '';
    const sel = F.pick[s.c];
    const state = !sel ? '' : (sel.length === 0 ? 'all' : 'some');
    const secs = s.sec.map((sc, i) => {
      const n = qs.filter(q => q[2] === i).length;
      if (!n) return '';
      const on = sel && (sel.length === 0 || sel.includes(sc[0]));
      return '<div class="row"><button class="tick ' + (on ? 'all' : '') + '" data-s="' + s.c +
        '" data-c="' + sc[0] + '" type="button">' + (on ? '◼' : '◻') + '</button>' +
        '<button class="nm" data-solo="' + s.c + '" data-c="' + sc[0] + '" type="button" title="' +
        esc(sc[1]) + '">' + esc(sc[1]) + '<b>' + n + '</b></button></div>';
    }).join('');
    return '<div class="node' + (state ? ' sel' : '') + '"><div class="row">' +
      '<button class="tick ' + state + '" data-s="' + s.c + '" type="button">' +
        (state === 'all' ? '◼' : state === 'some' ? '◧' : '◻') + '</button>' +
      '<button class="nm" data-solo="' + s.c + '" type="button">' + s.c + ' · ' + esc(s.n) +
        '<b>' + qs.length + '</b></button>' +
      '<button class="exp' + (expanded[s.c] ? ' open' : '') + '" data-x="' + s.c +
        '" type="button" aria-label="Bölümler">›</button></div>' +
      '<div class="kids' + (expanded[s.c] ? '' : ' hidden') + '">' + secs + '</div></div>';
  }).join('');

  t.querySelectorAll('.exp').forEach(b => b.onclick = () => {
    expanded[b.dataset.x] = !expanded[b.dataset.x];
    buildTree();
  });
  t.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = b.dataset.s, c = b.dataset.c;
    if (c) toggleSection(s, c); else toggleSubject(s);
    savePref(); pickOpen = true; home();
  });
  // Ada dokunmak seçimi tek başına o modüle/bölüme alır ve seçiciyi kapatır
  t.querySelectorAll('[data-solo]').forEach(b => b.onclick = () => {
    const s = b.dataset.solo, c = b.dataset.c;
    F.pick = {}; F.pick[s] = c ? [c] : [];
    savePref(); pickOpen = false; home();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  const ta = el('tAll');
  if (ta) ta.onclick = () => { F.pick = {}; savePref(); pickOpen = true; home(); };
  const tp = el('tPass');
  if (tp) tp.onclick = () => {
    openStats();
    const h = el('passHead');
    if (h) h.scrollIntoView({ block:'start', behavior:'smooth' });
  };
}
function toggleSubject(code){
  if (F.pick[code]) delete F.pick[code];
  else F.pick[code] = [];          // boş dizi = dersin tamamı
}
function toggleSection(code, sec){
  const s = SUBJ.find(x => x.c === code);
  const all = s.sec.map(x => x[0]);
  let sel = F.pick[code];
  if (!sel) sel = [];                       // ders seçili değildi
  else if (sel.length === 0) sel = all.slice();   // tamamı seçiliydi, tek tek yap
  else sel = sel.slice();
  const i = sel.indexOf(sec);
  i < 0 ? sel.push(sec) : sel.splice(i, 1);
  if (!sel.length) delete F.pick[code];
  else if (sel.length === all.length) F.pick[code] = [];
  else F.pick[code] = sel;
}

// ── Soru ekranı ──
function draw(){
  const q = R.list[R.i], s = SUBJ[q[1]], sec = s.sec[q[2]];
  const shown = R.picked !== null && F.mode === 'study';
  const k = card(q[0]), st = stars();
  const retry = R.round > 1;

  const opts = R.order.map((oi, pos) => {
    let cls = 'opt', mark = '';
    if (shown){
      if (oi === 0){ cls += ' right'; mark = 'DOĞRU'; }

      (R.picked !== null ? ' disabled' : '') + ' type="button">' +

        'Sonraki soru geliyor…<s>' + when(card(q[0])) + '</s></span></div>'
      : '<div class="verdict bad"><span class="p">Yanlış</span><span class="x">' +
        'Doğru cevap yukarıda yeşil: <b>' + KEYS[R.order.indexOf(0)] + ' şıkkı</b>' +

      '<button class="navb' + (navOpen ? ' on' : '') + '" id="navBtn" type="button" ' +
        'aria-expanded="' + (navOpen ? 'true' : 'false') + '" ' +
        'title="Sorular arasında gez">Soru <b class="num">' + (R.i + 1) + '</b> / ' +
        '<b class="num">' + R.list.length + '</b><span class="cv">›</span></button>' +
      '<span class="lbl"' + (retry ? ' style="color:var(--bad)"' : '') + '>' +
        (retry ? 'Yanlış turu ' + R.round : deckName()) + '</span></div>' +
    '<div class="navpop' + (navOpen ? '' : ' hidden') + '" id="navPop">' +
      '<div class="navrow">' +
        '<button class="nb" data-nav="first" type="button" title="İlk soru (Home)">⏮</button>' +
        '<button class="nb" data-nav="prev" type="button" title="Önceki (←)">◀</button>' +
        '<button class="nb" data-nav="next" type="button" title="Sonraki (→)">▶</button>' +
        '<button class="nb" data-nav="last" type="button" title="Son soru (End)">⏭</button>' +
        '<input type="number" id="navNo" min="1" max="' + R.list.length +
          '" value="' + (R.i + 1) + '" inputmode="numeric" aria-label="Soru numarası">' +
        '<button class="nb wide" id="navGo" type="button">Git</button>' +
      '</div>' +
      '<div class="note">Cevapladığın <b class="num">' +
        R.picks.filter(x => x !== undefined && x !== null).length + '</b> / ' +
        '<b class="num">' + R.list.length + '</b> · ' +
        '<kbd>A</kbd>–<kbd>E</kbd> ya da <kbd>1</kbd>–<kbd>5</kbd> ile cevapla, ' +
        '<kbd>←</kbd><kbd>→</kbd> ile gez</div>' +
    '</div>' +

      (q[5] ? '<span class="tag flag">tartışmalı</span>' : '') +

  const sk = el('skip'); if (sk) sk.onclick = next;

  el('star').onclick = () => {

}
function when(k){
  if (!k) return '';
  const d = k[1] - Date.now();
  if (d < 36e5) return 'Tekrar: ' + Math.max(1, Math.round(d/6e4)) + ' dakika sonra';
  if (d < DAY)  return 'Tekrar: ' + Math.round(d/36e5) + ' saat sonra';
  return 'Tekrar: ' + Math.round(d/DAY) + ' gün sonra';
}
function deckName(){
  const d = DECKS.find(x => x.k === F.deck);
  if (d) return d.t;
  if (F.deck === 'leech') return 'Takıldıklarım';
  const ks = Object.keys(F.pick);
  return ks.length ? ks.join(', ') : 'Tüm dersler';
}

function done(){
  clearTimeout(advT);
  const rec = runRec();
  if (rec){
    rec.i = R.i; rec.round = R.round; rec.log = R.log.slice();
    rec.tN = Date.now(); rec.done = true;
    delete rec.ids; delete rec.missed;        // bitmiş tur geri yüklenmez
    if (!rec.log.length) S.runs.splice(S.runs.indexOf(rec), 1);
    save();
  }
  const live = R ? { log:R.log, round:R.round, t0:R.t0, tN:Date.now() } : null;
  R = null;
  if (!live || !live.log.length) return home();
  report(live, true);
}

/** Tur raporu — hem tur biter bitmez hem de geçmişten açılınca çizilir. */
function report(rec, live){
  const log = rec.log || [], rounds = rec.round || 1;
  const first = log.filter(x => x.round === 1);
  const ok = first.filter(x => x.ok).length;
  const pct = first.length ? Math.round(ok / first.length * 100) : 0;
  const mins = Math.max(1, Math.round(((rec.tN || Date.now()) - rec.t0) / 6e4));
  const seen = [...new Set(log.map(x => x.id))];

  el('view').innerHTML =
    '<div class="card"><div style="padding:24px 16px; text-align:center">' +
      '<div class="lbl">' + (live ? 'Tur bitti' : esc(rec.title || 'Tur')) + ' · ' + mins +
        ' dakika' + (rounds > 1 ? ' · ' + rounds + ' tur' : '') + '</div>' +
      '<div class="score" style="color:' + (pct >= 75 ? 'var(--ok)' : pct >= 50 ? 'var(--ink)' : 'var(--bad)') +
        '">%' + pct + '</div>' +
      '<div class="lbl" style="margin-top:5px">İlk denemede <span class="num">' + ok +
        '</span> / <span class="num">' + first.length + '</span> doğru</div>' +
      (rounds > 1 ? '<div class="note" style="margin-top:8px">Yanlış yaptıkların tekrar soruldu, ' +
        'hepsini bilene kadar devam edildi.</div>' : '') + '</div>' +
    (() => {
      const row = id => {
        const q = BY_ID.get(id);
        const tries = log.filter(x => x.id === id);
        const firstOk = tries[0].ok;
        const fixed = tries.length > 1 && tries[tries.length - 1].ok;
        return '<div class="rrow"><span class="rdot ' + (firstOk ? 'ok' : 'bad') + '"></span>' +
          '<div style="min-width:0"><div class="q">' + esc(q[3]) + '</div><div class="a">' +
          (firstOk ? '<b>' + esc(q[4][0]) + '</b>'
                   : '<i>İlk seçimin: ' + esc(q[4][tries[0].pick]) + '</i> · <b>Doğru: ' +
                     esc(q[4][0]) + '</b>' + (fixed ? ' · sonra bildin' : '')) +
          '</div></div></div>';
      };
      const bad = seen.filter(id => !log.filter(x => x.id === id)[0].ok);
      const good = seen.filter(id => log.filter(x => x.id === id)[0].ok);
      // Yanlışlar önce ve açık; doğrular katlı — uzun turlarda ekran şişmesin
      return (bad.length
          ? '<div class="rhead"><span class="lbl">İlk denemede yanlış · ' + bad.length + '</span></div>' +
            bad.map(row).join('')
          : '') +
        (good.length
          ? '<button class="rfold" id="foldOk" type="button" aria-expanded="false">' +
              '<span class="lbl">İlk denemede doğru · ' + good.length + '</span>' +
              '<span class="chev">›</span></button>' +
            '<div id="okList" class="hidden">' + good.map(row).join('') + '</div>'
          : '');
    })() + '</div>' +
    '<div class="acts">' +
      (live ? '<button class="go" id="again" type="button">Devam et</button>' : '') +
      '<button class="go2" id="back" type="button">Ana ekran</button></div>';
  const fo = el('foldOk');
  if (fo) fo.onclick = () => {
    const list = el('okList');
    const open = !list.classList.contains('hidden');
    list.classList.toggle('hidden', open);
    fo.setAttribute('aria-expanded', String(!open));
    fo.classList.toggle('open', !open);
  };
  const ag = el('again');
  if (ag) ag.onclick = start;
  el('back').onclick = home;
}

// ── Durum paneli ──
const msg = m => { const b = el('bakMsg'); if (!b) return; b.textContent = m;
  setTimeout(() => { const x = el('bakMsg'); if (x) x.textContent = ''; }, 3500); };

function openStats(){
  let seen = 0, wrong = 0, tot = 0;
  Object.keys(S.c).forEach(id => { const k = S.c[id]; tot += k[2]; wrong += k[3]; seen++; });
  const pct = tot ? Math.round((tot - wrong) / tot * 100) : null;
  const dueN = deckCount('due'), wrongN = deckCount('wrong'), leech = deckCount('leech');
  // Kapsam sayacı: geçilen dersler hem payda hem payda dışında
  const scopedIds = new Set(QS.filter(q => !q[6] && notPassed(q)).map(q => q[0]));
  const seenScoped = Object.keys(S.c).filter(id => scopedIds.has(+id)).length;

  const per = SUBJ.map((s, si) => {
    const qs = QS.filter(q => q[1] === si && !q[6]);
    let n = 0, o = 0, u = 0;
    qs.forEach(q => { const k = S.c[q[0]]; if (k){ u++; n += k[2]; o += k[2] - k[3]; } });
    return { c:s.c, bank:qs.length, uniq:u, n, pct: n ? Math.round(o/n*100) : null };
  });
  // en zayıf bölümler
  const secs = [];
  SUBJ.forEach((s, si) => s.sec.forEach((sc, i) => {
    let n = 0, o = 0;
    QS.forEach(q => { if (q[1] === si && q[2] === i){ const k = S.c[q[0]];
      if (k){ n += k[2]; o += k[2] - k[3]; } } });
    if (n >= 4) secs.push({ c:sc[0], t:sc[1], n, pct: Math.round(o/n*100) });
  }));
  secs.sort((a,b) => a.pct - b.pct);

  const days = [];
  for (let i = 44; i >= 0; i--){
    const d = new Date(Date.now() - i*DAY).toISOString().slice(0,10);
    days.push([d, (S.day[d] || [0,0])[0]]);
  }
  const mx = Math.max(1, ...days.map(d => d[1]));
  const lvl = n => !n ? '' : n < mx*.25 ? 'l1' : n < mx*.5 ? 'l2' : n < mx*.8 ? 'l3' : 'l4';
  let streak = 0;
  for (let i = days.length - 1; i >= 0; i--){ if (days[i][1]) streak++; else if (i !== days.length-1) break; }

  el('sheetBody').innerHTML =
    '<h2>Durum</h2>' +
    '<div class="whobox"><span class="lbl">Adın</span>' +
      '<div class="whorow"><input id="pname" maxlength="28" value="' + esc(ME) + '">' +
        '<button class="tbtn" id="pSave" type="button">Kaydet</button></div>' +
      '<div class="note">Sistem rastgele verdi — istediğin gibi değiştir. ' +
        'İlerlemen bu ada bağlı saklanır.</div>' +
      (PROFILES.length > 1
        ? '<div class="whorow" style="margin-top:8px">' +
          '<select id="prof">' + PROFILES.map(x => '<option' + (x === ME ? ' selected' : '') +
            '>' + esc(x) + '</option>').join('') + '</select>' +
          '<button class="tbtn" id="pNew" type="button">+ Yeni</button></div>'
        : '<div class="whorow" style="margin-top:8px">' +
          '<button class="tbtn" id="pNew" type="button">+ Yeni profil</button></div>') +
    '</div>' +
    '<div class="stat4">' +
      '<div class="s"><span class="lbl">Başarı</span><div class="v">' + (pct === null ? '—' : '%'+pct) + '</div></div>' +
      '<div class="s"><span class="lbl">Tekrar zamanı</span><div class="v due">' + dueN + '</div></div>' +
      '<div class="s"><span class="lbl">Yanlış defteri</span><div class="v bad">' + wrongN + '</div></div>' +
      '<div class="s"><span class="lbl">Seri</span><div class="v">' + streak + ' gün</div></div></div>' +
    '<div class="lbl" style="margin-bottom:7px">Son 45 gün</div>' +
    '<div class="heat">' + days.map(d => '<i class="' + lvl(d[1]) + '" title="' + d[0] +
      ' · ' + d[1] + ' soru"></i>').join('') + '</div>' +
    '<div class="note" style="margin-bottom:16px">Gördüğün soru: <b>' + seenScoped +
      '</b> / ' + nf(scopedIds.size) +
      ((S.passed || []).length ? ' <span class="lbl">(geçtiklerin hariç)</span>' : '') +
      '</div>' +

    '<div class="lbl" style="margin-bottom:7px">Ders bazında</div>' +
    '<table class="tbl"><thead><tr><th>Ders</th><th class="n">Başarı</th><th style="width:28%"></th>' +
      '<th class="n">Kapsam</th></tr></thead><tbody>' +
      per.map(p => '<tr' + (isPassed(p.c) ? ' class="passed"' : '') + '><td><b>' + p.c +
        '</b>' + (isPassed(p.c) ? ' <span class="pflag">geçildi</span>' : '') +
        '</td><td class="n">' +
        (p.pct === null ? '—' : '%'+p.pct) + '</td><td><div class="bar2"><i class="' +
        (p.pct === null ? '' : p.pct >= 75 ? 'ok' : p.pct < 50 ? 'bad' : '') + '" style="width:' +
        (p.pct || 0) + '%"></i></div></td><td class="n">' + p.uniq + '/' + p.bank + '</td></tr>').join('') +
    '</tbody></table>' +

    '<div class="lbl" id="passHead" style="margin:18px 0 7px">Geçtiğim sınavlar</div>' +
    '<div class="note" style="margin-bottom:9px">İşaretlediğin ders toplam soru sayısından, ' +
      'konu listesinden ve turlardan çıkar. İstediğin an geri alırsın.</div>' +
    '<div class="pchips">' + SUBJ.map(s => {
      const m = moduleStat(s.c, true);
      return '<button class="pchip' + (isPassed(s.c) ? ' on' : '') + '" data-pass="' + s.c +
        '" type="button" aria-pressed="' + (isPassed(s.c) ? 'true' : 'false') + '">' +
        '<span class="tk"></span><b>' + s.c + '</b><span class="nm">' + esc(s.n) + '</span>' +
        '<i class="num">' + m.total + '</i></button>';
    }).join('') + '</div>' +
    '<div class="note" id="passSum" style="margin-top:8px"></div>' +

    (secs.length ? '<div class="lbl" style="margin:16px 0 7px">En zayıf bölümlerin</div>' +
      '<table class="tbl"><tbody>' + secs.slice(0,8).map(s =>
        '<tr><td><b>' + s.c + '</b> · ' + esc(s.t) + '</td><td class="n">%' + s.pct + '</td>' +
        '<td style="width:24%"><div class="bar2"><i class="' + (s.pct < 50 ? 'bad' : s.pct >= 75 ? 'ok' : '') +
        '" style="width:' + s.pct + '%"></i></div></td></tr>').join('') + '</tbody></table>' : '') +

    (leech ? '<div class="note" style="margin-top:14px"><b style="color:var(--bad)">' + leech +
      '</b> soruda takılıyorsun. <button class="tbtn" id="goLeech" type="button">Bunlara çalış</button></div>' : '') +

    '<div class="lbl" style="margin:18px 0 7px">Yedek</div>' +
    '<div class="note" style="margin-bottom:8px">İlerleme bu tarayıcıda, <b>' + esc(ME) +
      '</b> profilinde. Başka cihaza taşımak için metni kopyala, orada aynı kutuya yapıştırıp Yükle.</div>' +
    '<textarea id="bak" spellcheck="false" placeholder="Yedek metnini buraya yapıştır…"></textarea>' +
    '<div style="display:flex; gap:7px; flex-wrap:wrap; margin-top:8px">' +
      '<button class="tbtn" id="copy" type="button">Kopyala</button>' +
      '<button class="tbtn" id="load" type="button">Yükle</button>' +
      (window.self === window.top
        ? '<button class="tbtn" id="dl" type="button">Dosya indir</button>' +
          '<button class="tbtn" id="imp" type="button">Dosya seç</button>' : '') +
      '<button class="tbtn" id="wipe" type="button" style="color:var(--bad); border-color:var(--bad)">Sıfırla</button>' +
    '</div><div class="note" id="bakMsg"></div>' +
    '<input type="file" id="impFile" accept="application/json" class="hidden">';

  el('sheet').classList.add('on');
  el('pSave').onclick = () => {
    const nv = el('pname').value.trim().slice(0, 28);
    if (!nv || nv === ME) return;
    if (PROFILES.includes(nv)){ msg('Bu ad zaten kullanılıyor.'); return; }
    renameProfile(ME, nv);
    openStats();
  };
  el('pname').onkeydown = e => { if (e.key === 'Enter') el('pSave').click(); };
  el('pNew').onclick = () => switchProfile(randomName(PROFILES));
  const ps = el('prof'); if (ps) ps.onchange = e => switchProfile(e.target.value);
  const gl = el('goLeech');
  if (gl) gl.onclick = () => { closeSheet(); F.deck = 'leech'; savePref(); start(); };

  // Geçilen sınav çipleri — panel yeniden çizilmez, dokunuş anında yansır
  const passSum = () => {
    const on = (S.passed || []).length;
    const kalan = QS.filter(q => inToggles(q)).length;
    el('passSum').innerHTML = on
      ? '<b>' + on + '</b> ders geçildi · kapsamda kalan <b>' + nf(kalan) + '</b> soru'
      : 'Henüz işaretlemedin — bütün dersler kapsamda.';
  };
  el('sheetBody').querySelectorAll('[data-pass]').forEach(b => b.onclick = () => {
    togglePassed(b.dataset.pass);
    const on = isPassed(b.dataset.pass);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    passSum();
  });
  passSum();

  const bak = el('bak'); bak.value = JSON.stringify(S);
  el('copy').onclick = async () => {
    bak.select(); bak.setSelectionRange(0, 999999);
    let done = false;
    try{ await navigator.clipboard.writeText(bak.value); done = true; }
    catch(e){ try{ done = document.execCommand('copy'); }catch(e2){} }
    msg(done ? 'Kopyalandı. Diğer cihazda bu kutuya yapıştır.' : 'Kopyalanamadı — elle seç ve kopyala.');
  };
  el('load').onclick = () => {
    const r = merge(bak.value);
    if (r === true){ closeSheet(); home(); } else msg(r);
  };
  if (el('dl')){
    el('dl').onclick = () => {
      const b = new Blob([JSON.stringify(S)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'atpl-' + ME + '-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    el('imp').onclick = () => el('impFile').click();
  }
  el('impFile').onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { const r = merge(rd.result);
      if (r === true){ closeSheet(); home(); } else msg(r); };
    rd.readAsText(f); e.target.value = '';
  };
  let armed = false;
  el('wipe').onclick = () => {
    if (!armed){ armed = true; el('wipe').textContent = 'Emin misin? Tekrar bas';
      setTimeout(() => { armed = false; const w = el('wipe'); if (w) w.textContent = 'Sıfırla'; }, 4000);
      return; }
    S = blank(); Object.assign(F, DEFAULTS); save(); closeSheet(); home();
  };
}

/** Yedek metnini mevcut ilerlemeyle birleştirir; daha çok görülmüş kayıt kazanır. */
function merge(text){
  let p;
  try{ p = JSON.parse(text); }catch(e){ return 'Metin bozuk — tamamını kopyaladığından emin ol.'; }
  if (!p || p.v !== 2 || typeof p.c !== 'object') return 'Bu bir ATPL Çalışma yedeği değil.';
  Object.keys(p.c).forEach(id => {
    const a = S.c[id], b = p.c[id];
    if (Array.isArray(b) && b.length === 5 && (!a || b[2] > a[2])) S.c[id] = b;
  });
  S.star = Array.from(new Set(S.star.concat(p.star || [])));
  Object.keys(p.day || {}).forEach(d => {
    const a = S.day[d] || [0,0], b = p.day[d];
    if (Array.isArray(b)) S.day[d] = [Math.max(a[0], b[0]), Math.max(a[1], b[1])];
  });
  save();
  return true;
}

// ── Ders notları ──
function openNotes(id){
  if (id === undefined){
    el('sheetBody').innerHTML = '<h2>Konu anlatımı</h2>' +
      (NOTES.length
        ? '<div class="notelist">' + NOTES.map((n, i) =>
            '<button class="noteitem" data-n="' + i + '" type="button">' +
            (n.s ? '<span class="c">' + esc(n.s) + '</span>' : '<span class="c">—</span>') +
            '<span>' + esc(n.t) + '</span></button>').join('') + '</div>'
        : '<div class="empty">Henüz ders notu eklenmemiş.<br>' +
          '<span style="font-size:12px">notes/ klasörüne .md dosyası koyup ' +
          'build_web.py çalıştır.</span></div>') +
      '<div class="note" style="margin-top:14px">Notlar depodaki <b>notes/</b> klasöründen ' +
      'gelir; uygulamaya gömülüdür, internet gerekmez.</div>';
    el('sheet').classList.add('on');
    el('sheetBody').querySelectorAll('.noteitem').forEach(b =>
      b.onclick = () => openNotes(+b.dataset.n));
    return;
  }
  const n = NOTES[id];
  el('sheetBody').innerHTML =
    '<h2><button class="tbtn" id="nBack" type="button">‹ Geri</button>' +
      '<span class="sp"></span>' + (n.s ? '<span class="lbl">' + esc(n.s) + '</span>' : '') + '</h2>' +
    '<div class="md">' + md(n.md) + '</div>';
  el('nBack').onclick = () => openNotes();
  el('sheetBody').scrollTop = 0;
}

/** Küçük Markdown dönüştürücü — başlık, tablo, liste, kalın, kod, alıntı. */
function md(src){
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0, list = null;
  const closeList = () => { if (list){ out.push('</' + list + '>'); list = null; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l) && /^\s*\|?[\s:-]*-[\s:|-]*$/.test(lines[i+1] || '')){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw"><table><thead><tr>' +
        head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){
      closeList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ closeList(); out.push('<hr>'); }
    else if ((m = l.match(/^\s*>\s?(.*)$/))){
      closeList();
      // Ardışık alıntı satırları tek bloğa toplanır
      const qb = [m[1]];
      let q2;
      while (i + 1 < lines.length && (q2 = lines[i+1].match(/^\s*>\s?(.*)$/))){
        if (!q2[1].trim()) break;
        qb.push(q2[1]); i++;
      }
      out.push('<blockquote>' + inline(qb.join(' ')) + '</blockquote>');
    }
    else if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){
      if (list !== 'ul'){ closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inline(m[1]) + '</li>');
    } else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
      if (list !== 'ol'){ closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inline(m[1]) + '</li>');
    } else if (!l.trim()){ closeList(); }
    else {
      closeList();
      // Yumuşak satır sonları tek paragrafa toplanır
      const buf = [l];
      while (i + 1 < lines.length){
        const nx = lines[i+1];
        if (!nx.trim() || /^\s*([-*+]|\d+[.)])\s/.test(nx) || /^#{1,4}\s/.test(nx) ||
            /^\s*>/.test(nx) || /^\s*\|/.test(nx) || /^\s*(-{3,}|\*{3,})\s*$/.test(nx)) break;
        buf.push(nx); i++;
      }
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
    }
    i++;
  }
  closeList();
  return out.join('');
}

function closeSheet(){
  el('sheet').classList.remove('on');
  // Geçilen sınav listesi değiştiyse ana ekranı tazele (tur sürüyorsa dokunma)
  if (passDirty){ passDirty = false; if (!R) home(); }
}

// ── Olaylar ──
const th = ls.get('atpl.theme');
if (th) document.documentElement.setAttribute('data-theme', th);
el('bTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const nx = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx);
  ls.set('atpl.theme', nx);
};
el('bWho').onclick = openStats;
el('bStats').onclick = openStats;
function paintWho(){
  el('bWho').innerHTML = avatar(ME) + '<span class="nm">' + esc(ME) + '</span>';
  el('bWho').title = ME + ' — profil ve durum';
}
el('bNotes').onclick = () => openNotes();
el('veil').onclick = closeSheet;

document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && tg.matches && tg.matches('input, select, textarea')) return;
  if (e.key === 'Escape'){
    if (navOpen && R){ el('navBtn').click(); return; }
    closeSheet(); return;
  }
  if (!R) return;
  const k = e.key;
  let p = -1;
  if (k >= '1' && k <= '5') p = +k - 1;                     // 1–5
  else if (/^[a-eA-E]$/.test(k)) p = k.toLowerCase().charCodeAt(0) - 97;   // A–E
  if (p >= 0){
    if (p < R.order.length && R.picked === null){ pick(p); e.preventDefault(); }
    return;
  }
  if (k === 'Enter'){ if (R.picked !== null){ next(); e.preventDefault(); } }
  else if (k === 'ArrowRight'){ nextQ(); e.preventDefault(); }
  else if (k === 'ArrowLeft'){ prevQ(); e.preventDefault(); }
  else if (k === 'Home'){ goTo(0); e.preventDefault(); }
  else if (k === 'End'){ goTo(R.list.length - 1); e.preventDefault(); }
  else if (k === 's' || k === 'S'){
    const b = el('star'); if (b){ b.click(); e.preventDefault(); }
  }
});

loadProfile();
if (!Object.keys(F.pick).length && !S.pref) autoPickModule();
if (!Object.keys(F.pick).length && !Object.keys(S.c).length) autoPickModule();
paintWho();
if (S.runs[0] && !S.runs[0].done) resumeRun(S.runs[0].id); else home();
})();
</script>

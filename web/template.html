<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PPL Çalışma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E9EEF3;
  --ink:#10151C; --ink-2:#4A5563; --ink-3:#7B8794;
  --rule:#D6DDE5; --rule-2:#B4BFCB;
  --accent:#C21A6B; --accent-soft:#FBE7F0; --accent-ink:#8E0F4C; --on-accent:#FFFFFF;
  --cyan:#0B6E7F; --cyan-soft:#E1F1F4;
  --due:#A8620A; --due-soft:#FBF0DE;
  --ok:#15764F; --ok-soft:#E2F3EB; --bad:#B32318; --bad-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(16,21,28,.05), 0 12px 32px -18px rgba(16,21,28,.30);
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-read:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-num:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
    --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
    --rule:#232E3B; --rule-2:#374553;
    --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
    --cyan:#4FBACE; --cyan-soft:#0D2930;
    --due:#E9AE5A; --due-soft:#2A2013;
    --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
  --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
  --rule:#232E3B; --rule-2:#374553;
  --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
  --cyan:#4FBACE; --cyan-soft:#0D2930;
  --due:#E9AE5A; --due-soft:#2A2013;
  --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

.lbl{font-family:var(--f-num); font-size:10px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ── Üst şerit ── */
.bar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:7px;
  padding:9px 12px; background:var(--surface); border-bottom:1px solid var(--rule);
  padding-top:calc(9px + env(safe-area-inset-top))}
.bar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px;
  letter-spacing:-.01em; white-space:nowrap}
.bar .logo svg{width:18px; height:18px; flex:none}
.bar .logo .long{display:inline}
@media (max-width:430px){ .bar .logo .long{display:none} }
.bar .sp{flex:1}
.tbtn{border:1px solid var(--rule); border-radius:var(--r); padding:6px 9px;
  font-family:var(--f-num); font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.tbtn:hover{border-color:var(--rule-2); color:var(--ink)}
.tbtn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.ava{flex:none; width:21px; height:21px; border-radius:50%; display:inline-grid;
  place-items:center; background:hsl(var(--h) 46% 38%); color:#fff;
  font-family:var(--f-ui); font-size:9px; font-weight:700; letter-spacing:.02em;
  line-height:1; text-transform:uppercase; overflow:hidden; position:relative}
/* Resim baş harflerin üstünü örter; yüklenemezse img silinir, harfler geri gelir */
.ava.pic{color:transparent}
.ava img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#bWho{display:inline-flex; align-items:center; gap:7px; padding:4px 9px 4px 5px;
  font-family:var(--f-ui); font-size:12.5px; font-weight:600; letter-spacing:0;
  text-transform:none; color:var(--ink-2)}
#bWho .nm{display:none}
#bWho{padding:4px 5px}
/* Google girişi aranmasın diye üst çubukta duruyor; girince gizlenir */
.gsign{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 8px;
  border:1px solid var(--rule-2); border-radius:99px; text-transform:none;
  font-family:var(--f-ui); font-size:12.5px; font-weight:600; letter-spacing:0}
.gsign:hover{border-color:var(--accent)}
.gsign svg{width:14px; height:14px; flex:none}
@media (max-width:430px){ .gsign span{display:none} .gsign{padding:5px 8px} }

.page{max-width:760px; margin:0 auto; padding:14px 14px 24px}
@media (min-width:720px){ .page{padding:22px 20px 32px} }
h1{margin:0 0 4px; font-size:23px; font-weight:700; letter-spacing:-.022em; text-wrap:balance}
.sub{margin:0 0 18px; color:var(--ink-2); font-size:14px}

/* ── Desteler ── */
/* ── Kimlik satırı ── */
.idline{display:flex; width:100%; align-items:center; gap:9px; padding:9px 12px;
  background:var(--surface); border:1px solid var(--rule); border-radius:99px;
  margin-bottom:14px; transition:border-color .12s}
.idline:hover{border-color:var(--rule-2)}
.idline .nm{font-size:13.5px; font-weight:600; letter-spacing:-.01em; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.idline .sep{flex:1}
.idline .mini{font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.idline .mini b{color:var(--ink-2); font-weight:500}
.idline .chev{flex:none; color:var(--ink-3); font-family:var(--f-num); font-size:13px}
.idline:hover .chev{color:var(--accent)}
.idline .stats{display:flex; align-items:center; gap:10px; min-width:0}
.csync{flex:none; width:7px; height:7px; border-radius:50%; background:var(--ok)}
.csync.wait{background:var(--accent)}
.csync.err{background:var(--bad)}
@media (max-width:430px){
  .idline{display:grid; grid-template-columns:auto minmax(0,1fr) auto;
    column-gap:10px; row-gap:1px; border-radius:16px; padding:9px 13px}
  .idline .ava{grid-row:1 / span 2}
  .idline .nm{grid-column:2; grid-row:1}
  .idline .stats{grid-column:2; grid-row:2; gap:2px 9px; flex-wrap:wrap}   /* süre uzayınca taşmasın */
  .idline .chev{grid-column:3; grid-row:1 / span 2}
  .idline .sep{display:none}
}

/* ── Kahraman kart ── */
.hero{background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow); padding:16px; margin-bottom:12px}
.hero .modpick{display:flex; width:100%; align-items:center; gap:13px; text-align:left;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
  padding:11px 12px; margin-bottom:12px; cursor:pointer; transition:border-color .12s}
.hero .modpick:hover{border-color:var(--rule-2)}
.hero .modpick .chev{flex:none; color:var(--ink-3); font-family:var(--f-num);
  font-size:15px; transition:transform .16s, color .12s}
.hero .modpick:hover .chev{color:var(--accent)}
.hero .modpick.open{border-color:var(--rule-2); border-bottom-left-radius:0;
  border-bottom-right-radius:0; margin-bottom:0}
.hero .modpick.open .chev{transform:rotate(90deg); color:var(--accent)}
.hero .picker{border:1px solid var(--rule-2); border-top:0; border-radius:0 0 var(--r) var(--r);
  background:var(--surface-2); padding:11px; margin-bottom:12px}
.hero .picker .tools{align-items:center; margin-bottom:9px}
.hero .picker .tools .note{flex:1 1 11rem; margin-top:0; font-size:11.5px; color:var(--ink-3)}
.hero .picker .tree{background:var(--surface); max-height:min(44vh, 340px);
  overflow:auto; overscroll-behavior:contain}
.hero .hinfo{display:block; min-width:0; flex:1}
.hero .hinfo .lbl{display:block}
.hero .hname{display:block; font-size:17px; font-weight:600; letter-spacing:-.015em;
  line-height:1.3; margin-top:3px; text-wrap:balance}
.hero .hname b{font-family:var(--f-num); font-weight:500; color:var(--accent)}
.hero .hname .frag{font-family:var(--f-num); font-size:11px; font-weight:500;
  color:var(--ink-3); vertical-align:middle; white-space:nowrap}
.hero .hsub{display:block; font-size:12.5px; color:var(--ink-3); margin-top:5px}
.hero .hsub i{font-style:normal; opacity:.75}
.hero .hsub .num{color:var(--ink-2); font-weight:500}
.hero .hsub .ok{color:var(--ok); font-weight:600}
.hero .hact{display:flex; justify-content:center; gap:8px; flex-wrap:wrap}
.hero .hact .go{flex:0 1 20rem; min-width:11rem}
.hero .hact .go2{flex:0 1 9rem}
.hero .hact .go{min-width:0}
.hero .hwarn{margin-top:9px; font-size:12px; line-height:1.5; color:var(--ink-3);
  text-align:center}
.hero .hwarn b{color:var(--ink-2); font-weight:600}
.hero .hnext{display:block; width:100%; text-align:center; margin-top:9px; padding:9px;
  font-size:12.5px; color:var(--cyan); border-radius:var(--r)}
.hero .hnext:hover{background:var(--surface-2)}
.hero.welcome{text-align:left}
.hero .wtitle{font-size:20px; font-weight:700; letter-spacing:-.02em; margin-bottom:6px}
.hero .wtext{margin:0 0 15px; font-size:13.5px; color:var(--ink-2); line-height:1.55}
.hero .wtext b{color:var(--ink)}


/* ── İlerleme halkası ── */
.ring{flex:none}
.ring .rbg{fill:none; stroke:var(--surface-3); stroke-width:5}
.ring .rfg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round;
  transform:rotate(-90deg); transform-origin:30px 30px; transition:stroke-dashoffset .45s ease}
.ring.done .rfg{stroke:var(--ok)}
.ring .rtx{fill:var(--ink); font-family:var(--f-num); font-size:14px; font-weight:500;
  text-anchor:middle; dominant-baseline:central}

/* ── Yarım kalan tur ── */
.resume{display:flex; width:100%; align-items:center; gap:10px; text-align:left;
  padding:10px 13px; margin-bottom:12px; border-radius:var(--r);
  background:var(--accent-soft); border:1px solid var(--accent);
  color:var(--accent-ink); transition:filter .12s}
.resume:hover{filter:brightness(1.06)}
.resume .rl{display:block; min-width:0; flex:1}
.resume .rl b{display:block; font-size:10.5px; font-family:var(--f-num); font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; opacity:.75}
.resume .rl span{display:block; font-size:13.5px; font-weight:600; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.resume .rn{flex:none; font-size:11.5px; font-family:var(--f-num)}
.resume .chev{flex:none; font-family:var(--f-num); font-size:14px}

/* ── Tur geçmişi ── */
.hislist{display:flex; flex-direction:column; gap:6px}
.hisrow{display:flex; width:100%; align-items:center; gap:10px; text-align:left;
  padding:9px 11px; border-radius:var(--r); background:var(--surface-2);
  border:1px solid var(--rule); transition:border-color .12s}
.hisrow:hover{border-color:var(--rule-2)}
.hisrow .hdot{flex:none; width:7px; height:7px; border-radius:50%; background:var(--ink-3)}
.hisrow .hdot.ok{background:var(--ok)} .hisrow .hdot.mid{background:var(--accent)}
.hisrow .hdot.bad{background:var(--bad)}
.hisrow .hdot.live{background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.hisrow .hi{display:block; flex:1; min-width:0}
.hisrow .hi b{display:block; font-size:13px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hisrow .hi i{display:block; font-style:normal; font-size:11px; color:var(--ink-3);
  font-family:var(--f-num); margin-top:2px}
.hisrow .hpct{flex:none; font-family:var(--f-num); font-size:12.5px; color:var(--ink-2)}
.hisrow .hpct.go2x{color:var(--accent); font-weight:500}

/* ── Deste çipleri ── */
.chiprow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.dchip{display:inline-flex; align-items:center; gap:6px; padding:7px 13px;
  border:1px solid var(--rule); border-radius:99px; background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
  transition:border-color .12s, background .12s}
.dchip:hover{border-color:var(--rule-2); color:var(--ink)}
.dchip b{font-weight:600; color:var(--ink)}
.dchip.due b{color:var(--due)} .dchip.wrong b{color:var(--bad)}
.dchip.new b{color:var(--cyan)} .dchip.star b{color:var(--accent)}
.dchip.leech b{color:var(--bad)}
.dchip.slow b{color:var(--due)}
.dchip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.dchip.on b{color:var(--on-accent)}

.nextmod{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--rule); border-left:2px solid var(--cyan); border-radius:var(--r);
  padding:11px 13px; font-size:12.5px; color:var(--ink-2); margin-bottom:12px}
.nextmod:hover{border-color:var(--rule-2); color:var(--ink)}
.nextmod b{font-family:var(--f-num); color:var(--cyan)}

.go{flex:1; background:var(--accent); color:var(--on-accent); border-radius:var(--r);
  padding:15px 20px; font-size:16px; font-weight:600; text-align:center}
.go:hover{filter:brightness(1.07)}
/* Birincil düğmenin alt satırı — genel .sub rengini devralmasın diye ayrı ad */
.go .gsub{display:block; margin-top:3px; color:var(--on-accent); opacity:.72;
  font-family:var(--f-num); font-size:11px; font-weight:500; letter-spacing:.03em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.go:disabled{opacity:.4; cursor:not-allowed; filter:none}
.go2{flex:none; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:15px 16px; font-size:14px; font-weight:500; color:var(--ink-2)}
.go2:hover{border-color:var(--rule-2); color:var(--ink)}
/* Sessiz üçüncül eylem — dokunma alanı büyük, görsel ağırlığı düşük */
.go3{flex:none; background:none; border:1px solid transparent; border-radius:var(--r);
  padding:15px 10px; font-size:12px; font-weight:500; color:var(--ink-3);
  transition:color .12s, border-color .12s}
.go3:hover{color:var(--bad); border-color:var(--rule)}

/* ── Akordeon kutular ── */
.box{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  margin-bottom:10px; overflow:hidden}
.box > summary{list-style:none; cursor:pointer; padding:12px 14px; display:flex;
  align-items:center; gap:9px; background:var(--surface-2);
  border-bottom:1px solid transparent; font-size:13.5px; font-weight:600}
.box > summary::-webkit-details-marker{display:none}
.box[open] > summary{border-bottom-color:var(--rule)}
.box > summary .chev{margin-left:auto; color:var(--ink-3); font-family:var(--f-num);
  font-size:12px; transition:transform .15s}
.box[open] > summary .chev{transform:rotate(90deg)}
.box .in{padding:13px}
.pill{font-family:var(--f-num); font-size:10px; font-weight:500; letter-spacing:.04em;
  color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent);
  border-radius:99px; padding:2px 8px}
.pill.off{color:var(--ink-3); background:var(--surface-3); border-color:var(--rule)}

/* ── Konu ağacı ── */
.tools{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
.tree{border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.node + .node{border-top:1px solid var(--rule)}
.row{display:flex; align-items:center; gap:0; background:var(--surface)}
.row:hover{background:var(--surface-2)}
.tick{flex:none; width:38px; height:42px; display:grid; place-items:center;
  font-family:var(--f-num); font-size:13px; color:var(--ink-3)}
.tick.all{color:var(--accent)} .tick.some{color:var(--accent); opacity:.75}
.nm{flex:1; text-align:left; padding:11px 6px 11px 0; font-size:13.5px; font-weight:500;
  min-width:0; line-height:1.35}
.nm b{font-family:var(--f-num); font-size:10.5px; font-weight:500; color:var(--ink-3);
  margin-left:7px}
.exp{flex:none; width:36px; height:42px; display:grid; place-items:center;
  color:var(--ink-3); font-family:var(--f-num); font-size:12px; transition:transform .15s}
.exp.open{transform:rotate(90deg); color:var(--ink-2)}
.kids{background:var(--surface-2); border-top:1px solid var(--rule)}
.kids .row{background:transparent; padding-left:14px}
.kids .row:hover{background:var(--surface-3)}
.kids .nm{font-size:12.5px; font-weight:400; color:var(--ink-2)}
.kids .tick{height:36px} .kids .nm{padding:8px 4px 8px 0}
.node.sel > .row{background:var(--accent-soft)}
.node.sel > .row .nm{color:var(--accent-ink)}

/* Geçilen ders satırı */
.tbl tr.passed td{opacity:.55}
.pflag{display:inline-block; font-family:var(--f-num); font-size:9.5px; font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; padding:1px 5px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent-ink); vertical-align:middle}

/* Geçilen sınav çipleri */
.pchips{display:flex; flex-direction:column; gap:6px}
.pchip{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:9px 11px; background:var(--surface-2); border:1px solid var(--rule);
  border-radius:var(--r); font-size:13.5px; transition:border-color .12s, background .12s}
.pchip:hover{border-color:var(--rule-2)}
.pchip .tk{flex:none; width:19px; height:19px; border-radius:5px;
  border:1.5px solid var(--rule-2); display:grid; place-items:center;
  font-size:11px; line-height:1; color:transparent}
.pchip .tk::after{content:'✓'}
.pchip b{flex:none; font-family:var(--f-num); font-weight:500; color:var(--ink-2)}
.pchip .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pchip .num{flex:none; font-style:normal; font-size:11.5px; color:var(--ink-3)}
.pchip.on{background:var(--accent-soft); border-color:var(--accent)}
.pchip.on b, .pchip.on .nm{color:var(--accent-ink)}
.pchip.on .num{color:var(--accent-ink); opacity:.7}
.pchip.on .tk{background:var(--accent); border-color:var(--accent); color:var(--surface)}

.switch{display:flex; align-items:center; gap:10px; padding:9px 11px; width:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
  text-align:left; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px}
.switch:hover{border-color:var(--rule-2)}
.switch .knob{flex:none; width:32px; height:18px; border-radius:99px;
  background:var(--rule-2); position:relative; transition:background .15s}
.switch .knob::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
  border-radius:50%; background:var(--surface); transition:transform .15s}
.switch.on{color:var(--ink); border-color:var(--accent)}
.switch.on .knob{background:var(--accent)}
.switch.on .knob::after{transform:translateX(14px)}
.switch .n{margin-left:auto; font-family:var(--f-num); font-size:10.5px; color:var(--ink-3)}

.grp{margin-bottom:15px} .grp:last-child{margin-bottom:0}
.grp > .lbl{display:block; margin-bottom:7px}
input[type=search], select, textarea{width:100%; padding:10px 12px; font-size:14.5px;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--rule);
  border-radius:var(--r)}
textarea#bak{height:60px; resize:vertical; font-family:var(--f-num); font-size:11px;
  line-height:1.45; color:var(--ink-2)}
input:focus, select:focus, textarea:focus{border-color:var(--accent); outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; background:var(--surface-2); padding:9px 6px; font-size:12.5px;
  font-weight:500; color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--accent); color:var(--on-accent)}
#aiSel{display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
#aiSel button{border:none; border-left:none; background:var(--surface-2); padding:8px 4px;
  font-size:12px; font-weight:500; color:var(--ink-2); text-align:center}
#aiSel button + button{border-left:none}
#aiSel button.on{background:var(--accent); color:var(--on-accent)}
@media (min-width:540px){
  #aiSel{grid-template-columns:repeat(6, 1fr)}
}
.note{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.note b{font-family:var(--f-num); color:var(--ink); font-weight:500}

/* ── Soru ── */
.prog{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-bottom:6px}
/* İlerleme çubuğu ve yanında soru sayacı. Aynı satırda durur ki soru ekranı
   dikeyde uzamasın; sağda, tur sayacının tam üstünde — iki sayaç tek sütun. */
.progrow{display:flex; align-items:center; gap:12px; margin-bottom:6px}
.progrow .prog{flex:1; margin-bottom:0}
.qtm{flex:none; font-family:var(--f-num); font-size:10.5px; letter-spacing:.03em;
  color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums}
.qtm .qv{display:inline-block; min-width:2.6em; text-align:right; font-size:12.5px;
  font-weight:600; color:var(--ink); transition:color .2s}
.qtm .qo{color:var(--ink-3)}
.qtm.bitti .qv{color:var(--ink-2); font-weight:500}
.qtm.uzun .qv{color:var(--due)}
.qtm.dur .qv{opacity:.45}
.prog i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
.prog i.retry{background:var(--bad)}
.meta{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px}
.meta .lbl:first-of-type{margin-right:auto}
/* Deste adı en son kısalır: geri düğmesi ve sayaç hep tam görünür */
.meta > .lbl{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:400px){ .meta > .lbl{display:none} }
/* Gezinme düğmesi ve paneli — kapalıyken hiç yer kaplamaz */
/* Tur sayacı: dokununca durur/sürer. Simge yapılacak eylemi gösterir —
   sayarken duraklat (iki çubuk), dururken oynat (üçgen). Emoji değil CSS:
   iOS ⏸'yi renkli emojiye çeviriyor. */
.tmr{flex:none; display:inline-flex; align-items:center; gap:6px; margin:-3px 0;
  padding:4px 10px 4px 9px; border-radius:99px; background:var(--surface-2);
  border:1px solid var(--rule-2); color:var(--ink-2); font-size:12px; white-space:nowrap;
  transition:border-color .12s, color .12s, background .12s}
.tmr .tv{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-weight:500;
  min-width:2.6em; text-align:right}
.tmr .ti{width:8px; height:9px; border-left:3px solid currentColor;
  border-right:3px solid currentColor; box-sizing:border-box}
.tmr.off{color:var(--due); border-color:var(--due); background:var(--due-soft)}
.tmr.off .ti{width:0; height:0; border-right:0; border-left:8px solid currentColor;
  border-top:5px solid transparent; border-bottom:5px solid transparent}
.tmr.bosta .tv{opacity:.45}
@media (hover:hover) and (pointer:fine){
  .tmr:hover{border-color:var(--accent); color:var(--accent)}
  .tmr.off:hover{border-color:var(--due); color:var(--due); filter:brightness(1.1)}
}
.qpos{flex:none; font-family:var(--f-num); font-size:11.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.qpos b{color:var(--ink-2); font-weight:500}
.navpop{background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r);
  padding:10px 11px; margin:0 0 8px; box-shadow:var(--shadow)}
.navpop.hidden{display:none}
.navrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.nb{flex:none; min-width:38px; height:34px; display:grid; place-items:center;
  padding:0 9px; background:var(--surface-2); border:1px solid var(--rule);
  border-radius:8px; font-size:13px; color:var(--ink-2); transition:border-color .12s}
.nb:hover{border-color:var(--accent); color:var(--accent)}
.nb.wide{font-family:var(--f-body); font-size:12.5px; font-weight:500}
.navpop input{flex:1; min-width:64px; height:34px; padding:0 9px;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:8px;
  color:var(--ink); font-family:var(--f-num); font-size:13px; text-align:center}
.navpop input:focus{outline:none; border-color:var(--accent)}
.navpop .note{margin-top:8px; font-size:11.5px}

/* Cevap anındaki tek atımlık vurgu */
@keyframes fpulse{ from{box-shadow:0 0 0 3px var(--pc)} to{box-shadow:0 0 0 3px transparent} }
.card.fok{--pc:var(--ok); animation:fpulse .6s ease-out}
.card.fbad{--pc:var(--bad); animation:fpulse .6s ease-out}
.card.fnew{--pc:var(--accent); animation:fpulse .6s ease-out}
@media (prefers-reduced-motion: reduce){
  .card.fok, .card.fbad, .card.fnew{animation:none}
}

.backb{flex:none; display:inline-flex; align-items:center; gap:5px; margin:-3px 0;
  padding:4px 11px 4px 8px; border-radius:99px; background:var(--surface-2);
  border:1px solid var(--rule-2); color:var(--ink-2); font-size:12px; font-weight:500;
  white-space:nowrap; transition:border-color .12s, color .12s}
.backb i{font-family:var(--f-num); font-style:normal; font-size:15px; line-height:1}
.backb:hover{border-color:var(--accent); color:var(--accent)}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden}
.head{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:7px 12px;
  background:var(--surface-2); border-bottom:1px solid var(--rule)}
.head .who{font-size:11.5px; font-weight:500; color:var(--ink-2); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.head .sp{flex:1}
.tag{font-family:var(--f-num); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid currentColor; border-radius:2px; padding:2px 5px; white-space:nowrap}
.tag.fig{color:var(--ink-2)} .tag.gen{color:var(--cyan)}
.tag.flag{color:var(--accent-ink); background:var(--accent-soft)}
.tag.box{color:var(--due); background:var(--due-soft)}
.tag.slow{color:var(--due)}
.askbtn{flex:none; display:inline-flex; align-items:center; padding:3px 9px;
  border-radius:99px; border:1px solid var(--rule-2); background:var(--surface);
  color:var(--ink-2); font-family:var(--f-num); font-size:10.5px; font-weight:500;
  letter-spacing:.07em; text-transform:uppercase; text-decoration:none; cursor:pointer;
  transition:border-color .12s, color .12s}
.askbtn:hover{border-color:var(--accent); color:var(--accent)}
.askbtn.done{border-color:var(--ok); color:var(--ok)}
.askbtn .askn{font-style:normal; margin-left:5px; padding:0 5px; border-radius:99px;
  background:var(--surface-2); color:var(--ink-2); font-size:9.5px; letter-spacing:0;
  line-height:15px}
.starbtn{font-size:15px; line-height:1; padding:2px 4px; color:var(--ink-3)}
.starbtn.on{color:var(--accent)}
.qt{font-family:var(--f-read); font-size:18px; line-height:1.45; padding:14px 14px 4px;
  white-space:pre-wrap; text-wrap:pretty}
/* Çizimler bilerek beyaz zeminli: koyu temada da basılı bir şekil gibi durur */
.figbox{margin:12px 15px 2px; padding:10px; background:#ffffff;
  border:1px solid var(--rule); border-radius:var(--r)}
.figbox svg{display:block; width:100%; height:auto; max-height:min(46vh, 340px)}
@media (min-width:720px){ .qt{font-size:19.5px} }
.opts{display:flex; flex-direction:column; gap:6px; padding:9px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:10px 11px; font-family:var(--f-read); font-size:16px; line-height:1.4;
  min-height:44px; transition:border-color .1s, background .1s}
/* Üzerine gelme vurgusu yalnız gerçek farede ve imleç yeni çizimden sonra
   kıpırdayınca (.hov). Dokunmatik ekranda son dokunulan yerdeki yeni şık, masaüstünde
   de hareketsiz imlecin altındaki şık yeni soruda "seçili" gibi kalıyordu. */
@media (hover:hover) and (pointer:fine){
  .opts.hov .opt:hover:not(:disabled){border-color:var(--rule-2); background:var(--surface-2)}
}
.opt:disabled{cursor:default}
.opt .k{flex:none; width:23px; height:23px; margin-top:1px; display:grid; place-items:center;
  border:1px solid var(--rule-2); border-radius:3px; font-family:var(--f-num);
  font-size:11px; font-weight:500; color:var(--ink-2)}
.opt .m{margin-left:auto; padding-left:8px; font-family:var(--f-num); font-size:9.5px;
  letter-spacing:.08em; align-self:center}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.right .m{color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.wrong .m{color:var(--bad)}
.opt.sel{border-color:var(--accent)}
.opt.sel .k{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.verdict{display:flex; gap:10px; align-items:flex-start; padding:10px 14px;
  border-top:1px solid var(--rule); background:var(--surface-2)}
.verdict .p{font-family:var(--f-num); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 7px; border-radius:2px; flex:none}
.verdict.ok .p{background:var(--ok); color:var(--surface)}
.verdict.bad .p{background:var(--bad); color:var(--surface)}
.verdict .x{font-size:13px; color:var(--ink-2); min-width:0}
.verdict .x b{font-family:var(--f-read); font-size:15px; font-weight:600; color:var(--ink)}
.verdict .x s{display:block; margin-top:3px; font-family:var(--f-num); font-size:9.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); text-decoration:none}
/* Alt şerit: gezinme paneli + eylem satırı tek sticky kutuda durur ki
   panel açılınca düğmelerin hemen üstünde çıksın. */
.foot{margin-top:10px}
.acts{display:flex; gap:8px; align-items:stretch}
/* Birincil düğme tek satırda kalmalı: sarması alt şeridi yükseltir ve
   soruya ayrılan dikey yeri yer. Dar ekranda yazı bir punto küçülür. */
.acts .go{flex:1; min-width:0; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
@media (max-width:719px){
  .foot{position:sticky; bottom:0; margin:10px -14px 0; padding:8px 14px;
    background:var(--surface); border-top:1px solid var(--rule);
    padding-bottom:calc(8px + env(safe-area-inset-bottom))}
}
@media (max-width:420px){
  .acts .go{font-size:15px; padding-left:10px; padding-right:10px}
  .acts .navgrp .nvb{padding:0 8px}
  .acts .go3{padding-left:7px; padding-right:7px}
}
/* Gezinme takımı — eylem satırının solunda, dikeyde hiç yer kaplamaz */
.navgrp{flex:none; display:flex; align-items:stretch; background:var(--surface);
  border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.navgrp .nvb{display:grid; place-items:center; padding:0 10px; color:var(--ink-2);
  font-size:13px; border-right:1px solid var(--rule);
  transition:color .12s, background .12s}
.navgrp .nvb:last-child{border-right:none}
.navgrp .nvb:hover:not(:disabled){color:var(--accent); background:var(--surface-2)}
.navgrp .nvb:disabled{opacity:.3}
.navgrp .nn{font-family:var(--f-num); font-size:11.5px; padding:0 7px; white-space:nowrap}
.navgrp .nn.on{color:var(--accent); background:var(--accent-soft)}

/* ── Özet ── */
.score{font-family:var(--f-num); font-size:54px; font-weight:500; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.035em}
.rhead{padding:11px 15px 8px; border-bottom:1px solid var(--rule); background:var(--surface-2)}
.rfold{display:flex; width:100%; align-items:center; gap:10px; padding:12px 15px;
  background:var(--surface-2); border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule); text-align:left}
.rfold:hover{background:var(--surface-3)}
.rfold .chev{margin-left:auto; color:var(--ink-3); font-family:var(--f-num); font-size:13px;
  transition:transform .15s}
.rfold.open .chev{transform:rotate(90deg)}
.decklbl{margin-bottom:6px}
.tip{background:var(--surface-2); border:1px solid var(--rule); border-left:2px solid var(--due);
  border-radius:var(--r); padding:10px 12px; font-size:12.5px; color:var(--ink-2);
  margin-bottom:10px}
.tip b{color:var(--ink); font-weight:600}
.rrow{display:flex; gap:10px; align-items:flex-start; padding:12px 15px;
  border-bottom:1px solid var(--rule)}
.rrow:last-child{border-bottom:none}
.rdot{flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px}
.rdot.ok{background:var(--ok)} .rdot.bad{background:var(--bad)}
.rrow .q{font-family:var(--f-read); font-size:14px; line-height:1.45}
.rrow .a{font-size:12px; color:var(--ink-2); margin-top:3px}
.rrow .rtm{flex:none; margin-left:auto; padding-left:8px; font-family:var(--f-num);
  font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.rrow .rtm.slow{color:var(--due)}
/* Durum: soru başına süre listesi */
.qtlist{display:flex; flex-direction:column; gap:4px}
.qtrow{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px;
  background:var(--surface-2); border:1px solid var(--rule)}
.qtrow .qtx{flex:1; min-width:0; font-size:12.5px; color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.qtrow .qtv{flex:none; text-align:right; font-family:var(--f-num); line-height:1.25}
.qtrow .qtv b{display:block; font-size:13px; font-weight:500; color:var(--ink)}
.qtrow .qtv b.slow{color:var(--due)}
.qtrow .qtv i{display:block; font-style:normal; font-size:10px; color:var(--ink-3)}
.rrow .a b{color:var(--ok); font-weight:600} .rrow .a i{color:var(--bad); font-style:normal}

/* ── Paneller ── */
.sheet{position:fixed; inset:0; z-index:50; display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute; inset:0; background:rgba(8,11,16,.55)}
.sheet .body{position:absolute; inset:auto 0 0 0; max-height:88vh; overflow-y:auto;
  background:var(--paper); border-top:1px solid var(--rule);
  border-radius:10px 10px 0 0; padding:16px 14px calc(24px + env(safe-area-inset-bottom));
  animation:up .18s ease}
@keyframes up{from{transform:translateY(14px); opacity:.6}to{transform:none; opacity:1}}
@media (min-width:720px){
  .sheet .body{inset:0 0 0 auto; width:min(560px, 92vw); max-height:none; border-radius:0;
    border-left:1px solid var(--rule); border-top:none; padding:20px 18px}
}
.sheet h2{margin:0 0 13px; font-size:17px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; gap:10px}
.sheet h2 .sp{flex:1}
.cloud{background:var(--surface-2); border:1px solid var(--rule);
  border-radius:var(--r); padding:12px 13px}
.cloudrow{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:8px}
.cloudrow:last-child{margin-bottom:0}
.cloud .note{margin-top:0}
.cloud .note + .cloudrow{margin-top:9px}
.cwho{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; display:flex; flex-direction:column; gap:1px; min-width:0}
.cwho .cmail{font-size:11.5px; font-weight:400; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis}
.gacc{gap:10px; flex-wrap:nowrap}
.gacc .ava{width:34px; height:34px; font-size:13px}
.tbtn.cbig{padding:9px 14px; font-size:13px}
.note.bad{color:var(--bad)}
.whobox{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:12px 13px; margin-bottom:14px}
.whorow{display:flex; gap:7px; align-items:center; margin-top:6px}
.whorow input, .whorow select{flex:1; min-width:0; padding:8px 10px; font-size:14px}
.whorow .tbtn{flex:none; padding:9px 11px}
.stat4{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
.stat4 .s{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:11px 12px}
.stat4 .s .v{font-family:var(--f-num); font-size:22px; font-weight:500; line-height:1.1;
  font-variant-numeric:tabular-nums}
.stat4 .s .v.ok{color:var(--ok)} .stat4 .s .v.bad{color:var(--bad)}
.stat4 .s .v.due{color:var(--due)}
.stat4.st3{grid-template-columns:repeat(3, 1fr)}
.stat4.st3 .s .v{font-size:17px}
.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl th{text-align:left; font-family:var(--f-num); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 8px 7px;
  border-bottom:1px solid var(--rule)}
.tbl td{padding:8px; border-bottom:1px solid var(--rule)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.n{font-family:var(--f-num); font-variant-numeric:tabular-nums; text-align:right;
  white-space:nowrap}
.bar2{height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden; min-width:44px}
.bar2 i{display:block; height:100%; background:var(--accent); border-radius:99px}
.bar2 i.ok{background:var(--ok)} .bar2 i.bad{background:var(--bad)}
.heat{display:grid; grid-template-columns:repeat(15,1fr); gap:3px; margin-bottom:6px}
.heat i{aspect-ratio:1; border-radius:2px; background:var(--surface-3)}
.heat i.l1{background:var(--accent-soft)}
.heat i.l2{background:color-mix(in srgb, var(--accent) 45%, var(--surface-3))}
.heat i.l3{background:color-mix(in srgb, var(--accent) 70%, var(--surface-3))}
.heat i.l4{background:var(--accent)}

/* ── Ders notu okuyucu ── */
.notelist{display:flex; flex-direction:column; gap:7px}
.noteitem{display:flex; align-items:center; gap:10px; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:12px 13px; font-size:13.5px; font-weight:500}
.noteitem:hover{border-color:var(--accent); color:var(--accent-ink)}
.noteitem .c{font-family:var(--f-num); font-size:10.5px; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:2px; padding:2px 6px; flex:none}
.md{font-family:var(--f-read); font-size:15.5px; line-height:1.62; color:var(--ink)}
.md h1{font-family:var(--f-ui); font-size:19px; margin:0 0 12px}
.md h2{font-family:var(--f-ui); font-size:16px; margin:24px 0 8px; padding-top:14px;
  border-top:1px solid var(--rule)}
.md h3{font-family:var(--f-ui); font-size:14px; margin:18px 0 6px; color:var(--ink-2)}
.md p{margin:0 0 11px}
.md ul,.md ol{margin:0 0 12px; padding-left:20px}
.md li{margin-bottom:4px}
.md code{font-family:var(--f-num); font-size:12.5px; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:3px; padding:1px 5px}
.md strong{font-weight:600}
.md blockquote{margin:0 0 12px; padding:8px 12px; border-left:2px solid var(--accent);
  background:var(--surface-2); font-size:14.5px; color:var(--ink-2)}
.md hr{border:none; border-top:1px solid var(--rule); margin:18px 0}
.md .tw{overflow-x:auto; margin:0 0 14px; border:1px solid var(--rule); border-radius:var(--r)}
.md table{width:100%; border-collapse:collapse; font-family:var(--f-ui); font-size:12.5px}
.md th{background:var(--surface-2); text-align:left; padding:8px 10px; font-weight:600;
  border-bottom:1px solid var(--rule); white-space:nowrap}
.md td{padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:top}

<script>
(function(){
"use strict";

const DB = JSON.parse(document.getElementById('qdata').textContent);
const SUBJ = DB.s, QS = DB.q, NOTES = DB.n || [], FIGS = DB.fg || {};
/** Sorunun çizimi (varsa) — q[9] çizim adı, FIGS adı SVG'ye çevirir. */
const figOf = q => (q[9] && FIGS[q[9]]) || '';
// soru: [0]id [1]dersIdx [2]bölümIdx [3]metin [4]şıklar [5]tartışmalı [6]tekrar [7]üretilmiş [8]şekil
const BY_ID = new Map(QS.map(q => [q[0], q]));
const KEYS = ['A','B','C','D','E'];
const DAY = 864e5;
const BOX_MS = [10*6e4, DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];
const LEECH = 4, MASTER = 2;
// Son denemesi bundan uzun süren soru "Uzun sürenler" destesine girer.
// Metinlerde "1 dakika" yazıyor (çip ipucu, Durum notu); değiştirirsen onları da.
const YAVAS_MS = 60e3;

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => n.toLocaleString('tr-TR');
/** Profil simgesi: addan türeyen baş harfler + sabit renk. */
function initials(name){
  const w = String(name).trim().split(/\s+/).filter(Boolean);
  const a = (w[0] || '?')[0];
  const b = w.length > 1 ? w[w.length - 1][0] : '';
  return (a + b).toLocaleUpperCase('tr');
}
function hueOf(name){
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
const avatar = name => {
  const u = picOf(name);
  return '<span class="ava' + (u ? ' pic' : '') + '" style="--h:' + hueOf(name) +
    '" aria-hidden="true">' + esc(initials(name)) +
    (u ? '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" ' +
         'onerror="this.parentNode.classList.remove(\'pic\'); this.remove()">' : '') +
    '</span>';
};
const today = () => new Date().toISOString().slice(0,10);
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
             del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

/** Profil fotoğrafları — Google'dan gelen resim profil adına bağlı tutulur.
 *  Yerelde saklanır, buluta gitmesine gerek yok: her cihaz kendi girişinde
 *  aynı adresi zaten alıyor. */
let PICS = {};
try{ PICS = JSON.parse(ls.get('atpl.pics') || '{}') || {}; }catch(e){ PICS = {}; }
const picOf = name => (PICS && PICS[name]) || '';
function setPic(name, url){
  if (picOf(name) === (url || '')) return false;
  if (url) PICS[name] = url; else delete PICS[name];
  ls.set('atpl.pics', JSON.stringify(PICS));
  return true;
}

// ── Profiller: giriş yok. İlk ziyarette rastgele bir ad verilir, sonra değiştirilebilir ──
const AD1 = ['Sakin','Hızlı','Gümüş','Kuzey','Berrak','Serin','Altın','Mavi','Keskin',
             'Sessiz','Yüksek','Uzak','Parlak','Çevik'];
const AD2 = ['Kanat','Rüzgâr','Pervane','Rota','Ufuk','Bulut','Yıldız','Pist','Şahin',
             'Turna','Kartal','İrtifa','Kule','Yaklaşma'];
function randomName(taken){
  for (let i = 0; i < 60; i++){
    const n = AD1[Math.floor(Math.random()*AD1.length)] + ' ' +
              AD2[Math.floor(Math.random()*AD2.length)];
    if (!taken.includes(n)) return n;
  }
  return 'Pilot ' + Math.floor(Math.random()*9000 + 1000);
}

let PROFILES = [];
try{ PROFILES = JSON.parse(ls.get('atpl.profiles') || '[]'); }catch(e){ PROFILES = []; }
if (!Array.isArray(PROFILES)) PROFILES = [];
if (ls.get('atpl.v2') && !PROFILES.length) PROFILES = ['Ben'];   // eski tek profilli kayıt
if (!PROFILES.length){                    // siteye ilk kez giriliyor
  PROFILES = [randomName([])];
  ls.set('atpl.profiles', JSON.stringify(PROFILES));
  ls.set('atpl.profile', PROFILES[0]);
}
let ME = ls.get('atpl.profile') || PROFILES[0];
if (!PROFILES.includes(ME)) ME = PROFILES[0];
const keyOf = p => 'atpl.v2:' + p;

const blank = () => ({ v:2, c:{}, star:[], day:{}, pref:{}, runs:[], passed:[] });
let S = blank();
function loadProfile(){
  S = blank();
  let raw = ls.get(keyOf(ME));
  if (!raw && ME === PROFILES[0]) raw = ls.get('atpl.v2');   // eski tek profilli kayıt
  try{ const p = JSON.parse(raw || 'null'); if (p && p.v === 2) S = Object.assign(blank(), p); }catch(e){}
  if (!Array.isArray(S.runs)) S.runs = [];
  if (!Array.isArray(S.passed)) S.passed = [];
  // Varsayılan ChatGPT yapıldı; önceki varsayılanlardan ('claude' veya 'gemini') kalan tercihler temizlenir
  if ((S.prefV || 0) < 2){
    if (S.pref && (S.pref.ai === 'claude' || S.pref.ai === 'gemini')){
      delete S.pref.ai;
    }
    S.prefV = 2;
  }
  applyPref();
}
/** S.pref → F. Açılışta ve buluttan daha yeni bir ayar seti geldiğinde çalışır. */
function applyPref(){
  Object.assign(F, DEFAULTS, S.pref || {});
  delete F.hideFig;                       // süzgeç kaldırıldı, eski kayıt taşımasın
  if (!F.pick || typeof F.pick !== 'object') F.pick = {};
  S.pref = F;                             // bundan sonrası tek nesne üzerinden
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(flush, 250);
}
// ── Bulut: Google ile giriş + Firestore yedeği ──────────────────────
// Yapılandırma yoksa (artifact sürümü, kurulum yapılmamış kopya) katman
// tümüyle kapalıdır; uygulama bugünkü gibi yalnız localStorage ile çalışır.
// Firebase web anahtarı sır değildir, istemcide görünmesi normaldir —
// erişimi firestore.rules kısıtlar: herkes yalnız kendi uid'sini okur/yazar.
const FBCONF = (() => {
  try{ return JSON.parse(document.getElementById('fbconf').textContent); }
  catch(e){ return null; }
})();
const FB_SDK = 'https://www.gstatic.com/firebasejs/12.9.0/';

/** Sözü süreyle sınırla — ağ takılırsa arayüz "Eşitleniyor…"da asılı kalmasın.
 *  Söz iptal edilmez: Firestore yazmayı kuyrukta tutar, bağlantı gelince gönderir. */
function sureli(soz, ms){
  let z;
  const saat = new Promise((_, red) => { z = setTimeout(() => red(new Error('timeout')), ms); });
  return Promise.race([soz, saat]).finally(() => clearTimeout(z));
}
const AGZAMAN = 12000;
// uid → hesabın yazdığı profil adı. Giriş yapan hesabın hangi profile bağlandığını
// bu tarayıcıda hatırlar; girişten sonra ad elle değişirse bağ yeni ada taşınır.
const ACCT = 'atpl.acct:';

const Cloud = {
  acik: !!(FBCONF && FBCONF.apiKey),
  sdk: null, user: null, durum: '', mesgul: false,
  sonEs: 0, sonCek: 0, kirli: false, pT: null, girisSonrasi: false,

  async yukle(){
    if (this.sdk) return this.sdk;
    const [a, b, c] = await Promise.all([
      import(FB_SDK + 'firebase-app.js'),
      import(FB_SDK + 'firebase-auth.js'),
      import(FB_SDK + 'firebase-firestore.js'),
    ]);
    const app = a.initializeApp(FBCONF);
    // Bazı ağlarda/vekil sunucularda WebChannel akışı kuruluyor ama hiç yanıt
    // dönmüyor; setDoc sözü sonsuza kadar bekliyor. Otomatik uzun yoklama bunu
    // algılayıp XHR'a düşüyor.
    let db;
    try{ db = c.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); }
    catch(e){ db = c.getFirestore(app); }
    this.sdk = { a, b, c, app, auth: b.getAuth(app), db };
    return this.sdk;
  },

  async init(){
    if (!this.acik) return;
    try{
      const s = await this.yukle();
      s.b.onAuthStateChanged(s.auth, u => {
        this.user = u || null;
        this.durum = '';
        if (!u){ paintWho(); paintCloud(); return; }
        // Giriş yapıldı: ad Google'daki ad soyad, resim Google profil resmi olur
        // ve bundan sonraki her kayıt bu profile — yani bu hesaba — yazılır.
        this.girisSonrasi = true;   // bu eşitlemeden sonra kapsam gözden geçirilir
        const panel = !!el('pname');
        if (bindAccount(u)){
          paintWho();
          if (!R) home();
          if (panel && el('sheet').classList.contains('on')) openStats();
        }
        paintCloud();
        this.esitle(true);
      });
      s.b.getRedirectResult(s.auth).catch(() => {});
    }catch(e){
      // Artifact kum havuzu dış kaynakları engeller — sessizce kapalı kalır
      this.acik = false;
      paintCloud();
    }
  },

  /** Hata kodunu ne yapılacağını söyleyen bir cümleye çevirir. */
  anlat(k){
    if (k === 'auth/operation-not-allowed')
      return 'Google girişi Firebase konsolunda açık değil. ' +
             'Authentication → Sign-in method → Google → Enable.';
    if (k === 'auth/unauthorized-domain')
      return 'Bu adres Firebase\'de izinli değil. ' +
             'Authentication → Settings → Authorized domains listesine ekle.';
    if (k === 'auth/popup-blocked')
      return 'Açılır pencere engellendi — düğmeye yeniden dokun ya da ' +
             'tarayıcıda bu siteye izin ver.';
    if (k === 'auth/network-request-failed') return 'Ağ hatası — bağlantını kontrol et.';
    return 'Giriş yapılamadı: ' + (k || 'bilinmeyen hata');
  },

  async girisYap(){
    try{
      const s = await this.yukle();
      await s.b.signInWithPopup(s.auth, new s.b.GoogleAuthProvider());
      this.durum = '';
    }catch(e){
      const k = (e && e.code) || '';
      if (k === 'auth/popup-closed-by-user' || k === 'auth/cancelled-popup-request'){
        this.durum = '';                    // kullanıcı vazgeçti, hata değil
        paintCloud(); return;
      }
      if (k === 'auth/operation-not-supported-in-this-environment'){
        try{
          const s = await this.yukle();
          await s.b.signInWithRedirect(s.auth, new s.b.GoogleAuthProvider());
          return;                            // sayfa yönlenir
        }catch(e2){}
      }
      this.durum = this.anlat(k || (e && e.message));
      paintCloud();
    }
  },

  async cikisYap(){
    try{
      if (this.kirli){ try{ await this.gonder(); }catch(e){} }
      const s = await this.yukle();
      await s.b.signOut(s.auth);
      this.sonEs = 0; this.kirli = false;
      setPic(ME, '');                    // resim hesaba ait, ad ve veri yerelde kalır
      paintWho(); if (!R) home();
    }catch(e){ this.durum = 'Çıkış yapılamadı.'; paintCloud(); }
  },

  ref(s, ad){
    return s.c.doc(s.db, 'users', this.user.uid, 'profiles', encodeURIComponent(ad));
  },
  /** Profil adı ve verisi dışarıdan verilebilir — profil değiştirirken
   *  eskisini, ad değiştirirken yenisini yollamak için gerekiyor. */
  async gonder(ad, veri){
    if (!this.user) return;
    const isim = ad || ME;
    const s = await this.yukle();
    const soz = s.c.setDoc(this.ref(s, isim),
      { name: isim, data: veri || JSON.stringify(S), updated: Date.now(), v: 2 });
    // Zaman aşımına uğrasak bile yazma kuyrukta; sunucu onaylayınca durumu düzelt
    soz.then(() => {
      this.sonEs = Date.now(); this.kirli = false;
      if (/sıraya alındı/.test(this.durum)) this.durum = '';
      paintCloud();
    }, () => {});
    await sureli(soz, AGZAMAN);
    this.sonEs = Date.now();
    this.kirli = false;
  },
  async sil(ad){
    if (!this.user) return;
    const s = await this.yukle();
    await s.c.deleteDoc(this.ref(s, ad));
  },
  async cek(){
    if (!this.user) return 0;
    const s = await this.yukle();
    const snap = await sureli(
      s.c.getDocs(s.c.collection(s.db, 'users', this.user.uid, 'profiles')), AGZAMAN);
    const once = JSON.stringify(S);
    snap.forEach(d => {
      const v = d.data();
      if (v && typeof v.data === 'string' && v.name) mergeProfile(v.name, v.data);
    });
    this.sonCek = Date.now();
    return once !== JSON.stringify(S);   // ekranı tazelemek gerekiyor mu
  },

  /** Çek + kaynaştır + gönder. Çakışma yok: iki taraf birleşir. */
  async esitle(sessiz){
    if (!this.user || this.mesgul) return;
    this.mesgul = true; this.durum = ''; paintCloud();
    let degisti = false;
    try{
      degisti = await this.cek();
      flushLocal();
      await this.gonder();
    }catch(e){
      const k = (e && e.code) || (e && e.message) || 'bilinmeyen hata';
      this.durum = k === 'timeout'
        ? 'Bağlantı yavaş — değişiklikler sıraya alındı, kendiliğinden gönderilecek.'
        : /permission/i.test(k)
        ? 'Yetki reddedildi — güvenlik kuralları yayımlandı mı?'
        : 'Eşitlenemedi: ' + k;
    }
    this.mesgul = false;
    paintCloud();
    // Arka plan eşitlemesi ekranı boşuna sıçratmasın: yalnız buluttan gerçekten
    // yeni bir şey geldiyse tazele
    if (degisti){
      // Girişten sonra gelen ilerleme seçili modülü bitirmiş olabilir
      if (this.girisSonrasi){ this.girisSonrasi = false; reselectAfterSync(); }
      if (R) adoptRun(); else { paintWho(); home(); }
      refreshSheet();      // açık Durum paneli eski sayıları göstermeye devam etmesin
    }
  },

  /** Kaydın ardından buluta gönderimi geciktirir; yazma sayısını düşük tutar. */
  schedule(){
    if (!this.user) return;
    this.kirli = true;
    clearTimeout(this.pT);
    this.pT = setTimeout(() => this.gonderGuvenli(), 4000);
  },
  async gonderGuvenli(){
    if (!this.user) return;
    // Eşitleme sürerken gönderme; bekleyeni düşürmeyip biraz sonra dene
    if (this.mesgul){
      clearTimeout(this.pT);
      this.pT = setTimeout(() => this.gonderGuvenli(), 2000);
      return;
    }
    try{ await this.gonder(); this.durum = ''; }
    catch(e){ this.durum = 'Gönderilemedi — bağlantı gelince tekrar denenecek.'; }
    paintCloud();
  },
  /** Sekme kapanırken/gizlenirken bekleyeni hemen yolla; 4 sn'lik pencerede
   *  verilen son cevaplar kaybolmasın. */
  simdiGonder(){
    if (!this.user || !this.kirli) return;
    clearTimeout(this.pT);
    this.gonder().catch(() => {});
  },
  /** Sekmeye dönüldüğünde başka cihazdaki ilerlemeyi al. Tur ortasında
   *  karıştırmamak için sadece ana ekrandayken çalışır. */
  async donusteCek(){
    if (!this.user || this.mesgul || R) return;
    if (Date.now() - this.sonCek < 30000) return;
    await this.esitle(true);
  },
};

/** Bekleyen kaydı hemen diske yaz — sekme kapanırken son cevap kaybolmasın. */
function flushLocal(){
  clearTimeout(saveT);
  ls.set(keyOf(ME), JSON.stringify(S));
}
function flush(){ flushLocal(); Cloud.schedule(); }

// ── Etkin süre ──────────────────────────────────────────────────────
// Sayaçlar saniye saniye birikir ve HİÇ GERİ GİTMEZ. Bir an çalışma sayılır
// eğer sayfa görünür, bilgisayar uyanık ve son dokunuştan (tuş, fare, kaydırma)
// bu yana BOS_MS geçmemişse. BOS_MS dolunca sayaçlar durur; ekran açık kaldıkça
// sonrası "boşta" sayılır ve dokunduğun an kaldığı yerden sürer. İlk BOS_MS
// çalışma sayılır: hareketsizlik kâğıtta hesap da olabilir, kalkıp gitmek de,
// ayırt edilemez — geriye dönük silmek ise ekrandaki sayıyı geri düşürüyordu.
//
// Toplam süre cihaz başına ayrı sayaçta durur: S.sure[cihaz] = {t, g:{gün: ms}},
// boşta S.bos[cihaz] aynı biçimde. Her cihaz yalnız kendi sayacını artırır,
// eşitleme cihaz bazında en büyüğü alır, toplam hepsinin toplamıdır.
const BOS_MS = 3 * 60e3;
// Görünürken iki tık arası bunu aşarsa bilgisayar uyudu ya da sayfa dondu;
// o ara hiçbir yere yazılmaz.
const UYKU_MS = 5000;
const CIHAZ = (() => {
  let id = ls.get('atpl.cihaz');
  if (!id){ id = Math.random().toString(36).slice(2, 10); ls.set('atpl.cihaz', id); }
  return id;
})();
let sonEtkin = document.visibilityState === 'visible' ? Date.now() : null;
let sonTik = Date.now();
let sureDegisti = false;

/** S.sure ya da S.bos içinde bu cihazın sayacını artırır (gün kaydıyla). */
function sayacEkle(ad, d){
  if (!S[ad] || typeof S[ad] !== 'object') S[ad] = {};
  const k = S[ad][CIHAZ] || (S[ad][CIHAZ] = { t:0, g:{} });
  if (!k.g || typeof k.g !== 'object') k.g = {};
  const g = today();
  if (!(g in k.g)){                         // yeni gün: 120 günden eskisini at
    const sin = new Date(Date.now() - 120 * DAY).toISOString().slice(0, 10);
    Object.keys(k.g).forEach(x => { if (x < sin) delete k.g[x]; });
  }
  k.t = (k.t || 0) + d;
  k.g[g] = (k.g[g] || 0) + d;
  sureDegisti = true;
}
/** Çalışma: site toplamı, tur ve ekrandaki cevaplanmamış soru. Elle
 *  durdurulmuş turda tura ve soruya yazılmaz (site toplamı sürer). */
function sureEkle(d){
  sayacEkle('sure', d);
  if (R && !R.durdu){
    R.sure = (R.sure || 0) + d;
    if (R.qAcik != null) R.qAcc[R.qAcik] = (R.qAcc[R.qAcik] || 0) + d;
  }
}
/** Elle durdurulmuş turda boşta süresi tura yazılmaz: bilerek ara verdin. */
function bosEkle(d){
  sayacEkle('bos', d);
  if (R && !R.durdu) R.bos = (R.bos || 0) + d;
}
/** Son tıktan `an`'a kadar geçen süreyi dağıtır: son dokunuştan sonraki ilk
 *  BOS_MS çalışma, ötesi boşta. Her saniye ve her dokunuşta — tıklama durumu
 *  değiştirmeden ÖNCE — çağrılır; süre hep o anki duruma (tur, soru) yazılır. */
function akit(an){
  const bas = sonTik;
  sonTik = an;
  if (sonEtkin === null || document.visibilityState !== 'visible') return;
  if (an - bas > UYKU_MS) return;                 // uyku ya da donma
  const s0 = Math.max(bas, sonEtkin);
  if (an <= s0) return;
  const aktif = Math.max(0, Math.min(an, sonEtkin + BOS_MS) - s0);
  if (aktif) sureEkle(aktif);
  if (an - s0 - aktif > 0) bosEkle(an - s0 - aktif);
}
/** Şu an boşta mı: son dokunuştan beri BOS_MS geçti, sayaçlar durdu. */
const bostaMi = () => sonEtkin !== null && Date.now() - sonEtkin > BOS_MS;
/** Kullanıcı bir şey yaptı. Yakalama evresinde çalışır ki süre, tıklamanın
 *  değiştireceği durumdan önce yazılsın. Fare ve kaydırma seli saniyede bir. */
function etkinlik(e){
  if (document.visibilityState !== 'visible') return;
  const an = Date.now();
  const sel = e.type === 'pointermove' || e.type === 'scroll' ||
              e.type === 'wheel' || e.type === 'touchmove';
  if (sel && sonEtkin !== null && an - sonEtkin < 1000) return;
  akit(an);
  sonEtkin = an;
}
['pointerdown', 'keydown', 'pointermove', 'wheel', 'scroll', 'touchmove', 'focus']
  .forEach(t => addEventListener(t, etkinlik, { capture:true, passive:true }));

/** Açık turun süresini kaydına geçirir. tN'ye dokunmaz: birleştirmede turun
 *  ne kadar ilerlediği ölçülürken yalnız süre değişikliği sayılmasın. */
function sureYaz(){
  sureDegisti = false;
  const rec = runRec();
  if (!rec) return;
  rec.sure = Math.round(R.sure || 0);
  rec.bos = Math.round(R.bos || 0);

  // Ekrandaki cevaplanmamış sorunun birikimi: sayfa yenilenince sıfırlanmasın
  if (R.qAcik != null) rec.qAn = [R.qAcik, Math.round(R.qAcc[R.qAcik] || 0)];
  else delete rec.qAn;
  if (R.durdu) rec.durdu = true; else delete rec.durdu;
}
/** Sayfa gizlenirken ya da kapanırken: o ana kadarki süreyi yaz, sayımı durdur. */
function sureBirak(){

}

/** Profili yeniden adlandırır. `bekle` verilirse yeni ada buluta yazma
 *  atlanır — girişte kullanılır: hesabın belgesinde başka cihazın verisi
 *  olabilir, doğrudan yazmak onu ezerdi; ardından gelen esitle() önce çekip

/** Google hesabından profil adı: "Ad Soyad", yoksa e-postanın kullanıcı adı. */

             String(u.email || '').split('@')[0].trim() || 'Hesap';

}

/** Girişten sonra aktif profili hesaba bağlar: profil adı Google'daki ad soyad
 *  olur, avatar Google profil resmi olur, ilerleme/ayar/tur hepsi bu profile
 *  yazılır ve bulutta aynı ad altında durur.

 *  geçilir, misafir profili yerinde bırakılır.
 *
 *  Ekranın tazelenmesi gerekiyorsa true döner. */
function bindAccount(u){
  flushLocal();                       // ad değişiminde verinin son hâli taşınsın
  const anahtar = ACCT + u.uid;
  let hedef = ls.get(anahtar);
  if (!hedef || !PROFILES.includes(hedef)) hedef = accountName(u);

  return degisti;
}

// count:0 = sınır yok, kapsamdaki tüm sorular

// hideFig kaldırıldı: şekil gerektiren soruların hepsi çizildi, hiçbiri gizlenmiyor
const DEFAULTS = { deck:'new', pick:{}, q:'', hideDup:true, gen:true,
                   hideFlag:false, count:0, mode:'study', order:'smart',
                   sound:true, ai:'chatgpt', lang:'en' };
const F = Object.assign({}, DEFAULTS);

// ── Soru dili ────────────────────────────────────────────────────────
// Her sorunun iki dilde de karşılığı var: q[3]/q[4] kaynak metin, q[10]/q[11]
// Türkçesi, q[12]/q[13] İngilizcesi. Kaynak dilin alanı boş bırakılır — o dilde
// zaten q[3]/q[4] okunur. Seçilen dil ne olursa olsun bütün sorular o dilde
// gelir; kip içinde dil karışmaz.
//
// İlerleme soru **id'sine** bağlıdır: dili değiştirmek çözülmüşleri sıfırlamaz
// ve aynı soruyu iki dilde iki kez sormaz. Bir kez çözdüysen çözülmüştür.
// Tur ortasında dil değişirse kalan sorular yeni dilde gelir — şık dizilerinin
// uzunluğu iki dilde aynı olduğu için verilen cevaplar da yerinde kalır.
const trMode = () => F.lang === 'tr';
const qText = q => (trMode() ? q[10] : q[12]) || q[3];
const qOpts = q => (trMode() ? q[11] : q[13]) || q[4];
const subjName = s => (trMode() ? s.nt : s.ne) || s.n;
const secName = sc => (trMode() ? sc[2] : sc[3]) || sc[1];
// Seçili dilde gelen soru sayısı — derleme sayıyor, burada hesaplanmıyor
const TRN = DB.tr || 0, ENN = DB.en || 0;
const langN = () => trMode() ? TRN : ENN;
function savePref(){ S.pref = F; S.prefAt = Date.now(); save(); }

const card = id => S.c[id];
const stars = () => new Set(S.star);

function grade(id, ok){
  const k = S.c[id] || [0,0,0,0,0];
  k[2]++;
  if (ok){ k[4]++; k[0] = Math.min(k[0] + 1, BOX_MS.length - 1); }
  else { k[3]++; k[4] = 0; k[0] = 0; }
  k[1] = Date.now() + BOX_MS[k[0]];
  S.c[id] = k;
  const d = S.day[today()] || [0,0];
  d[0]++; if (ok) d[1]++;
  S.day[today()] = d;
  save();
}

// Konu seçimi:  F.pick = { "050": [] }  boş dizi = dersin tamamı
function pickedAny(){ return Object.keys(F.pick).length > 0; }
// ── Geçilen sınavlar ────────────────────────────────────────────────
// Geçtiğin dersin soruları kapsamdan tümüyle çıkar: toplam sayıda, konu
// seçicide, destelerde ve turlarda görünmez. Kayıt profile bağlıdır.
function isPassed(code){ return (S.passed || []).indexOf(code) >= 0; }
const notPassed = q => !isPassed(SUBJ[q[1]].c);
let passDirty = false;

function togglePassed(code){
  S.passed = S.passed || [];
  const i = S.passed.indexOf(code);
  if (i < 0) S.passed.push(code); else S.passed.splice(i, 1);
  S.pAt = Date.now();                      // eşitlemede son karar kazansın
  // Geçilen ders seçili kapsamdaysa düşür; kapsam boş kalırsa yeni modül seç
  if (i < 0 && F.pick[code]) delete F.pick[code];
  if (!Object.keys(F.pick).length) autoPickModule();
  savePref();
  passDirty = true;
  save();
}
/** Tur kaydının ait olduğu modül kodu (eski kayıtlarda başlıktan okunur). */
function runCode(r){
  if (r.code !== undefined) return r.code;
  const m = /^(\S+) · /.exec(r.title || '');
  return m ? m[1] : '';
}

function matchPick(q){
  if (!pickedAny()) return true;
  const s = SUBJ[q[1]];
  const sel = F.pick[s.c];
  if (!sel) return false;
  return sel.length === 0 || sel.includes(s.sec[q[2]][0]);
}
function inScope(q){
  if (!notPassed(q)) return false;
  if (F.hideDup && q[6]) return false;
  if (!F.gen && q[7]) return false;
  if (F.hideFlag && q[5]) return false;
  if (!matchPick(q)) return false;
  if (F.q){
    const n = F.q.toLocaleLowerCase('tr');
    // Hangi kipte olursan ol iki dilde de ara: Türkçe kipteyken İngilizce
    // terimle, İngilizce kipteyken Türkçe kelimeyle arayabilesin
    const hep = q[0] + ' ' + q[3] + ' ' + q[4].join(' ') +
      (q[10] ? ' ' + q[10] + ' ' + q[11].join(' ') : '') +
      (q[12] ? ' ' + q[12] + ' ' + q[13].join(' ') : '');
    if (!hep.toLocaleLowerCase('tr').includes(n)) return false;
  }
  return true;
}
// Konu ağacındaki sayılar seçimden bağımsız, diğer anahtarlara bağlıdır
function inToggles(q, withPassed){
  if (!withPassed && !notPassed(q)) return false;
  return !(F.hideDup && q[6]) && (F.gen || !q[7]) && !(F.hideFlag && q[5]);
}

const DECKS = [
  { k:'due',   cls:'due',   t:'Tekrar zamanı', d:'Vadesi gelenler' },
  { k:'wrong', cls:'wrong', t:'Yanlışlarım',   d:'Henüz oturmayanlar' },
  { k:'new',   cls:'new',   t:'Hiç görmedim',  d:'İlk kez çıkacak' },
  { k:'star',  cls:'star',  t:'Yıldızlılar',   d:'Sonra bakılacaklar' },
];
function inDeck(q, deck){
  const k = card(q[0]), now = Date.now();
  switch (deck){
    case 'due':   return !!k && k[1] <= now;
    case 'wrong': return !!k && k[3] > 0 && k[4] < MASTER;
    case 'new':   return !k;
    case 'star':  return stars().has(q[0]);
    case 'leech': return !!k && k[3] >= LEECH;
    case 'slow':  { const t = S.qt && S.qt[q[0]]; return !!t && t[2] >= YAVAS_MS; }
    default:      return true;
  }
}
const scoped = () => QS.filter(inScope);
const deckCount = d => scoped().filter(q => inDeck(q, d)).length;

/** Profilin tümüne ait durum — modül seçiminden bağımsız. */
function globalStat(){
  const all = QS.filter(q => inToggles(q));
  let seen = 0, ans = 0, ok = 0;
  all.forEach(q => {
    const k = S.c[q[0]];
    if (k){ seen++; ans += k[2]; ok += k[2] - k[3]; }
  });
  const now = Date.now();
  let due = 0, wrong = 0;
  all.forEach(q => {
    const k = S.c[q[0]];
    if (!k) return;
    if (k[1] <= now) due++;
    if (k[3] > 0 && k[4] < MASTER) wrong++;
  });
  // gün serisi
  let streak = 0;
  for (let i = 0; i < 400; i++){
    const d = new Date(now - i*DAY).toISOString().slice(0,10);
    if ((S.day[d] || [0,0])[0]) streak++;
    else if (i > 0) break;
  }
  return { total: all.length, seen, ans, ok, due, wrong, streak,
           pct: ans ? Math.round(ok / ans * 100) : null };
}

/** Bir modülün (dersin) durumu: toplam, görülen, kalan. */
function moduleStat(code, raw){
  const si = SUBJ.findIndex(x => x.c === code);
  const all = QS.filter(q => q[1] === si && inToggles(q, raw));
  const seen = all.filter(q => card(q[0])).length;
  return { code, name: subjName(SUBJ[si]), total: all.length, seen, left: all.length - seen };
}
/** Seçim tek bir modülün tamamıysa o modülün kodunu, değilse null döner. */
function soloModule(){
  const ks = Object.keys(F.pick);
  return (ks.length === 1 && F.pick[ks[0]].length === 0) ? ks[0] : null;
}
/** Henüz bitmemiş modüller — sırayla ya da rastgele seçmek için. */
function openModules(){
  return SUBJ.map(s => moduleStat(s.c)).filter(m => m.total && m.left > 0);
}
/** Girişten sonra bulut ilerlemesi gelince kapsamı tazeler.
 *
 *  Kullanıcı giriş yaptığında başka cihazda çözdükleri iner; seçili modül o
 *  anda bitmiş olabilir. Bitmişse en son çalışılan (turu olan) ve hâlâ soru
 *  kalan modüle geçer, o da yoksa açık bir modül seçer. Elle kurulmuş çoklu
 *  kapsama ve içinde iş kalan modüle dokunmaz — seçim kullanıcınındır. */
function reselectAfterSync(){
  const solo = soloModule();
  if (!solo) return false;                       // çoklu/boş kapsam: karışma
  if (moduleStat(solo).left > 0) return false;   // modülde iş var: karışma
  const son = (S.runs || []).find(r => r.code && moduleStat(r.code).left > 0);
  if (son){
    F.pick = {}; F.pick[son.code] = [];
    savePref();
    return true;
  }
  return autoPickModule();
}
/** İlk ziyarette ya da modül bitince yeni bir modül seçer. */
function autoPickModule(){
  const open = openModules();
  if (!open.length) return false;
  const m = open[Math.floor(Math.random() * open.length)];
  F.pick = {}; F.pick[m.code] = [];
  savePref();
  return true;
}

function buildQueue(){
  let pool = scoped().filter(q => inDeck(q, F.deck));
  if (F.deck === 'slow' && F.order === 'smart'){
    // Uzun sürenler en yavaştan başlar: amaç önce en çok zaman yiyeni kısaltmak
    pool.sort((a, b) => S.qt[b[0]][2] - S.qt[a[0]][2]);
  } else if (F.order === 'smart'){
    pool = pool.map(q => {
      const k = card(q[0]);
      return { q, key: k ? -(Date.now() - k[1]) : 1e15 + Math.random() };
    }).sort((a,b) => a.key - b.key).map(x => x.q);
  } else shuffle(pool);
  return F.count ? pool.slice(0, F.count) : pool;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const optOrder = q => shuffle(q[4].map((_, i) => i));

// ── Geri bildirim: kısa ses + kartta tek atımlık renk ──
// Ses dosyası yok; iki-üç osilatör notası WebAudio ile üretilir. Bağlam ilk
// dokunuşta açılır, tarayıcı otomatik oynatma kuralına takılmaz.
let actx = null;
const REDUCED = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function beep(kind){
  if (!F.sound) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const notes = kind === 'ok'  ? [[660, 0, .10], [988, .085, .13]]
                : kind === 'bad' ? [[190, 0, .16], [142, .10, .18]]
                :                  [[520, 0, .07]];
    notes.forEach(([f, d, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'square' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(kind === 'bad' ? .05 : .10, t0 + d + .012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + len);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + len + .02);
    });
  }catch(e){}
}
/** Sınav modunda doğru/yanlış sızmasın diye ses ve renk nötr kalır. */
function feedback(ok){
  const notr = F.mode === 'exam';
  const card = el('view').querySelector('.card');
  if (card && !REDUCED){
    const c = notr ? 'fnew' : ok ? 'fok' : 'fbad';
    card.classList.add(c);
    setTimeout(() => { if (card) card.classList.remove(c); }, 620);
  }
  beep(notr ? 'tap' : ok ? 'ok' : 'bad');
}

// ── Oturum ──
let R = null, advT = null;
let navOpen = false;                      // gezinme paneli açık mı

const RUN_MAX = 24;                       // geçmişte tutulan tur sayısı

/** Ana ekrandaki kapsam adı — geçmiş satırında ne çalışıldığı yazsın. */
function scopeTitle(){
  const solo = soloModule();
  if (solo){
    const s = SUBJ.find(x => x.c === solo);
    return solo + ' · ' + (s ? subjName(s) : '');
  }
  const ks = Object.keys(F.pick);
  if (!ks.length) return 'Tüm modüller';
  if (ks.length === 1){
    const s = SUBJ.find(x => x.c === ks[0]);
    return ks[0] + ' · ' + (s ? subjName(s) : '');
  }
  return ks.length + ' modül';
}
function openRun(){
  const acik = S.runs.filter(r => !r.done && !isPassed(runCode(r)));
  // Cevap verilmiş tur öncelikli: yeni açılıp hiç dokunulmamış bir tur
  // ana ekranda gerçek yarım turun önüne geçmesin.
  return acik.find(r => (r.log || []).length) || acik[0] || null;
}
/** Hiç cevap verilmeden bırakılan turu kayıttan düşürür. */
function dropEmptyRun(){
  const rec = runRec();
  if (!rec || rec.done || (rec.log || []).length) return;
  S.runs = S.runs.filter(r => r.id !== rec.id);
  save();
}
function runRec(){ return R ? S.runs.find(r => r.id === R.id) : null; }

/** Tur durumunu kayda geçir — sayfa kapansa da kaldığı yerden açılsın. */
function saveRun(){
  const rec = runRec();
  if (!rec) return;
  rec.ids = R.list.map(q => q[0]);
  rec.i = R.i; rec.round = R.round;
  rec.missed = R.missed.slice();
  rec.log = R.log.slice();
  rec.tN = Date.now();
  sureYaz();
  save();
}
function start(){
  const list = buildQueue();
  if (!list.length) return;
  yeniTur = false;
  S.runs = S.runs.filter(r => r.done || (r.log || []).length);   // boş bırakılanları at
  const id = 'r' + Date.now();
  R = { id, list, i:0, order:null, picked:null, orders:[], picks:[],
        log:[], t0:Date.now(), round:1, missed:[], sure:0, durdu:false, sureTam:true,
        bos:0, bosTam:true, qTop:0, qN:0, qAcc:{}, qAcik:null, qSon:{} };
  S.runs.unshift({ id, t0:R.t0, tN:R.t0, title:scopeTitle(), code:soloModule() || '',
                   deck:deckName(),
                   n0:list.length, ids:list.map(q => q[0]), i:0, round:1,
                   missed:[], log:[], done:false, sure:0, sureTam:true, bos:0, bosTam:true,
                   qTop:0, qN:0 });
  if (S.runs.length > RUN_MAX) S.runs.length = RUN_MAX;
  save();
  step0();
}
/** Yarım kalan turu geri yükler; sorular silinmişse turu kapatır. */
function resumeRun(id){
  yeniTur = false;
  const rec = S.runs.find(r => r.id === id);
  if (!rec || rec.done) return home();
  const list = (rec.ids || []).map(x => BY_ID.get(x)).filter(Boolean);
  if (!list.length){ rec.done = true; save(); return home(); }
  R = { id:rec.id, list, i:Math.min(rec.i || 0, list.length), order:null, picked:null,
        orders:[], picks:[], log:(rec.log || []).slice(), t0:rec.t0,
        round:rec.round || 1, missed:(rec.missed || []).slice(),
        sure:rec.sure || 0, durdu:!!rec.durdu, sureTam:!!rec.sureTam,
        bos:rec.bos || 0, bosTam:!!rec.bosTam, qTop:rec.qTop || 0, qN:rec.qN || 0,
        qAcc:{}, qAcik:null, qSon:{} };
  if (Array.isArray(rec.qAn)) R.qAcc[rec.qAn[0]] = rec.qAn[1] || 0;
  // Bu turda verilmiş cevapları geri kur: kayıtta kaynak şık indeksi var,
  // yeni karıştırmada karşılığı bulunur. Böylece geri gidince cevap görünür
  // ve yeniden puanlanmaz.
  const gecmis = R.log.filter(x => x.round === R.round);
  R.list.forEach((q, i) => {
    const e = gecmis.find(x => x.id === q[0]);
    if (e) R.picks[i] = orderFor(i).indexOf(e.pick);
  });
  step0();
}
/** Sorunun şık sırası — bir kez üretilir, geri gidip gelince değişmez. */
function orderFor(i){
  if (!R.orders[i]) R.orders[i] = optOrder(R.list[i]);
  return R.orders[i];
}
function step0(){
  clearTimeout(advT);
  if (!R) return;
  if (R.i >= R.list.length){
    // Tur bitti — bu turda yanlış yapılanlar varsa onlarla devam et
    if (R.missed.length){
      // missed soru id'si tutar, list soru nesnesi bekler
      R.list = shuffle(R.missed.map(id => BY_ID.get(id)).filter(Boolean));
      R.missed = []; R.i = 0; R.round++;
      R.orders = []; R.picks = [];        // yeni tur: sıra ve cevaplar sıfırlanır
      if (!R.list.length) return done();
    } else return done();
  }
  if (R.i < 0) R.i = 0;
  R.order = orderFor(R.i);
  R.picked = R.picks[R.i] === undefined ? null : R.picks[R.i];
  saveRun();
  draw();
  window.scrollTo({ top:0, behavior:'smooth' });
}
/**
 * Eşitleme sonrası, içinde olduğun tur başka cihazda ilerlemişse oraya geç.
 * Açılışta yerel (eski) tur hemen sürdürülüyor; bulut yanıtı sonra geliyor.
 * O yanıt daha ileriyse kaldığın soru oradan devam etsin.
 */
function adoptRun(){
  if (!R) return false;
  const rec = S.runs.find(r => r.id === R.id);
  if (!rec) return false;
  if (rec.done){ home(); return true; }          // başka cihazda bitirilmiş
  if ((rec.log || []).length > R.log.length || (rec.i || 0) > R.i){
    resumeRun(R.id);
    return true;
  }
  return false;
}

/** Tur içinde belirli bir soruya git (0 tabanlı, sınırlara kırpılır). */
function goTo(i){
  if (!R) return;
  clearTimeout(advT);
  R.i = Math.max(0, Math.min(i, R.list.length - 1));
  step0();
}
function prevQ(){ if (R && R.i > 0) goTo(R.i - 1); }
/** Sağ ok: son soruda turu kazara bitirmesin, cevap verilmişse bitirir. */
function nextQ(){
  if (!R) return;
  if (R.i < R.list.length - 1) goTo(R.i + 1);
  else if (R.picked !== null) next();
}
function pick(pos){
  if (!R || R.picked !== null) return;
  const q = R.list[R.i], ok = R.order[pos] === 0;
  soruKapat(); soruSureYaz(q[0]);              // grade() kaydı diske yazmadan önce
  R.picked = pos; R.picks[R.i] = pos;
  grade(q[0], ok);
  R.log.push({ id:q[0], ok, pick:R.order[pos], round:R.round });
  if (!ok && !R.missed.includes(q[0])) R.missed.push(q[0]);
  saveRun();
  draw();
  feedback(ok);
  clearTimeout(advT);
  if (F.mode === 'exam') advT = setTimeout(next, 150);
  else if (ok) advT = setTimeout(next, 580);
}
function next(){ clearTimeout(advT); if (R){ R.i++; step0(); } }

/**
 * Modül kutusu: tıklanınca altındaki konu seçici açılır.
 * Ayrı bir "Konular" bölümü yok — kapsam hep bu kutudan seçilir.

function paintPicker(){

const AYLAR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function stamp(ms){
  const d = new Date(ms), p2 = x => String(x).padStart(2, '0');
  return d.getDate() + ' ' + AYLAR[d.getMonth()] + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
/** Turda kaç ayrı soru görüldü — ilerleme bunun üzerinden yazılır. */
function runSeen(r){ return new Set((r.log || []).map(x => x.id)).size; }
/** Turun ilk denemedeki isabeti. */
function runPct(r){
  const first = (r.log || []).filter(x => x.round === 1);
  if (!first.length) return null;
  return Math.round(first.filter(x => x.ok).length / first.length * 100);
}
/** Geçmiş listesinde bir tur satırı. */
function hisRow(r){
  const pct = runPct(r);
  const dot = !r.done ? 'live' : pct === null ? '' : pct >= 75 ? 'ok' : pct >= 50 ? 'mid' : 'bad';
  const alt = (r.done
    ? stamp(r.t0) + ' · ' + runSeen(r) + ' soru'
    : stamp(r.t0) + ' · ' + runSeen(r) + ' / ' + (r.n0 || 0) + ' soru') +
    (r.sureTam && r.sure >= 6e4 ? ' · ' + sureMetni(r.sure) : '');
  return '<button class="hisrow" data-run="' + r.id + '" type="button">' +
    '<span class="hdot ' + dot + '"></span>' +
    '<span class="hi"><b>' + esc(r.title || 'Tur') + '</b><i>' + alt + '</i></span>' +
    '<span class="hpct' + (r.done ? '' : ' go2x') + '">' +
      (r.done ? (pct === null ? '—' : '%' + pct) : 'Devam et') + '</span></button>';
}

/** İlerleme halkası — modül ne kadar tamamlandı. */
function ringSvg(pct, done){
  const r = 25, c = 2 * Math.PI * r;
  return '<svg class="ring' + (done ? ' done' : '') + '" viewBox="0 0 60 60" ' +
    'width="60" height="60" aria-hidden="true">' +
    '<circle class="rbg" cx="30" cy="30" r="' + r + '"/>' +
    '<circle class="rfg" cx="30" cy="30" r="' + r + '" style="stroke-dasharray:' + c +
      ';stroke-dashoffset:' + (c * (1 - pct / 100)) + '"/>' +
    '<text class="rtx" x="30" y="30">%' + pct + '</text></svg>';
}

let expanded = {}, pickOpen = false;

// "Yeni tur" diyip kapsamı seçer, bayrak o zaman kalkar.
let yeniTur = false;
function buildTree(){
  const t = el('tree');
  if (!t) return;                 // hepsi geçildiyse seçici çizilmez
  t.innerHTML = SUBJ.map((s, si) => {
    const qs = QS.filter(q => q[1] === si && inToggles(q));
    if (!qs.length) return '';
    const sel = F.pick[s.c];
    const state = !sel ? '' : (sel.length === 0 ? 'all' : 'some');
    const secs = s.sec.map((sc, i) => {
      const n = qs.filter(q => q[2] === i).length;
      if (!n) return '';
      const on = sel && (sel.length === 0 || sel.includes(sc[0]));
      return '<div class="row"><button class="tick ' + (on ? 'all' : '') + '" data-s="' + s.c +
        '" data-c="' + sc[0] + '" type="button">' + (on ? '◼' : '◻') + '</button>' +
        '<button class="nm" data-solo="' + s.c + '" data-c="' + sc[0] + '" type="button" title="' +
        esc(secName(sc)) + '">' + esc(secName(sc)) + '<b>' + n + '</b></button></div>';
    }).join('');
    return '<div class="node' + (state ? ' sel' : '') + '"><div class="row">' +
      '<button class="tick ' + state + '" data-s="' + s.c + '" type="button">' +
        (state === 'all' ? '◼' : state === 'some' ? '◧' : '◻') + '</button>' +
      '<button class="nm" data-solo="' + s.c + '" type="button">' + s.c + ' · ' + esc(subjName(s)) +
        '<b>' + qs.length + '</b></button>' +
      '<button class="exp' + (expanded[s.c] ? ' open' : '') + '" data-x="' + s.c +
        '" type="button" aria-label="Bölümler">›</button></div>' +
      '<div class="kids' + (expanded[s.c] ? '' : ' hidden') + '">' + secs + '</div></div>';
  }).join('');

  t.querySelectorAll('.exp').forEach(b => b.onclick = () => {
    expanded[b.dataset.x] = !expanded[b.dataset.x];
    buildTree();
  });
  t.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = b.dataset.s, c = b.dataset.c;
    if (c) toggleSection(s, c); else toggleSubject(s);
    savePref(); pickOpen = true; home();
  });
  // Ada dokunmak seçimi tek başına o modüle/bölüme alır ve seçiciyi kapatır
  t.querySelectorAll('[data-solo]').forEach(b => b.onclick = () => {
    const s = b.dataset.solo, c = b.dataset.c;
    F.pick = {}; F.pick[s] = c ? [c] : [];
    savePref(); pickOpen = false; home();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  const ta = el('tAll');
  if (ta) ta.onclick = () => { F.pick = {}; savePref(); pickOpen = true; home(); };
  const tp = el('tPass');
  if (tp) tp.onclick = () => {
    openStats();
    const h = el('passHead');
    if (h) h.scrollIntoView({ block:'start', behavior:'smooth' });
  };
}
function toggleSubject(code){
  if (F.pick[code]) delete F.pick[code];
  else F.pick[code] = [];          // boş dizi = dersin tamamı
}
function toggleSection(code, sec){
  const s = SUBJ.find(x => x.c === code);
  const all = s.sec.map(x => x[0]);
  let sel = F.pick[code];
  if (!sel) sel = [];                       // ders seçili değildi
  else if (sel.length === 0) sel = all.slice();   // tamamı seçiliydi, tek tek yap
  else sel = sel.slice();
  const i = sel.indexOf(sec);
  i < 0 ? sel.push(sec) : sel.splice(i, 1);
  if (!sel.length) delete F.pick[code];
  else if (sel.length === all.length) F.pick[code] = [];
  else F.pick[code] = sel;
}

};
const URL_MAX = 7000;              // uzun soruda adres yerine yalnız kopyala

// ── "Sor" istatistiği: hangi soruyu yapay zekâya kaç kez sordun ──
// S.sor[id] = [kaç kez, son an]. Eşitlemede kart gibi büyük sayı kazanır.
function sorSay(id){

  const k = S.sor[id] || [0, 0];
  k[0]++; k[1] = Date.now();
  S.sor[id] = k;
  save();

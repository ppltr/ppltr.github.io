/** Düğmenin içi: "Sor" ya da "Kopyala" ve daha önce sorduysan kaç kez. */
function askEtiket(kopyala){
  const n = R && S.sor && S.sor[R.list[R.i][0]] ? S.sor[R.list[R.i][0]][0] : 0;
  return (kopyala ? 'Kopyala' : 'Sor') +
    (n ? '<i class="askn" title="Bu soruyu ' + n + ' kez sordun">' + n + '</i>' : '');

/** Kart başlığındaki "Sor" düğmesi. Adres çok uzunsa yalnız kopyalar. */
function askBtn(){
  const ai = AI[F.ai] || AI.chatgpt;
  const noQ = ai[1].indexOf('?q=') < 0 && ai[1].indexOf('?query=') < 0;
  const url = noQ ? ai[1] : (ai[1] + encodeURIComponent(askText()));
  const ttl = (ai[2] || (ai[0] + '\'a sor')) + ' — metin panoya da kopyalanır';
  return url.length <= URL_MAX
    ? '<a class="askbtn" id="ask" href="' + esc(url) + '" target="_blank" ' +
      'rel="noopener noreferrer" title="' + esc(ttl) + '">' + askEtiket(false) + '</a>'
    : '<button class="askbtn" id="ask" type="button" ' +
      'title="Soru çok uzun — panoya kopyalanır">' + askEtiket(true) + '</button>';
}

/** Soruyu, şıkları, doğru cevabı ve verilen cevabı düz metne çevirir. */
function askText(){
  if (!R) return '';
  const q = R.list[R.i], s = SUBJ[q[1]], sec = s.sec[q[2]];
  const okPos = R.order.indexOf(0);
  const L = [
    'Aşağıdaki soruyu açıkla: doğru cevap neden doğru, diğer şıklar neden yanlış? ' +
      'Kısa ve net yaz, Türkçe cevapla.',
    '',
    'Ders: ' + s.c + ' · ' + subjName(s) + (sec && sec[1] ? ' — ' + secName(sec) : ''),
    'Soru (' + q[0] + '): ' + qText(q),
    '',
  ];
  R.order.forEach((oi, pos) => L.push(KEYS[pos] + ') ' + qOpts(q)[oi]));
  L.push('', 'Doğru cevap: ' + KEYS[okPos] + ') ' + qOpts(q)[0]);
  if (R.picked !== null){
    const dogru = R.order[R.picked] === 0;
    L.push('Benim cevabım: ' + KEYS[R.picked] + ') ' + qOpts(q)[R.order[R.picked]] +
           (dogru ? '  (doğru)' : '  (yanlış)'));
  }
  // Türkçe kipteysek İngilizce aslını da ver: model çeviriye değil kaynağa baksın
  if (trMode() && q[10]) L.push('', 'Sorunun İngilizce aslı: ' + q[3],
    ...q[4].map((t, i) => '  ' + (i === 0 ? '(doğru) ' : '') + t));
  if (q[8]) L.push('', 'Not: Bu soruda bir şekil var, metne aktarılamadı.');
  if (q[7]) L.push('Not: Bu soru ders notundan üretilmiştir, gerçek sınav sorusu değildir.');
  return L.join('\n');
}
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); return true; }catch(e){}
  try{                                        // pano izni yoksa eski yöntem
    const ta = document.createElement('textarea');
    ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove(); return ok;
  }catch(e){ return false; }
}

// ── Soru ekranı ──
// ── Tur sayacı ──
/** 3:07 · 1:02:45 */
function saat(ms){
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600);
  const p2 = x => String(x).padStart(2, '0');
  return (h ? h + ':' + p2(Math.floor(t % 3600 / 60)) : Math.floor(t / 60)) + ':' + p2(t % 60);
}
/** 40 sn · 45 dk · 2 sa 5 dk */
function sureMetni(ms){
  if (ms < 6e4) return Math.max(0, Math.round(ms / 1000)) + ' sn';
  const dk = Math.round(ms / 6e4), sa = Math.floor(dk / 60);
  return sa ? sa + ' sa' + (dk % 60 ? ' ' + dk % 60 + ' dk' : '') : dk + ' dk';
}
/** Sayaç çipini günceller: süre, durdu mu, boşta mı. */
function tmrBoya(){
  if (!R) return;
  const bosta = !R.durdu && bostaMi();
  // Tur sayacı (dokunulabilir): yalnız çalışma süresi
  const t = el('tmr');
  if (t){
    t.classList.toggle('off', !!R.durdu);
    t.classList.toggle('bosta', bosta);
    t.setAttribute('aria-pressed', R.durdu ? 'true' : 'false');
    t.title = R.durdu ? 'Sayaçlar durdu · devam etmek için dokun (P)'
      : bosta ? '3 dakikadır dokunmadın, sayaçlar durdu · dokununca sürer'
      : 'Bu turda çalıştığın süre · durdurmak için dokun (P)';
    t.setAttribute('aria-label', (R.durdu ? 'Sayaçlar durdu. ' : '') +
      'Tur süresi ' + saat(R.sure || 0));
    t.querySelector('.tv').textContent = saat(R.sure || 0);
  }
  // Soru sayacı: her yeni soruda 0:00'dan başlar. Cevaplanınca o sorunun
  // süresinde donar; geri dönünce de o süre görünür. Yanında çalışma ortalaman.
  const q = el('qtm');
  if (q){
    const id = R.list[R.i][0], acik = R.qAcik === id;
    const ms = acik ? (R.qAcc[id] || 0)
      : id in R.qSon ? R.qSon[id]
      : R.round === 1 && S.qt && S.qt[id] ? S.qt[id][2] : null;
    const ort = R.qN ? R.qTop / R.qN : null;
    q.classList.toggle('dur', acik && (R.durdu || bosta));
    q.classList.toggle('bitti', !acik);
    q.classList.toggle('uzun', ms !== null && ms >= YAVAS_MS);
    q.innerHTML = 'bu soru <b class="qv">' + (ms === null ? '–' : saat(ms)) + '</b>' +
      (ort !== null ? '<span class="qo"> · ort ' + saat(ort) + '</span>' : '');
    q.title = (acik ? 'Bu soruda geçen çalışma süresi; her yeni soruda sıfırdan başlar'
                    : 'Bu soruya harcadığın süre') +
      (ort !== null ? ' · ort: bu turda cevapladığın soruların ortalaması' : '') +
      ' · 1 dakikayı geçince turuncu olur';
  }
}
// ── Soru başına süre ──
// Soruyu gördüğün andan cevapladığın ana kadar geçen ÇALIŞMA süresi — tur
// sayacıyla aynı ölçü, saniye saniye `sureEkle` ile ekrandaki cevaplanmamış
// soruya (`R.qAcik`) akar. Geri gidip gelince toplanır. Yalnız turun ilk
// denemesi kaydedilir: yanlış turundaki tekrar hızlıdır, ortalamayı bozar.
// S.qt[id] = [toplam ms, kaç kez, son ms, en uzun ms]
/** Ekrandaki soru cevaplanmamışsa süre ona akar, cevaplıysa hiçbirine.
 *  Önce o ana kadarki süre bir önceki soruya yazılır. */
function soruAc(){
  if (!R) return;
  akit(Date.now());
  R.qAcik = R.picked === null ? R.list[R.i][0] : null;
}
/** Süreyi yazıp akışı keser (cevapta, ana ekrana dönüşte). */
function soruKapat(){
  if (!R) return;
  akit(Date.now());
  R.qAcik = null;
}
/** Cevap anında sorunun süresini kaydeder. */
function soruSureYaz(id){
  const ms = Math.round(R.qAcc[id] || 0);
  delete R.qAcc[id];
  R.qSon[id] = ms;                              // bu turda geri dönünce görünsün
  if (R.round !== 1) return;
  R.qTop = (R.qTop || 0) + ms; R.qN = (R.qN || 0) + 1;
  if (!S.qt || typeof S.qt !== 'object') S.qt = {};
  const t = S.qt[id] || [0, 0, 0, 0];
  t[0] += ms; t[1]++; t[2] = ms; t[3] = Math.max(t[3], ms);
  S.qt[id] = t;
}

/** Elle durdur / sürdür. Durmadan önceki süre tura yazılır. */
function tmrCevir(){
  if (!R) return;
  akit(Date.now());                            // durmadan önceki süre yazılsın
  R.durdu = !R.durdu;
  sureYaz(); save();
  tmrBoya();
}

// Yeni soruda şık, hareketsiz imlecin altında kaldığı için "seçili" gibi
// yanıyordu. Vurgu artık imleç çizimden sonra gerçekten kıpırdayınca açılır.
let imlec = null, hovCapa = null;
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  imlec = [e.clientX, e.clientY];
  const o = el('opts');
  if (!o || o.classList.contains('hov')) return;
  if (!hovCapa || Math.abs(imlec[0] - hovCapa[0]) + Math.abs(imlec[1] - hovCapa[1]) > 4)
    o.classList.add('hov');
}, { passive:true });

    let cls = 'opt', mark = '';

function when(k){
  if (!k) return '';
  const d = k[1] - Date.now();
  if (d < 36e5) return 'Tekrar: ' + Math.max(1, Math.round(d/6e4)) + ' dakika sonra';
  if (d < DAY)  return 'Tekrar: ' + Math.round(d/36e5) + ' saat sonra';
  return 'Tekrar: ' + Math.round(d/DAY) + ' gün sonra';
}
function deckName(){
  const d = DECKS.find(x => x.k === F.deck);
  if (d) return d.t;
  if (F.deck === 'leech') return 'Takıldıklarım';
  if (F.deck === 'slow') return 'Uzun sürenler';
  const ks = Object.keys(F.pick);
  return ks.length ? ks.join(', ') : 'Tüm dersler';
}

function done(){
  clearTimeout(advT);
  if (R) akit(Date.now());                  // son sorudaki süre de tura yazılsın
  const rec = runRec();
  if (rec){
    rec.i = R.i; rec.round = R.round; rec.log = R.log.slice();
    rec.tN = Date.now(); rec.done = true;
    rec.sure = Math.round(R.sure || 0); rec.bos = Math.round(R.bos || 0); delete rec.durdu;
    rec.qTop = Math.round(R.qTop || 0); rec.qN = R.qN || 0; delete rec.qAn;
    delete rec.ids; delete rec.missed;        // bitmiş tur geri yüklenmez
    if (!rec.log.length) S.runs.splice(S.runs.indexOf(rec), 1);
    save();
  }
  const live = R ? { log:R.log, round:R.round, t0:R.t0, tN:Date.now(),
                     sure:Math.round(R.sure || 0), sureTam:R.sureTam,
                     bos:Math.round(R.bos || 0), bosTam:R.bosTam,
                     qTop:Math.round(R.qTop || 0), qN:R.qN || 0 } : null;
  R = null;
  if (!live || !live.log.length) return home();
  report(live, true);
}

/** Tur raporu — hem tur biter bitmez hem de geçmişten açılınca çizilir. */
function report(rec, live){
  const log = rec.log || [], rounds = rec.round || 1;
  const first = log.filter(x => x.round === 1);
  const ok = first.filter(x => x.ok).length;
  const pct = first.length ? Math.round(ok / first.length * 100) : 0;
  // Etkin süre: sayfada ve başında olduğun süre. Yalnız süresi baştan ölçülen
  // turda (sureTam) yazılır; sayaçtan önce başlamış turun önceki cevapları
  // zamanlanmadığı için hem süre hem ortalama eksik çıkardı. O turlar eski
  // davranışla duvar saatine düşer.
  const sure = rec.sureTam && typeof rec.sure === 'number' ? rec.sure : null;
  const sureYazi = sure !== null ? sureMetni(sure)
    : Math.max(1, Math.round(((rec.tN || Date.now()) - rec.t0) / 6e4)) + ' dakika';
  // Bankadan silinmiş soru (ör. emekli üretilmiş kimlikler) raporu çökertmesin;
  // sayılar günlükten geldiği için isabet yüzdesi değişmez.
  const seen = [...new Set(log.map(x => x.id))].filter(id => BY_ID.has(id));

  el('view').innerHTML =
    '<div class="card"><div style="padding:24px 16px; text-align:center">' +
      '<div class="lbl">' + (live ? 'Tur bitti' : esc(rec.title || 'Tur')) + ' · ' + sureYazi +
        (rounds > 1 ? ' · ' + rounds + ' tur' : '') + '</div>' +
      '<div class="score" style="color:' + (pct >= 75 ? 'var(--ok)' : pct >= 50 ? 'var(--ink)' : 'var(--bad)') +
        '">%' + pct + '</div>' +
      '<div class="lbl" style="margin-top:5px">İlk denemede <span class="num">' + ok +
        '</span> / <span class="num">' + first.length + '</span> doğru</div>' +
      (sure && log.length ? '<div class="note" style="margin-top:6px">Soru başına ortalama ' +
        '<b>' + sureMetni(rec.qN ? rec.qTop / rec.qN : sure / log.length) + '</b>' +
        (rec.bosTam ? ' · ekran açık ama boşta <b>' + sureMetni(rec.bos || 0) + '</b>' : '') +
        '</div>' : '') +
      (rounds > 1 ? '<div class="note" style="margin-top:8px">Yanlış yaptıkların tekrar soruldu, ' +
        'hepsini bilene kadar devam edildi.</div>' : '') + '</div>' +
    (() => {
      const row = id => {
        const q = BY_ID.get(id);
        const tries = log.filter(x => x.id === id);
        const firstOk = tries[0].ok;
        const fixed = tries.length > 1 && tries[tries.length - 1].ok;
        // Süre yalnız tur biter bitmez: geçmişten açılan eski turda son deneme
        // başka bir tura ait olabilir
        const tm = live && S.qt && S.qt[id] ? S.qt[id][2] : null;
        return '<div class="rrow"><span class="rdot ' + (firstOk ? 'ok' : 'bad') + '"></span>' +
          '<div style="min-width:0"><div class="q">' + esc(qText(q)) + '</div><div class="a">' +
          (firstOk ? '<b>' + esc(qOpts(q)[0]) + '</b>'
                   : '<i>İlk seçimin: ' + esc(qOpts(q)[tries[0].pick]) + '</i> · <b>Doğru: ' +
                     esc(qOpts(q)[0]) + '</b>' + (fixed ? ' · sonra bildin' : '')) +
          '</div></div>' +
          (tm !== null ? '<span class="rtm' + (tm >= YAVAS_MS ? ' slow' : '') + '">' + saat(tm) +
            '</span>' : '') + '</div>';
      };
      const bad = seen.filter(id => !log.filter(x => x.id === id)[0].ok);
      const good = seen.filter(id => log.filter(x => x.id === id)[0].ok);
      // Yanlışlar önce ve açık; doğrular katlı — uzun turlarda ekran şişmesin
      return (bad.length
          ? '<div class="rhead"><span class="lbl">İlk denemede yanlış · ' + bad.length + '</span></div>' +
            bad.map(row).join('')
          : '') +
        (good.length
          ? '<button class="rfold" id="foldOk" type="button" aria-expanded="false">' +
              '<span class="lbl">İlk denemede doğru · ' + good.length + '</span>' +
              '<span class="chev">›</span></button>' +
            '<div id="okList" class="hidden">' + good.map(row).join('') + '</div>'
          : '');
    })() + '</div>' +
    '<div class="acts">' +
      (live ? '<button class="go" id="again" type="button">Devam et</button>' : '') +
      '<button class="go2" id="back" type="button">Ana ekran</button></div>';
  const fo = el('foldOk');
  if (fo) fo.onclick = () => {
    const list = el('okList');
    const open = !list.classList.contains('hidden');
    list.classList.toggle('hidden', open);
    fo.setAttribute('aria-expanded', String(!open));
    fo.classList.toggle('open', !open);
  };
  const ag = el('again');
  if (ag) ag.onclick = start;
  el('back').onclick = home;
}

/** Bütün cihazların süresi: bugün, son 7 gün, toplam ve gün gün. Bu
 *  cihazda açık olan (henüz yazılmamış) aralık da katılır. */
function sureOzet(ad){
  ad = ad || 'sure';
  const bug = today(), hafta = new Date(Date.now() - 6 * DAY).toISOString().slice(0, 10);
  const o = { top:0, bugun:0, hafta:0, gun:{} };
  Object.values(S[ad] || {}).forEach(k => {
    if (!k || typeof k !== 'object') return;
    o.top += +k.t || 0;
    Object.keys(k.g || {}).forEach(d => {
      const ms = +k.g[d] || 0;
      o.gun[d] = (o.gun[d] || 0) + ms;
      if (d === bug) o.bugun += ms;
      if (d >= hafta) o.hafta += ms;
    });
  });
  return o;
}
/** Durum panelinde soru başına süre: en uzun ve en kısa sürenler (ortalamaya
 *  göre). Liste bütün derslerden; geçilen ders ve kapalı süzgeçler dışarıda. */
function qtBlok(){
  const L = Object.keys(S.qt || {}).map(id => {
    const q = BY_ID.get(+id), t = S.qt[id];
    return q && Array.isArray(t) && t[1] > 0 && inToggles(q) ? { q, ort: t[0] / t[1], t } : null;
  }).filter(Boolean);
  if (!L.length) return '';
  const genel = L.reduce((a, x) => a + x.t[0], 0) / L.reduce((a, x) => a + x.t[1], 0);
  const satir = x => '<div class="qtrow"><span class="qtx">' + esc(qText(x.q)) + '</span>' +
    '<span class="qtv"><b' + (x.t[2] >= YAVAS_MS ? ' class="slow"' : '') + '>' + saat(x.ort) +
    '</b><i>' + x.t[1] + ' kez · son ' + saat(x.t[2]) + '</i></span></div>';
  const uzun = L.slice().sort((a, b) => b.ort - a.ort).slice(0, 8);
  const kisa = L.length >= 10 ? L.slice().sort((a, b) => a.ort - b.ort).slice(0, 5) : [];
  const slowN = L.filter(x => x.t[2] >= YAVAS_MS).length;
  return '<div class="lbl" style="margin:16px 0 7px">Soru başına süre</div>' +
    '<div class="note" style="margin-bottom:9px">Ölçülen <b>' + L.length + '</b> soruda ortalama <b>' +
      saat(genel) + '</b>. Soruyu gördüğün andan cevaplayana kadar geçen çalışma süresi; ' +
      'boşta ve durdurulmuş süre girmez, yanlış turundaki tekrar sayılmaz.</div>' +
    '<div class="lbl" style="margin:0 0 5px">En uzun sürenler</div>' +
    '<div class="qtlist">' + uzun.map(satir).join('') + '</div>' +
    (kisa.length ? '<div class="lbl" style="margin:12px 0 5px">En kısa sürenler</div>' +
      '<div class="qtlist">' + kisa.map(satir).join('') + '</div>' : '') +
    (slowN ? '<div class="note" style="margin-top:10px"><b style="color:var(--due)">' + slowN +
      '</b> sorunun son denemesi 1 dakikayı geçti. <button class="tbtn" id="goSlow" type="button" ' +
      'title="Bütün derslerdeki uzun sürenlerle, en yavaştan başlayan bir tur açar">' +
      'Bunlara çalış</button></div>' : '');
}
/** Durum panelinde: yapay zekâya en çok sorduğun sorular. */
function sorBlok(){
  const L = Object.keys(S.sor || {}).map(id => {
    const q = BY_ID.get(+id), k = S.sor[id];
    return q && Array.isArray(k) && k[0] > 0 && inToggles(q) ? { q, k } : null;
  }).filter(Boolean);
  if (!L.length) return '';
  const top = L.reduce((a, x) => a + x.k[0], 0);

    '<span class="qtv"><b>' + x.k[0] + ' kez</b><i>son ' + stamp(x.k[1]) + '</i></span></div>';
  return '<div class="lbl" style="margin:16px 0 7px">Yapay zekâya sorduğun sorular</div>' +
    '<div class="note" style="margin-bottom:9px"><b>Sor</b> düğmesine toplam <b>' + top +
      '</b> kez, <b>' + L.length + '</b> farklı soruda bastın. Çok sorduğun soru, konuyu ' +

      .slice(0, 8).map(satir).join('') + '</div>';

function openStats(){
  let seen = 0, wrong = 0, tot = 0;
  Object.keys(S.c).forEach(id => { const k = S.c[id]; tot += k[2]; wrong += k[3]; seen++; });
  const pct = tot ? Math.round((tot - wrong) / tot * 100) : null;
  const dueN = deckCount('due'), wrongN = deckCount('wrong'), leech = deckCount('leech');
  // Kapsam sayacı: geçilen dersler hem payda hem payda dışında
  const scopedIds = new Set(QS.filter(q => !q[6] && notPassed(q)).map(q => q[0]));
  const seenScoped = Object.keys(S.c).filter(id => scopedIds.has(+id)).length;

  const per = SUBJ.map((s, si) => {
    const qs = QS.filter(q => q[1] === si && !q[6]);
    let n = 0, o = 0, u = 0;
    qs.forEach(q => { const k = S.c[q[0]]; if (k){ u++; n += k[2]; o += k[2] - k[3]; } });
    return { c:s.c, bank:qs.length, uniq:u, n, pct: n ? Math.round(o/n*100) : null };
  });
  // en zayıf bölümler
  const secs = [];
  SUBJ.forEach((s, si) => s.sec.forEach((sc, i) => {
    let n = 0, o = 0;
    QS.forEach(q => { if (q[1] === si && q[2] === i){ const k = S.c[q[0]];
      if (k){ n += k[2]; o += k[2] - k[3]; } } });
    if (n >= 4) secs.push({ c:sc[0], t:secName(sc), n, pct: Math.round(o/n*100) });
  }));
  secs.sort((a,b) => a.pct - b.pct);

  const days = [];
  for (let i = 44; i >= 0; i--){
    const d = new Date(Date.now() - i*DAY).toISOString().slice(0,10);
    days.push([d, (S.day[d] || [0,0])[0]]);
  }
  const sureT = sureOzet(), bosT = sureOzet('bos');
  const mx = Math.max(1, ...days.map(d => d[1]));
  const lvl = n => !n ? '' : n < mx*.25 ? 'l1' : n < mx*.5 ? 'l2' : n < mx*.8 ? 'l3' : 'l4';
  let streak = 0;
  for (let i = days.length - 1; i >= 0; i--){ if (days[i][1]) streak++; else if (i !== days.length-1) break; }

  el('sheetBody').innerHTML =
    '<h2>Durum</h2>' +
    '<div class="whobox"><span class="lbl">Adın</span>' +
      '<div class="whorow"><input id="pname" maxlength="28" value="' + esc(ME) + '">' +
        '<button class="tbtn" id="pSave" type="button">Kaydet</button></div>' +
      '<div class="note">' + (Cloud.user
        ? 'Google hesabındaki adın. Değiştirirsen bulutta da yeni adla saklanır.'
        : 'Sistem rastgele verdi — istediğin gibi değiştir. ' +
          'İlerlemen bu ada bağlı saklanır.') + '</div>' +
      (PROFILES.length > 1
        ? '<div class="whorow" style="margin-top:8px">' +
          '<select id="prof">' + PROFILES.map(x => '<option' + (x === ME ? ' selected' : '') +
            '>' + esc(x) + '</option>').join('') + '</select>' +
          '<button class="tbtn" id="pNew" type="button">+ Yeni</button></div>'
        : '<div class="whorow" style="margin-top:8px">' +
          '<button class="tbtn" id="pNew" type="button">+ Yeni profil</button></div>') +
    '</div>' +
    '<div class="stat4">' +
      '<div class="s"><span class="lbl">Başarı</span><div class="v">' + (pct === null ? '—' : '%'+pct) + '</div></div>' +
      '<div class="s"><span class="lbl">Tekrar zamanı</span><div class="v due">' + dueN + '</div></div>' +
      '<div class="s"><span class="lbl">Yanlış defteri</span><div class="v bad">' + wrongN + '</div></div>' +
      '<div class="s"><span class="lbl">Seri</span><div class="v">' + streak + ' gün</div></div></div>' +
    '<div class="lbl" style="margin-bottom:7px">Son 45 gün</div>' +
    '<div class="heat">' + days.map(d => '<i class="' + lvl(d[1]) + '" title="' + d[0] +
      ' · ' + d[1] + ' soru' + (sureT.gun[d[0]] >= 6e4 ? ' · ' + sureMetni(sureT.gun[d[0]]) : '') +

/** Yedek metnini mevcut ilerlemeyle birleştirir; daha çok görülmüş kayıt kazanır. */
/**
 * Gelen durumu hedefe kaynaştırır. Kart bazında "daha çok görülmüş" kazanır;
 * gün sayaçları en büyükte birleşir; turlar id'ye göre son dokunulanla gelir.
 * Geçilen sınavlar bir aç/kapa kararı olduğu için zaman damgasıyla son yazan
 * kazanır — birleştirmek kaldırdığın dersi geri getirirdi.
 */
/**
 * Aynı id'li iki tur kaydından hangisi daha ileri? Zaman damgasına bakmak
 * yanlıştı: açılışta yerel tur `saveRun()` ile tN'sini tazeliyor, böylece
 * başka cihazdaki gerçek ilerlemeyi yenip onu buluta geri yazıyordu.
 * Ölçü artık cevaplanmış soru sayısı; eşitse biten kazanır, sonra konum,
 * en son zaman damgası.
 */
function runIleri(a, b){
  const la = (a.log || []).length, lb = (b.log || []).length;
  if (la !== lb) return la > lb;
  if (!!a.done !== !!b.done) return !!a.done;
  const ia = a.i || 0, ib = b.i || 0;
  if (ia !== ib) return ia > ib;
  return (a.tN || 0) > (b.tN || 0);
}

function mergeState(t, p){
  Object.keys(p.c || {}).forEach(id => {
    const a = t.c[id], b = p.c[id];
    if (Array.isArray(b) && b.length === 5 && (!a || b[2] > a[2])) t.c[id] = b;
  });
  t.star = Array.from(new Set((t.star || []).concat(p.star || [])));
  Object.keys(p.day || {}).forEach(d => {
    const a = t.day[d] || [0,0], b = p.day[d];
    if (Array.isArray(b)) t.day[d] = [Math.max(a[0], b[0]), Math.max(a[1], b[1])];
  });
  if ((p.pAt || 0) > (t.pAt || 0)){
    t.passed = (p.passed || []).slice();
    t.pAt = p.pAt;
  }
  // Süre cihaz başına artan bir sayaç: aynı cihazın iki kopyasından büyüğü
  // doğrudur, farklı cihazlar ayrı anahtarda durur ve toplamda ikisi de sayılır.
  // "Sor" sayıları: büyük sayı kazanır, eşitse son soran
  if (p.sor && typeof p.sor === 'object'){
    if (!t.sor || typeof t.sor !== 'object') t.sor = {};
    Object.keys(p.sor).forEach(id => {
      const a = t.sor[id], b = p.sor[id];
      if (Array.isArray(b) && b.length === 2 &&
          (!a || b[0] > a[0] || (b[0] === a[0] && b[1] > a[1]))) t.sor[id] = b;
    });
  }
  // Soru süreleri: kart gibi, daha çok denenmiş kayıt kazanır
  if (p.qt && typeof p.qt === 'object'){
    if (!t.qt || typeof t.qt !== 'object') t.qt = {};
    Object.keys(p.qt).forEach(id => {
      const a = t.qt[id], b = p.qt[id];
      if (Array.isArray(b) && b.length === 4 && (!a || b[1] > a[1])) t.qt[id] = b;
    });
  }
  ['sure', 'bos'].forEach(ad => {
    if (!p[ad] || typeof p[ad] !== 'object') return;
    if (!t[ad] || typeof t[ad] !== 'object') t[ad] = {};
    Object.keys(p[ad]).forEach(cz => {
      const b = p[ad][cz];
      if (!b || typeof b !== 'object') return;
      const a = t[ad][cz] || (t[ad][cz] = { t:0, g:{} });
      if (!a.g) a.g = {};
      a.t = Math.max(a.t || 0, +b.t || 0);
      Object.keys(b.g || {}).forEach(d => { a.g[d] = Math.max(a.g[d] || 0, +b.g[d] || 0); });
    });
  });
  // Ayarlar bir tercih kümesidir, birleştirilemez — en son kaydedilen kazanır
  if (p.pref && (p.prefAt || 0) > (t.prefAt || 0)){
    t.pref = Object.assign({}, p.pref);
    t.prefAt = p.prefAt;
  }
  const byId = {};
  (t.runs || []).concat(p.runs || []).forEach(r => {
    if (!r || !r.id) return;
    const v = byId[r.id];
    if (!v || runIleri(r, v)) byId[r.id] = r;
  });
  t.runs = Object.keys(byId).map(k => byId[k])
    .sort((a, b) => (b.t0 || 0) - (a.t0 || 0)).slice(0, RUN_MAX);
  return t;
}
function merge(text){
  let p;
  try{ p = JSON.parse(text); }catch(e){ return 'Metin bozuk — tamamını kopyaladığından emin ol.'; }
  if (!p || p.v !== 2 || typeof p.c !== 'object') return 'Bu bir ATPL Çalışma yedeği değil.';
  const oncePref = S.prefAt || 0;
  mergeState(S, p);
  if ((S.prefAt || 0) !== oncePref) applyPref();   // buluttan daha yeni ayar geldi
  save();
  return true;
}
/** Buluttan gelen bir profili yerele kaynaştırır (aktif profil de olabilir). */
function mergeProfile(name, text){
  if (name === ME) return merge(text) === true;
  let p;
  try{ p = JSON.parse(text); }catch(e){ return false; }
  if (!p || p.v !== 2 || typeof p.c !== 'object') return false;
  let cur = blank();
  try{
    const raw = JSON.parse(ls.get(keyOf(name)) || 'null');
    if (raw && raw.v === 2) cur = Object.assign(blank(), raw);
  }catch(e){}
  mergeState(cur, p);
  ls.set(keyOf(name), JSON.stringify(cur));
  if (PROFILES.indexOf(name) < 0){
    PROFILES.push(name);
    ls.set('atpl.profiles', JSON.stringify(PROFILES));
  }
  return true;
}

/** Küçük Markdown dönüştürücü — başlık, tablo, liste, kalın, kod, alıntı. */
function md(src){
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0, list = null;
  const closeList = () => { if (list){ out.push('</' + list + '>'); list = null; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l) && /^\s*\|?[\s:-]*-[\s:|-]*$/.test(lines[i+1] || '')){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw"><table><thead><tr>' +
        head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){
      closeList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ closeList(); out.push('<hr>'); }
    else if ((m = l.match(/^\s*>\s?(.*)$/))){
      closeList();
      // Ardışık alıntı satırları tek bloğa toplanır
      const qb = [m[1]];
      let q2;
      while (i + 1 < lines.length && (q2 = lines[i+1].match(/^\s*>\s?(.*)$/))){
        if (!q2[1].trim()) break;
        qb.push(q2[1]); i++;
      }
      out.push('<blockquote>' + inline(qb.join(' ')) + '</blockquote>');
    }
    else if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){
      if (list !== 'ul'){ closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inline(m[1]) + '</li>');
    } else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
      if (list !== 'ol'){ closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inline(m[1]) + '</li>');
    } else if (!l.trim()){ closeList(); }
    else {
      closeList();
      // Yumuşak satır sonları tek paragrafa toplanır
      const buf = [l];
      while (i + 1 < lines.length){
        const nx = lines[i+1];
        if (!nx.trim() || /^\s*([-*+]|\d+[.)])\s/.test(nx) || /^#{1,4}\s/.test(nx) ||
            /^\s*>/.test(nx) || /^\s*\|/.test(nx) || /^\s*(-{3,}|\*{3,})\s*$/.test(nx)) break;
        buf.push(nx); i++;
      }
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
    }
    i++;
  }
  closeList();
  return out.join('');
}

// ── Parmakla kaydırma: sola sonraki, sağa önceki soru ──
// Telefonda ok tuşu yok ve gezinme paneli bulunması zor; kaydırma hiç yer
// kaplamadan aynı işi yapar. Dikey kaydırmayı bozmamak için hareketin yatay
// baskın, yeterince uzun ve yeterince hızlı olması aranır.
let sonKaydirma = 0;
(function(){
  let x0 = null, y0 = null, bas = 0, iptal = false;
  const ESIK = 55, EGIM = 1.5, SURE = 800;
  addEventListener('touchstart', e => {
    iptal = true;
    if (!R || e.touches.length !== 1) return;
    if (el('sheet') && el('sheet').classList.contains('on')) return;
    const tg = e.target;
    if (tg && tg.closest && tg.closest('input, textarea, select, .navpop, .figbox')) return;
    iptal = false;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; bas = Date.now();
  }, { passive: true });
  addEventListener('touchend', e => {
    if (iptal || x0 === null || !R){ x0 = null; return; }
    const t2 = e.changedTouches[0];
    const dx = t2.clientX - x0, dy = t2.clientY - y0;
    x0 = null;
    if (Date.now() - bas > SURE) return;
    if (Math.abs(dx) < ESIK || Math.abs(dx) < Math.abs(dy) * EGIM) return;
    sonKaydirma = Date.now();          // şıkka dokunma sanılmasın
    if (dx < 0) nextQ(); else prevQ();
  }, { passive: true });
})();

document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && tg.matches && tg.matches('input, select, textarea')) return;
  if (e.key === 'Escape'){
    if (navOpen && R){ el('navBtn').click(); return; }
    closeSheet(); return;
  }
  if (!R) return;
  const k = e.key;
  let p = -1;
  if (k >= '1' && k <= '5') p = +k - 1;                     // 1–5
  else if (/^[a-eA-E]$/.test(k)) p = k.toLowerCase().charCodeAt(0) - 97;   // A–E
  if (p >= 0){
    if (p < R.order.length && R.picked === null){ pick(p); e.preventDefault(); }
    return;
  }
  if (k === 'Enter'){ if (R.picked !== null){ next(); e.preventDefault(); } }
  else if (k === 'ArrowRight'){ nextQ(); e.preventDefault(); }
  else if (k === 'ArrowLeft'){ prevQ(); e.preventDefault(); }
  else if (k === 'Home'){ goTo(0); e.preventDefault(); }
  else if (k === 'End'){ goTo(R.list.length - 1); e.preventDefault(); }
  else if (k === 's' || k === 'S'){
    const b = el('star'); if (b){ b.click(); e.preventDefault(); }
  }
  else if (k === 'p' || k === 'P'){ tmrCevir(); e.preventDefault(); }
});

loadProfile();
// Kapsam varsayılan olarak TÜM banka: açılışta modül daraltması yapılmaz.
// Kullanıcı isterse konu seçicisinden daraltır; seçim onun kararıdır.
paintWho();
if (S.runs[0] && !S.runs[0].done) resumeRun(S.runs[0].id); else home();
Cloud.init();
})();
</script>
